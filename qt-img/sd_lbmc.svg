<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" width="720" height="380"><rect width="720" height="380" fill="#fff"/><rect x="100" y="130" width="620" height="170" fill="#e3f0fb"/><path d="M0 120 L40 100 L100 130 L100 300 L0 300 Z" fill="#d9c9a3"/><rect x="100" y="52" width="130" height="78" fill="#cfe4f7" stroke="#fff" stroke-width="2"/><text x="165.0" y="70" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#1b2430">Lãnh hải</text><text x="165.0" y="85" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.5" fill="#1b2430">đến 12 hải lý</text><rect x="230" y="52" width="100" height="78" fill="#bddaf3" stroke="#fff" stroke-width="2"/><text x="280.0" y="70" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#1b2430">Tiếp giáp</text><text x="280.0" y="85" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#1b2430">lãnh hải</text><text x="280.0" y="100" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.5" fill="#1b2430">đến 24 hải lý</text><rect x="330" y="52" width="270" height="78" fill="#a9cdee" stroke="#fff" stroke-width="2"/><text x="465.0" y="70" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#1b2430">Vùng đặc quyền kinh tế</text><text x="465.0" y="85" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.5" fill="#1b2430">đến 200 hải lý</text><rect x="600" y="52" width="120" height="78" fill="#e8eef7" stroke="#fff" stroke-width="2"/><text x="660.0" y="70" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#1b2430">Biển quốc tế</text><text x="660.0" y="85" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.5" fill="#1b2430">(biển cả)</text><rect x="0" y="52" width="100" height="68" fill="#eaf4ea" stroke="#fff" stroke-width="2"/><text x="50" y="72" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#1b2430">Đất liền</text><text x="50" y="90" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11.5" fill="#1b2430">và nội thủy</text><text x="50" y="104" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11.5" fill="#1b2430">(phía trong)</text><text x="100" y="40" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" fill="#8a1f1f" font-weight="700">Đường cơ sở</text><path d="M100 46 V134" stroke="#8a1f1f" stroke-width="2" stroke-dasharray="5 4"/><path d="M100 130 C220 160 400 180 520 190 C570 205 600 250 640 280 L720 290 L720 300 L100 300 Z" fill="#c9b78f"/><path d="M100 130 C220 160 400 180 520 190 C570 205 600 250 640 280 L720 290" fill="none" stroke="#8a7a52" stroke-width="2"/><path d="M100 232 H580" stroke="#2f6fd6" stroke-width="2.5"/><path d="M110 226 L100 232 L110 238 Z M570 226 L580 232 L570 238 Z" fill="#2f6fd6"/><text x="340" y="252" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#1b2430">Thềm lục địa</text><text x="340" y="270" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.5" fill="#1b2430">tối thiểu 200 hải lý; tối đa 350 hải lý tính từ đường cơ sở</text><text x="340" y="286" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.5" fill="#1b2430">hoặc 100 hải lý tính từ đường đẳng sâu 2.500 m</text><text x="640" y="262" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#1b2430">Vùng</text><text x="640" y="279" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.5" fill="#1b2430">(đáy đại dương</text><text x="640" y="294" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.5" fill="#1b2430">ngoài thềm lục địa)</text><text x="360" y="335" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.5" fill="#445" >Mặt cắt minh họa, không theo tỷ lệ. Các mốc theo UNCLOS 1982 (Điều 3, 33, 57, 76).</text><text x="360" y="355" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.5" fill="#445" >Thềm lục địa tính từ đường cơ sở; vùng đặc quyền kinh tế và thềm lục địa chồng lên nhau ở phần nước và đáy biển.</text></svg>