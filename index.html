<script>window.EMBED={"SOAN_THU_20261026_CISG_HINH_THANH": [["FORM-00", "0_PHAM_VI", "Chủ đề và điều kiện đứng trước", "Chủ đề: Hợp đồng hình thành khi nào (chào hàng và chấp nhận). Chương nguồn trong Sheet: II.4. Chủ đề này giả định CISG đã áp dụng được cho giao dịch. Người học phải kiểm tra trước: hai bên có trụ sở ở hai quốc gia khác nhau và cùng là quốc gia thành viên, hoặc quy tắc tư pháp quốc tế dẫn tới luật của một quốc gia thành viên; các bên không loại trừ CISG. Tình trạng thành viên và các bảo lưu của từng nước cần kiểm tra khi giải một đề cụ thể.", "CISG Điều 1(1), Điều 6", "QUY_DINH_RO_DOI_CHIEU_UNTS_DIEN_GIAI", "https://treaties.un.org/doc/Publication/UNTS/Volume%201489/volume-1489-I-25567-English.pdf", "", "", "DE_XUAT_CHUA_DUYET"], ["FORM-01", "1_CAU_HOI", "Câu hỏi đời thường", "Công ty A ở Việt Nam gửi thư chào bán một lô thép cho công ty B ở Hàn Quốc. B trả lời lại. Từ lúc nào hai bên bị ràng buộc bởi hợp đồng? Và trong thời gian chờ, bên nào còn có thể đổi ý?", "", "QUAN_DIEM_GIANG_DAY", "", "", "", "DE_XUAT_CHUA_DUYET"], ["FORM-02", "2_QUY_TAC", "Quy tắc một câu", "Hợp đồng theo CISG hình thành vào đúng lúc lời chấp nhận có hiệu lực. Lời chấp nhận có hiệu lực khi nó đến được người chào hàng. Và nó chỉ là chấp nhận khi đồng ý với chào hàng mà không sửa đổi trọng yếu.", "CISG Điều 23, Điều 18(2), Điều 19", "QUY_DINH_RO_DOI_CHIEU_UNTS_DIEN_GIAI", "https://treaties.un.org/doc/Publication/UNTS/Volume%201489/volume-1489-I-25567-English.pdf", "", "", "DE_XUAT_CHUA_DUYET"], ["FORM-03A", "3_SO_DO", "Cây quyết định: đã có hợp đồng chưa", "Đi theo năm câu hỏi theo thứ tự. Mỗi câu có hai lối rẽ, dẫn tới kết luận.", "CISG Điều 14 đến Điều 24", "QUY_DINH_RO_DOI_CHIEU_UNTS_DIEN_GIAI", "", "CAY_QUYET_DINH", "{\"start\":\"q1\",\"nodes\":[{\"id\":\"q1\",\"cspl\":\"Điều 14\",\"text\":\"Đề nghị gửi cho người xác định, đủ rõ về hàng, số lượng và giá (hoặc cách xác định), và thể hiện ý định bị ràng buộc nếu được chấp nhận?\",\"yes\":\"q2\",\"no\":\"e1\"},{\"id\":\"q2\",\"cspl\":\"Điều 15, 16, 17\",\"text\":\"Chào hàng đã đến người nhận, và chưa bị rút, thu hồi hợp lệ hay bị từ chối?\",\"yes\":\"q3\",\"no\":\"e2\"},{\"id\":\"q3\",\"cspl\":\"Điều 18(1), 19\",\"text\":\"Câu trả lời thể hiện sự đồng ý, và không sửa đổi trọng yếu (giá, thanh toán, chất lượng, số lượng, nơi và thời điểm giao hàng, mức trách nhiệm, giải quyết tranh chấp)?\",\"yes\":\"q4\",\"no\":\"e3\"},{\"id\":\"q4\",\"cspl\":\"Điều 18(2), 20, 24\",\"text\":\"Chấp nhận đến người chào hàng trong thời hạn đã ấn định, hoặc trong thời hạn hợp lý nếu không ấn định?\",\"yes\":\"e4\",\"no\":\"q5\"},{\"id\":\"q5\",\"cspl\":\"Điều 21\",\"text\":\"Người chào hàng có kịp thời báo cho người nhận rằng vẫn coi chấp nhận muộn là có hiệu lực?\",\"yes\":\"e4\",\"no\":\"e5\"}],\"ends\":[{\"id\":\"e1\",\"text\":\"Chưa phải chào hàng, chỉ là lời mời đàm phán. Chưa có gì để chấp nhận.\"},{\"id\":\"e2\",\"text\":\"Chào hàng không còn hiệu lực. Không còn gì để chấp nhận.\"},{\"id\":\"e3\",\"text\":\"Không phải chấp nhận. Đây là từ chối kèm chào hàng đối lại. Hợp đồng chưa hình thành.\"},{\"id\":\"e4\",\"text\":\"Hợp đồng hình thành khi chấp nhận có hiệu lực (Điều 23).\"},{\"id\":\"e5\",\"text\":\"Chấp nhận muộn không có hiệu lực. Hợp đồng chưa hình thành.\"}]}", "DE_XUAT_CHUA_DUYET"], ["FORM-03B", "3_SO_DO", "Dòng thời gian: ai còn đổi ý được lúc nào", "Bốn mốc trên một trục. Giữa các mốc là các khoảng mà mỗi bên còn có thể rút lui.", "CISG Điều 15(2), 16(1), 22, 23", "QUY_DINH_RO_DOI_CHIEU_UNTS_DIEN_GIAI", "", "DONG_THOI_GIAN", "{\"events\":[{\"id\":\"t1\",\"label\":\"A gửi chào hàng\"},{\"id\":\"t2\",\"label\":\"Chào hàng đến B (có hiệu lực, Điều 15(1))\"},{\"id\":\"t3\",\"label\":\"B gửi chấp nhận đi\"},{\"id\":\"t4\",\"label\":\"Chấp nhận đến A: hợp đồng hình thành (Điều 18(2), 23)\"}],\"spans\":[{\"from\":\"t1\",\"to\":\"t2\",\"label\":\"A còn rút lại được chào hàng nếu thông báo rút đến B trước hoặc cùng lúc (Điều 15(2))\"},{\"from\":\"t2\",\"to\":\"t3\",\"label\":\"A còn thu hồi được nếu thông báo đến B trước khi B gửi chấp nhận (Điều 16(1)), trừ khi chào hàng không thể hủy ngang (Điều 16(2))\"},{\"from\":\"t3\",\"to\":\"t4\",\"label\":\"B còn rút lại được chấp nhận nếu thông báo rút đến A trước hoặc cùng lúc chấp nhận có hiệu lực (Điều 22)\"}]}", "DE_XUAT_CHUA_DUYET"], ["FORM-04A", "4_VI_DU", "Ví dụ 1: B đổi số lượng", "A chào bán 500 tấn thép, giá cố định, thư không nêu thời hạn trả lời. B trả lời đồng ý mua 400 tấn với cùng giá. Bước 1: thư của A có đủ hàng, số lượng, giá và ý định bị ràng buộc nên là chào hàng (Điều 14). Bước 2: trả lời của B đổi số lượng, mà số lượng nằm trong danh sách điều khoản được coi là thay đổi trọng yếu (Điều 19(3)). Kết luận: câu trả lời của B không phải chấp nhận mà là chào hàng đối lại, và hợp đồng chưa hình thành. Nếu A đồng ý 400 tấn thì lúc đó A là bên chấp nhận.", "CISG Điều 14, Điều 19(1) và (3)", "QUY_DINH_RO_DOI_CHIEU_UNTS_DIEN_GIAI", "", "", "", "DE_XUAT_CHUA_DUYET"], ["FORM-04B", "4_VI_DU", "Ví dụ 2: B im lặng", "A chào bán, ghi rằng nếu B không phản đối trong 7 ngày thì coi như chấp nhận. B không phản hồi. Kết luận: sự im lặng hoặc không hành động tự nó không phải là chấp nhận, nên chưa có hợp đồng. Ngoại lệ chỉ khi giữa các bên đã có thói quen hoặc tập quán phù hợp.", "CISG Điều 18(1), 18(3)", "QUY_DINH_RO_DOI_CHIEU_UNTS_DIEN_GIAI", "", "", "", "DE_XUAT_CHUA_DUYET"], ["FORM-04C", "4_VI_DU", "Ví dụ 3: chấp nhận đến muộn", "A gửi thư ghi ngày 1/3, ấn định B trả lời trong 7 ngày. Thời hạn tính từ ngày ghi trên thư (Điều 20(1)). Thư chấp nhận của B đến A ngày 12/3, quá hạn. Nếu A lập tức báo cho B rằng vẫn coi chấp nhận là có hiệu lực thì hợp đồng hình thành (Điều 21(1)). Nếu A im lặng hoặc chậm báo thì chấp nhận muộn không có hiệu lực. Cách tính ngày cụ thể cần xem kỹ ngày lễ và ngày không làm việc theo Điều 20(2).", "CISG Điều 18(2), 20, 21(1)", "QUY_DINH_RO_DOI_CHIEU_UNTS_DIEN_GIAI", "", "", "", "DE_XUAT_CHUA_DUYET"], ["FORM-05A", "5_BAY", "Bẫy 1: gửi đi khác với đến nơi", "CISG tính hiệu lực theo lúc đến, không theo lúc gửi: chào hàng, chấp nhận, thu hồi và rút lại đều có hiệu lực khi thông báo đến người nhận. Điểm duy nhất cần chú ý lúc gửi là Điều 16(1): A không thu hồi được nữa nếu B đã gửi chấp nhận đi trước khi thông báo thu hồi đến B.", "CISG Điều 15(1), 16(1), 18(2), 24", "QUY_DINH_RO_DOI_CHIEU_UNTS_DIEN_GIAI", "", "", "", "DE_XUAT_CHUA_DUYET"], ["FORM-05B", "5_BAY", "Bẫy 2: thêm điều khoản chưa chắc là đổi trọng yếu", "Nếu câu trả lời thêm hoặc đổi điều khoản không trọng yếu thì vẫn là chấp nhận, trừ khi người chào hàng phản đối ngay. Danh sách điều khoản trọng yếu trong Điều 19(3) là danh sách minh họa, mỗi vụ cần xem sự thay đổi có làm đổi cân bằng quyền lợi không.", "CISG Điều 19(2) và (3)", "QUY_DINH_RO_DOI_CHIEU_UNTS_DIEN_GIAI; PHAM_VI_TRONG_YEU_LA_QUAN_DIEM_AP_DUNG", "", "", "", "DE_XUAT_CHUA_DUYET"], ["FORM-05C", "5_BAY", "Bẫy 3: không cần văn bản", "CISG không đòi hợp đồng phải bằng văn bản (Điều 11), nhưng Điều 12 và Điều 96 cho phép quốc gia tuyên bố loại việc này ra. Việt Nam đã có tuyên bố theo Điều 12 và 96 khi gia nhập (thông báo CN.700.2015 của Tổng thư ký Liên Hợp Quốc): các quy định về hình thức tự do (Điều 11, Điều 29, Phần II) không áp dụng khi một bên có trụ sở ở Việt Nam. Vì vậy với bên Việt Nam, không thể mặc định chào hàng và chấp nhận bằng lời hay hành vi là đủ. Chưa kiểm tra tuyên bố này hiện còn hiệu lực hay đã rút, và chưa soạn hệ quả theo luật Việt Nam. Xem bài phạm vi CISG, bẫy 4.", "CISG Điều 11, 12, 96; Thông báo CN.700.2015", "QUY_DINH_RO_DOI_CHIEU_UNTS_DIEN_GIAI; CHUA_XAC_MINH_CON_HIEU_LUC", "https://treaties.un.org/doc/Publication/CN/2015/CN.700.2015-Eng.pdf", "", "", "DE_XUAT_CHUA_DUYET"], ["FORM-06-14", "6_BANG_TRA", "Điều 14: chào hàng", "Đề nghị gửi cho người xác định là chào hàng nếu đủ rõ (nêu hàng hóa, và ấn định hoặc cho cách xác định số lượng và giá) và thể hiện ý định bị ràng buộc. Đề nghị không gửi cho người xác định chỉ là lời mời, trừ khi người đưa ra nêu rõ ngược lại.", "CISG Điều 14", "QUY_DINH_RO_DOI_CHIEU_UNTS_DIEN_GIAI", "", "", "", "DE_XUAT_CHUA_DUYET"], ["FORM-06-15", "6_BANG_TRA", "Điều 15: hiệu lực của chào hàng", "Chào hàng có hiệu lực khi đến người nhận. Dù không hủy ngang, vẫn có thể rút lại nếu thông báo rút đến trước hoặc cùng lúc với chào hàng.", "CISG Điều 15", "QUY_DINH_RO_DOI_CHIEU_UNTS_DIEN_GIAI", "", "", "", "DE_XUAT_CHUA_DUYET"], ["FORM-06-16", "6_BANG_TRA", "Điều 16: thu hồi", "Chào hàng có thể thu hồi đến khi hợp đồng được giao kết, nếu thông báo thu hồi đến người nhận trước khi họ gửi chấp nhận. Không thu hồi được nếu chào hàng nêu thời hạn chấp nhận hoặc cách khác thể hiện không hủy ngang, hoặc người nhận có lý do hợp lý tin vào tính không hủy ngang và đã hành động dựa trên đó.", "CISG Điều 16", "QUY_DINH_RO_DOI_CHIEU_UNTS_DIEN_GIAI", "", "", "", "DE_XUAT_CHUA_DUYET"], ["FORM-06-17", "6_BANG_TRA", "Điều 17: chấm dứt do từ chối", "Chào hàng chấm dứt khi thông báo từ chối đến người chào hàng, kể cả chào hàng không hủy ngang.", "CISG Điều 17", "QUY_DINH_RO_DOI_CHIEU_UNTS_DIEN_GIAI", "", "", "", "DE_XUAT_CHUA_DUYET"], ["FORM-06-18", "6_BANG_TRA", "Điều 18: chấp nhận", "Tuyên bố hoặc hành vi thể hiện đồng ý là chấp nhận; im lặng hay không hành động tự nó không phải. Chấp nhận có hiệu lực khi đến người chào hàng; không có hiệu lực nếu không đến trong thời hạn ấn định hoặc, nếu không ấn định, trong thời hạn hợp lý có tính tốc độ phương tiện liên lạc người chào hàng dùng. Chào hàng bằng lời phải được chấp nhận ngay, trừ khi hoàn cảnh cho thấy khác. Nếu theo chào hàng, thói quen giữa các bên hay tập quán mà người nhận được thể hiện đồng ý bằng hành vi mà không thông báo, chấp nhận có hiệu lực khi hành vi được thực hiện trong thời hạn.", "CISG Điều 18", "QUY_DINH_RO_DOI_CHIEU_UNTS_DIEN_GIAI", "", "", "", "DE_XUAT_CHUA_DUYET"], ["FORM-06-19", "6_BANG_TRA", "Điều 19: chấp nhận có sửa đổi", "Trả lời có thêm, bớt hoặc sửa đổi là từ chối và là chào hàng đối lại. Nếu chỉ thêm hoặc đổi điều khoản không trọng yếu thì vẫn là chấp nhận, trừ khi người chào hàng phản đối ngay. Các điều khoản được coi là trọng yếu gồm giá, thanh toán, chất lượng và số lượng hàng, nơi và thời điểm giao hàng, mức trách nhiệm của các bên, giải quyết tranh chấp.", "CISG Điều 19", "QUY_DINH_RO_DOI_CHIEU_UNTS_DIEN_GIAI", "", "", "", "DE_XUAT_CHUA_DUYET"], ["FORM-06-20", "6_BANG_TRA", "Điều 20: tính thời hạn chấp nhận", "Thời hạn do người chào hàng ấn định trong điện tín hoặc thư bắt đầu từ lúc điện tín được giao gửi, hoặc từ ngày ghi trên thư, hoặc nếu không ghi thì từ ngày trên phong bì. Thời hạn ấn định bằng điện thoại, telex hay phương tiện tức thời bắt đầu từ lúc chào hàng đến người nhận. Ngày lễ và ngày không làm việc trong thời hạn được tính vào, trừ khi ngày cuối là ngày lễ hoặc nghỉ tại nơi kinh doanh của người chào hàng, khi đó thời hạn được gia hạn đến ngày làm việc kế tiếp.", "CISG Điều 20", "QUY_DINH_RO_DOI_CHIEU_UNTS_DIEN_GIAI", "", "", "", "DE_XUAT_CHUA_DUYET"], ["FORM-06-21", "6_BANG_TRA", "Điều 21: chấp nhận muộn", "Chấp nhận muộn vẫn có hiệu lực nếu người chào hàng kịp thời báo cho người nhận rằng chấp nhận có hiệu lực. Nếu thư chấp nhận muộn cho thấy được gửi trong điều kiện mà nếu chuyển bình thường thì đã đến đúng hạn, nó vẫn có hiệu lực, trừ khi người chào hàng kịp thời báo rằng chào hàng đã hết hiệu lực.", "CISG Điều 21", "QUY_DINH_RO_DOI_CHIEU_UNTS_DIEN_GIAI", "", "", "", "DE_XUAT_CHUA_DUYET"], ["FORM-06-22", "6_BANG_TRA", "Điều 22: rút lại chấp nhận", "Chấp nhận có thể rút lại nếu thông báo rút đến người chào hàng trước hoặc cùng lúc chấp nhận có hiệu lực.", "CISG Điều 22", "QUY_DINH_RO_DOI_CHIEU_UNTS_DIEN_GIAI", "", "", "", "DE_XUAT_CHUA_DUYET"], ["FORM-06-23", "6_BANG_TRA", "Điều 23: hợp đồng hình thành", "Hợp đồng được giao kết vào lúc chấp nhận chào hàng có hiệu lực theo Công ước.", "CISG Điều 23", "QUY_DINH_RO_DOI_CHIEU_UNTS_DIEN_GIAI", "", "", "", "DE_XUAT_CHUA_DUYET"], ["FORM-06-24", "6_BANG_TRA", "Điều 24: thế nào là đến", "Thông báo, tuyên bố chấp nhận hay ý muốn khác được coi là đến người nhận khi được thông báo bằng lời cho họ, hoặc chuyển bằng phương tiện nào đó tới họ, tới nơi kinh doanh hay địa chỉ bưu điện của họ; nếu không có thì tới nơi cư trú thường xuyên.", "CISG Điều 24", "QUY_DINH_RO_DOI_CHIEU_UNTS_DIEN_GIAI", "", "", "", "DE_XUAT_CHUA_DUYET"], ["FORM-07", "7_GHI_CHU_NGUON", "Cách đối chiếu và giới hạn", "Nội dung các điều khoản ở trên là diễn giải của người soạn, đối chiếu với bản Công ước đăng trong Treaty Series của Liên Hợp Quốc (tập 1489), không chèn nguyên văn. Chưa đối chiếu bản tiếng Việt chính thức, chưa đối chiếu án lệ hay bình luận học thuật. Các ví dụ là tình huống giả định do người soạn đặt, không lấy từ đề thi. Tình trạng thành viên CISG của từng nước và tuyên bố Điều 96 của Việt Nam chưa được xác minh trong bản này. Toàn bộ cần anh duyệt trước khi dùng.", "", "CHUA_XAC_MINH", "https://treaties.un.org/doc/Publication/UNTS/Volume%201489/volume-1489-I-25567-English.pdf", "", "", "DE_XUAT_CHUA_DUYET"]], "SOAN_THU_20261026_NGOAI_LE": [["EXC-00", "0_PHAM_VI", "Chủ đề và phạm vi", "Chủ đề: Khi nào được phá luật chơi. Chương nguồn trong Sheet: I.4. Bài này chỉ bàn hai ngoại lệ hay gặp nhất trong đề: Điều XX (ngoại lệ chung) và Điều XXIV (khu vực thương mại tự do và liên minh thuế quan) của GATT. Chưa bàn Điều XXI (an ninh), ưu đãi dành cho nước đang phát triển, và các biện pháp phòng vệ thương mại (chương I.5). Nên học sau bài MFN và NT.", "GATT Điều XX, Điều XXIV", "QUY_DINH_RO_DOI_CHIEU_WTO_DIEN_GIAI", "https://www.wto.org/English/Docs_E/legal_e/gatt47_e.pdf", "", "", "DE_XUAT_CHUA_DUYET"], ["EXC-01", "1_CAU_HOI", "Hai câu hỏi đời thường", "Câu 1: Nước X cấm nhập khẩu một loại hàng vì lý do bảo vệ sức khỏe con người, dù việc đó đối xử hàng nhập khác với hàng nội. Điều này có được không? Câu 2: Nước X và nước Y ký hiệp định miễn thuế cho nhau nhưng vẫn đánh thuế hàng của nước Z. Điều này có vi phạm MFN không? Cả hai câu đều hỏi liệu có trường hợp luật cho phép làm khác đi không, và điều kiện để được là gì.", "", "QUAN_DIEM_GIANG_DAY", "", "", "", "DE_XUAT_CHUA_DUYET"], ["EXC-02", "2_QUY_TAC", "Quy tắc của hai ngoại lệ", "Điều XX: biện pháp có thể được phép dù trái quy tắc thương mại, nếu (1) nó thuộc một trong các nhóm mục tiêu liệt kê ở điểm (a) đến (j), và (2) khi áp dụng, nó không tạo ra phân biệt đối xử tùy tiện hay không chính đáng giữa các nước cùng điều kiện, và không là sự hạn chế thương mại quốc tế trá hình. Điều XXIV: các bên lập khu vực thương mại tự do hoặc liên minh thuế quan được dành ưu đãi riêng cho nhau, nếu xóa bỏ rào cản trên phần lớn thương mại giữa các bên và không nâng rào cản đối với bên ngoài.", "GATT Điều XX, XXIV:5, XXIV:8", "QUY_DINH_RO_DOI_CHIEU_WTO_DIEN_GIAI", "https://www.wto.org/English/Docs_E/legal_e/gatt47_e.pdf", "", "", "DE_XUAT_CHUA_DUYET"], ["EXC-03A", "3_SO_DO", "Cây quyết định Điều XX: hai bước", "Bước 1 là mục tiêu có nằm trong danh sách (a)-(j) và biện pháp có liên hệ đúng. Bước 2 là cách áp dụng có qua được phần mở đầu không. Phải qua cả hai bước.", "GATT Điều XX", "QUY_DINH_RO_DOI_CHIEU_WTO_DIEN_GIAI; HAI_BUOC_LA_CACH_XET_THUC_TIEN_CHUA_XAC_MINH", "", "CAY_QUYET_DINH", "{\"start\":\"q1\",\"nodes\":[{\"id\":\"q1\",\"cspl\":\"Điều XX (a)-(j)\",\"text\":\"Mục tiêu của biện pháp có nằm trong một điểm của danh sách (ví dụ bảo vệ đạo đức công cộng, sinh mạng và sức khỏe con người, động vật, thực vật, bảo tồn tài nguyên cạn kiệt, thực thi luật không trái GATT)?\",\"yes\":\"q2\",\"no\":\"e1\"},{\"id\":\"q2\",\"cspl\":\"Điều XX (b), (d), (g)\",\"text\":\"Biện pháp có liên hệ với mục tiêu theo đúng mức mà điểm đó đòi hỏi (ví dụ “cần thiết” ở điểm (b) và (d); gắn với hạn chế sản xuất hoặc tiêu dùng trong nước ở điểm (g))?\",\"yes\":\"q3\",\"no\":\"e2\"},{\"id\":\"q3\",\"cspl\":\"Phần mở đầu Điều XX\",\"text\":\"Khi áp dụng, biện pháp có tạo ra phân biệt đối xử tùy tiện hoặc không chính đáng giữa các nước cùng điều kiện không?\",\"yes\":\"e3\",\"no\":\"q4\"},{\"id\":\"q4\",\"cspl\":\"Phần mở đầu Điều XX\",\"text\":\"Biện pháp có phải là sự hạn chế trá hình đối với thương mại quốc tế không?\",\"yes\":\"e3\",\"no\":\"e4\"}],\"ends\":[{\"id\":\"e1\",\"text\":\"Không viện dẫn được Điều XX: mục tiêu không nằm trong danh sách.\"},{\"id\":\"e2\",\"text\":\"Không đáp ứng điều kiện của điểm đã chọn, nên không được đi tiếp.\"},{\"id\":\"e3\",\"text\":\"Không qua được phần mở đầu: không được hưởng ngoại lệ Điều XX.\"},{\"id\":\"e4\",\"text\":\"Có thể được hưởng ngoại lệ Điều XX, nếu đã chứng minh đủ các bước trên.\"}]}", "DE_XUAT_CHUA_DUYET"], ["EXC-03B", "3_SO_DO", "Cây quyết định Điều XXIV: FTA và liên minh thuế quan", "Đi qua bốn câu hỏi để biết hiệp định có được dành ưu đãi riêng cho nhau như một ngoại lệ của MFN hay không.", "GATT Điều XXIV:4, 5, 8", "QUY_DINH_RO_DOI_CHIEU_WTO_DIEN_GIAI", "", "CAY_QUYET_DINH", "{\"start\":\"q1\",\"nodes\":[{\"id\":\"q1\",\"cspl\":\"Điều XXIV:8\",\"text\":\"Các bên có lập liên minh thuế quan hoặc khu vực thương mại tự do (hoặc hiệp định tạm thời dẫn tới một trong hai) không?\",\"yes\":\"q2\",\"no\":\"e1\"},{\"id\":\"q2\",\"cspl\":\"Điều XXIV:8\",\"text\":\"Các bên có xóa bỏ rào cản trên phần lớn thương mại giữa họ không?\",\"yes\":\"q3\",\"no\":\"e2\"},{\"id\":\"q3\",\"cspl\":\"Điều XXIV:5(a), 5(b)\",\"text\":\"Thuế và quy định áp cho bên ngoài có không cao hơn hoặc hạn chế hơn mức trước đây không?\",\"yes\":\"q4\",\"no\":\"e2\"},{\"id\":\"q4\",\"cspl\":\"Điều XXIV:5(c)\",\"text\":\"Nếu là hiệp định tạm thời, có kế hoạch và lịch trình hình thành trong thời gian hợp lý không? (Nếu không phải hiệp định tạm thời, chọn Có.)\",\"yes\":\"e3\",\"no\":\"e2\"}],\"ends\":[{\"id\":\"e1\",\"text\":\"Không thuộc Điều XXIV: ưu đãi riêng cho nhau sẽ vi phạm MFN nếu không có ngoại lệ khác.\"},{\"id\":\"e2\",\"text\":\"Không đủ điều kiện của Điều XXIV, nên không được hưởng ngoại lệ.\"},{\"id\":\"e3\",\"text\":\"Có thể được dành ưu đãi riêng cho nhau như một ngoại lệ của MFN.\"}]}", "DE_XUAT_CHUA_DUYET"], ["EXC-03C", "3_SO_DO", "Ma trận so sánh Điều XX và Điều XXIV", "Năm hàng so sánh hai ngoại lệ: cho phép điều gì, điều kiện then chốt, ví dụ, câu tự kiểm tra.", "GATT Điều XX, XXIV", "QUY_DINH_RO_DOI_CHIEU_WTO_DIEN_GIAI", "", "MA_TRAN", "{\"cols\":[\"Điều XX\",\"Điều XXIV\"],\"rows\":[{\"label\":\"Cho phép điều gì\",\"cells\":[\"Biện pháp theo đuổi mục tiêu chính sách như sức khỏe, tài nguyên, đạo đức\",\"Lập khu vực thương mại tự do hoặc liên minh thuế quan và dành ưu đãi riêng cho nhau\"]},{\"label\":\"Phá quy tắc nào\",\"cells\":[\"Nghĩa vụ thương mại trong GATT (ví dụ MFN, NT)\",\"Chủ yếu là MFN (ưu đãi chỉ dành cho thành viên của hiệp định)\"]},{\"label\":\"Điều kiện then chốt\",\"cells\":[\"Thuộc một điểm (a)-(j) và qua phần mở đầu\",\"Phủ phần lớn thương mại; không nâng rào cản với bên ngoài; hiệp định tạm thời có kế hoạch và lịch trình\"]},{\"label\":\"Ví dụ\",\"cells\":[\"Cấm nhập khẩu từ nơi có dịch bệnh để bảo vệ sức khỏe, áp dụng đúng như nhau với mọi nơi có dịch\",\"X và Y miễn thuế cho nhau trên gần như toàn bộ thương mại, vẫn giữ thuế cũ với nước Z\"]},{\"label\":\"Câu tự kiểm tra\",\"cells\":[\"Mục tiêu có hợp lệ không, và áp dụng có công bằng không?\",\"Hai bên có thực sự mở cửa cho nhau mà không dựng thêm rào với bên ngoài không?\"]}]}", "DE_XUAT_CHUA_DUYET"], ["EXC-04A", "4_VI_DU", "Ví dụ 1: qua được Điều XX", "Nước X cấm nhập khẩu thịt gia cầm từ mọi nước đang có dịch cúm gia cầm, áp dụng giống nhau với mọi nước có dịch. Bước 1: mục tiêu là bảo vệ sức khỏe, thuộc điểm (b). Bước 2: có thể chứng minh biện pháp cần thiết. Bước 3: các nước có dịch được đối xử như nhau, còn nước không có dịch khác điều kiện nên việc khác biệt không phải tùy tiện. Bước 4: không có dấu hiệu bảo hộ trá hình. Kết luận: có thể viện dẫn Điều XX(b). Kết luận phụ thuộc vào giả định các bước đều được chứng minh.", "GATT Điều XX(b) và phần mở đầu", "QUY_DINH_RO_DOI_CHIEU_WTO_DIEN_GIAI", "", "", "", "DE_XUAT_CHUA_DUYET"], ["EXC-04B", "4_VI_DU", "Ví dụ 2: trượt ở phần mở đầu Điều XX", "Nước X cấm nhập khẩu thịt gia cầm từ nước Y vì dịch cúm, nhưng vẫn nhập từ nước Z đang có dịch tương tự và không có lý do gì khác. Bước 1 và 2 có thể qua. Bước 3: Y và Z cùng điều kiện nhưng bị đối xử khác nhau, đây là phân biệt tùy tiện hoặc không chính đáng. Kết luận: không qua được phần mở đầu nên không được hưởng Điều XX dù mục tiêu hợp lệ.", "GATT Phần mở đầu Điều XX", "QUY_DINH_RO_DOI_CHIEU_WTO_DIEN_GIAI", "", "", "", "DE_XUAT_CHUA_DUYET"], ["EXC-04C", "4_VI_DU", "Ví dụ 3: FTA qua được và FTA trượt", "Nước X và Y ký hiệp định xóa thuế trên gần như toàn bộ thương mại giữa hai nước, và không nâng rào cản với nước Z. Hai nước được dành ưu đãi riêng cho nhau như một ngoại lệ của MFN. Nếu hiệp định chỉ miễn thuế cho vài mặt hàng thì không đủ phần lớn thương mại, nên không được Điều XXIV bảo vệ, và ưu đãi dành riêng cho Y sẽ vi phạm MFN nếu không có ngoại lệ khác. “Phần lớn thương mại” là khái niệm cần được xác định theo thực tiễn, không có ngưỡng số cụ thể trong phần văn bản đã đối chiếu.", "GATT Điều XXIV:5, XXIV:8", "QUY_DINH_RO_DOI_CHIEU_WTO_DIEN_GIAI", "", "", "", "DE_XUAT_CHUA_DUYET"], ["EXC-05A", "5_BAY", "Bẫy 1: chỉ cần một điểm, nhưng còn phần mở đầu", "Chỉ cần biện pháp thuộc một trong các điểm (a) đến (j), không cần thuộc tất cả. Nhưng chỉ thuộc một điểm là chưa đủ: vẫn phải qua phần mở đầu. Nhiều câu nhận định đưa ra “chỉ cần chứng minh thuộc điểm a-j” để gài bẫy.", "GATT Điều XX", "QUY_DINH_RO_DOI_CHIEU_WTO_DIEN_GIAI", "", "", "", "DE_XUAT_CHUA_DUYET"], ["EXC-05B", "5_BAY", "Bẫy 2: không cấm mọi sự phân biệt", "Phần mở đầu cấm sự phân biệt đối xử tùy tiện hoặc không chính đáng giữa các nước cùng điều kiện, không phải cấm mọi phân biệt. Đối xử khác nhau giữa hai nước có điều kiện khác nhau có thể không vi phạm. Câu nhận định nói “không được tạo ra bất kỳ sự phân biệt đối xử nào” là nói quá rộng so với văn bản.", "GATT Phần mở đầu Điều XX", "QUY_DINH_RO_DOI_CHIEU_WTO_DIEN_GIAI", "", "", "", "DE_XUAT_CHUA_DUYET"], ["EXC-05C", "5_BAY", "Bẫy 3: Điều XXIV là ngoại lệ của MFN", "Điều XXIV cho phép ưu đãi riêng giữa các bên trong hiệp định, nên là ngoại lệ của MFN. Nó không phải là ngoại lệ của nguyên tắc tự do hóa thương mại, vì bản chất FTA là mở cửa hơn giữa các bên. Dùng lẫn hai cách nói này là bẫy thường gặp trong nhận định.", "GATT Điều XXIV", "QUY_DINH_RO_DOI_CHIEU_WTO_DIEN_GIAI; CACH_NOI_LA_CACH_GIANG_DAY", "", "", "", "DE_XUAT_CHUA_DUYET"], ["EXC-05D", "5_BAY", "Bẫy 4: không được dựng thêm rào với bên ngoài", "Điều XXIV cho phép ưu đãi riêng giữa các bên, nhưng không cho nâng rào cản đối với bên ngoài hiệp định. Liên minh thuế quan so sánh mức chung, khu vực thương mại tự do so sánh từng nước với mức của chính nó trước đây.", "GATT Điều XXIV:5(a), 5(b)", "QUY_DINH_RO_DOI_CHIEU_WTO_DIEN_GIAI", "", "", "", "DE_XUAT_CHUA_DUYET"], ["EXC-05E", "5_BAY", "Bẫy 5: phần chưa đối chiếu", "Các điểm (c), (e), (f), (h), (i), (j) của Điều XX chưa được đối chiếu trong bản soạn này. Quy tắc ai có nghĩa vụ chứng minh và cách xét hai bước ở cây quyết định là thực tiễn giải quyết tranh chấp, chưa đối chiếu báo cáo vụ việc. Vụ Mỹ - Tôm rùa biển (DS58) thường được nêu làm ví dụ cho phần mở đầu, theo tài liệu ôn tập trong Drive; chưa đối chiếu báo cáo chính thức.", "GATT Điều XX", "CHUA_XAC_MINH", "", "", "", "DE_XUAT_CHUA_DUYET"], ["EXC-06-XX", "6_BANG_TRA", "Điều XX: phần mở đầu", "Các biện pháp ngoại lệ không được áp dụng theo cách tạo ra “arbitrary or unjustifiable discrimination between countries where the same conditions prevail”, hay “a disguised restriction on international trade”.", "GATT Điều XX (phần mở đầu)", "QUY_DINH_RO_DOI_CHIEU_WTO_DIEN_GIAI", "https://www.wto.org/English/Docs_E/legal_e/gatt47_e.pdf", "", "", "DE_XUAT_CHUA_DUYET"], ["EXC-06-XXa", "6_BANG_TRA", "Điều XX(a): đạo đức công cộng", "Biện pháp cần thiết để bảo vệ chuẩn mực đạo đức công cộng.", "GATT Điều XX(a)", "QUY_DINH_RO_DOI_CHIEU_WTO_DIEN_GIAI", "https://www.wto.org/English/Docs_E/legal_e/gatt47_e.pdf", "", "", "DE_XUAT_CHUA_DUYET"], ["EXC-06-XXb", "6_BANG_TRA", "Điều XX(b): sinh mạng và sức khỏe", "Biện pháp cần thiết để bảo vệ sinh mạng hoặc sức khỏe của con người, động vật hoặc thực vật.", "GATT Điều XX(b)", "QUY_DINH_RO_DOI_CHIEU_WTO_DIEN_GIAI", "https://www.wto.org/English/Docs_E/legal_e/gatt47_e.pdf", "", "", "DE_XUAT_CHUA_DUYET"], ["EXC-06-XXd", "6_BANG_TRA", "Điều XX(d): thực thi luật", "Biện pháp cần thiết để đảm bảo tuân thủ luật và quy định không trái với Hiệp định, gồm hải quan, độc quyền, sở hữu trí tuệ và ngăn hành vi lừa dối.", "GATT Điều XX(d)", "QUY_DINH_RO_DOI_CHIEU_WTO_DIEN_GIAI", "https://www.wto.org/English/Docs_E/legal_e/gatt47_e.pdf", "", "", "DE_XUAT_CHUA_DUYET"], ["EXC-06-XXg", "6_BANG_TRA", "Điều XX(g): tài nguyên cạn kiệt", "Biện pháp liên quan tới bảo tồn tài nguyên thiên nhiên có thể cạn kiệt, nếu có kèm hạn chế sản xuất hoặc tiêu dùng trong nước.", "GATT Điều XX(g)", "QUY_DINH_RO_DOI_CHIEU_WTO_DIEN_GIAI", "https://www.wto.org/English/Docs_E/legal_e/gatt47_e.pdf", "", "", "DE_XUAT_CHUA_DUYET"], ["EXC-06-24-4", "6_BANG_TRA", "Điều XXIV:4: mục đích", "Các bên công nhận hội nhập kinh tế qua hiệp định tự nguyện là điều nên làm, nhưng nhằm “to facilitate trade between the constituent territories” và không “to raise barriers to the trade of other contracting parties”.", "GATT Điều XXIV:4", "QUY_DINH_RO_DOI_CHIEU_WTO_DIEN_GIAI", "https://www.wto.org/English/Docs_E/legal_e/gatt47_e.pdf", "", "", "DE_XUAT_CHUA_DUYET"], ["EXC-06-24-5a", "6_BANG_TRA", "Điều XXIV:5(a): liên minh thuế quan", "Thuế và quy định áp cho nước ngoài khi liên minh hình thành, nhìn chung, không được cao hơn hoặc hạn chế hơn mức chung trước đó (“on the whole”).", "GATT Điều XXIV:5(a)", "QUY_DINH_RO_DOI_CHIEU_WTO_DIEN_GIAI", "https://www.wto.org/English/Docs_E/legal_e/gatt47_e.pdf", "", "", "DE_XUAT_CHUA_DUYET"], ["EXC-06-24-5b", "6_BANG_TRA", "Điều XXIV:5(b): khu vực thương mại tự do", "Thuế và quy định của từng lãnh thổ áp cho nước ngoài không được cao hơn hoặc hạn chế hơn mức tương ứng của chính lãnh thổ đó trước khi lập khu vực.", "GATT Điều XXIV:5(b)", "QUY_DINH_RO_DOI_CHIEU_WTO_DIEN_GIAI", "https://www.wto.org/English/Docs_E/legal_e/gatt47_e.pdf", "", "", "DE_XUAT_CHUA_DUYET"], ["EXC-06-24-5c", "6_BANG_TRA", "Điều XXIV:5(c): hiệp định tạm thời", "Hiệp định tạm thời phải có “a plan and schedule for the formation” liên minh hoặc khu vực trong thời gian hợp lý.", "GATT Điều XXIV:5(c)", "QUY_DINH_RO_DOI_CHIEU_WTO_DIEN_GIAI", "https://www.wto.org/English/Docs_E/legal_e/gatt47_e.pdf", "", "", "DE_XUAT_CHUA_DUYET"], ["EXC-06-24-8", "6_BANG_TRA", "Điều XXIV:8: định nghĩa", "Liên minh thuế quan thay hai hay nhiều lãnh thổ hải quan bằng một lãnh thổ, xóa bỏ biện pháp hạn chế trên phần lớn thương mại giữa các bên và áp dụng thuế ngoài về cơ bản giống nhau. Khu vực thương mại tự do là nhóm hai hay nhiều lãnh thổ hải quan xóa bỏ rào cản trên phần lớn thương mại giữa các bên, mỗi bên giữ chế độ thương mại riêng với bên ngoài.", "GATT Điều XXIV:8", "QUY_DINH_RO_DOI_CHIEU_WTO_DIEN_GIAI", "https://www.wto.org/English/Docs_E/legal_e/gatt47_e.pdf", "", "", "DE_XUAT_CHUA_DUYET"], ["EXC-07", "7_GHI_CHU_NGUON", "Cách đối chiếu và giới hạn", "Các điểm đã đối chiếu: phần mở đầu Điều XX, các điểm (a), (b), (d), (g), và Điều XXIV:4, 5(a)-(c), 8, với bản The Text of the General Agreement on Tariffs and Trade (Geneva, 1986) đăng tại wto.org (GATT 1947). Nội dung là diễn giải kèm một vài cụm từ khóa. Chưa đối chiếu: các điểm còn lại của Điều XX, phần mở đầu khoản 5 Điều XXIV, các văn kiện tạo nên GATT 1994, Hiểu biết về Điều XXIV, báo cáo vụ việc, và bình luận học thuật. Các ví dụ là tình huống giả định. Toàn bộ cần anh duyệt trước khi dùng.", "", "CHUA_XAC_MINH", "https://www.wto.org/English/Docs_E/legal_e/gatt47_e.pdf", "", "", "DE_XUAT_CHUA_DUYET"]], "SOAN_THU_20261026_PHONG_VE": [["TR-00", "0_PHAM_VI", "Chủ đề và phạm vi", "Chủ đề: Phòng vệ thương mại, gồm chống bán phá giá và tự vệ. Chương nguồn trong Sheet: I.5. Bài này chỉ bàn hai công cụ có trong đề thi: Hiệp định Chống bán phá giá (ADA) và Hiệp định về các biện pháp tự vệ (SA). Chưa bàn trợ cấp và biện pháp đối kháng (Hiệp định SCM), vì chưa đọc phần này. Với ADA, chưa đọc Điều 2.3 đến 2.4 (so sánh công bằng và cách tính biên độ), Điều 6 (bằng chứng), Điều 12 đến 18. Văn bản dùng là bản dịch tiếng Việt lưu trong Drive của anh, chưa đối chiếu bản tiếng Anh chính thức. Nên học sau bài MFN và Ngoại lệ, vì cả hai công cụ đều là ngoại lệ của nghĩa vụ không tăng thuế quá mức đã cam kết.", "ADA Điều 1; SA Điều 1", "QUY_DINH_RO_DOI_CHIEU_BAN_DICH_DRIVE_DIEN_GIAI", "https://drive.google.com/file/d/1ZvH0_KdKGC1u_p8PFJIogjHLyXSgWhd_/view", "", "", "DE_XUAT_CHUA_DUYET"], ["TR-01", "1_CAU_HOI", "Hai câu hỏi đời thường", "Câu 1: Công ty thép A ở nước X thấy thép nước Y tràn vào bán rẻ hơn hẳn. A đề nghị chính phủ X đánh thuế vào thép Y. Chính phủ X có được làm vậy không, và phải chứng minh những gì? Câu 2: Thép từ nhiều nước đổ vào X, không ai bán phá giá, chỉ là nhập khẩu tăng quá nhanh khiến ngành thép trong nước suy sụp. X có được hạn chế nhập khẩu không, và có phải bù đắp gì cho các nước xuất khẩu không?", "", "QUAN_DIEM_GIANG_DAY", "", "", "", "DE_XUAT_CHUA_DUYET"], ["TR-02", "2_QUY_TAC", "Quy tắc hai câu", "Chống bán phá giá chỉ được áp dụng khi chứng minh được ba thứ cùng lúc: có bán phá giá, có tổn hại cho ngành trong nước, và hai điều đó có quan hệ nhân quả; mức thuế không được vượt biên độ phá giá. Tự vệ không cần phá giá: chỉ cần nhập khẩu tăng, gây hoặc đe dọa gây tổn hại nghiêm trọng, có quan hệ nhân quả, và biện pháp phải áp dụng cho hàng nhập từ mọi nguồn.", "ADA Điều 1, 2.1, 3.1, 3.5, 9.3; SA Điều 2, 4.2", "QUY_DINH_RO_DOI_CHIEU_BAN_DICH_DRIVE_DIEN_GIAI", "https://drive.google.com/file/d/1ZvH0_KdKGC1u_p8PFJIogjHLyXSgWhd_/view", "", "", "DE_XUAT_CHUA_DUYET"], ["TR-03A", "3_SO_DO", "Ma trận so sánh chống bán phá giá và tự vệ", "Tám hàng so sánh hai công cụ. Học thuộc ma trận này là phân biệt được hai công cụ trong mọi câu hỏi.", "ADA; SA", "QUY_DINH_RO_DOI_CHIEU_BAN_DICH_DRIVE_DIEN_GIAI", "", "MA_TRAN", "{\"cols\":[\"Chống bán phá giá (ADA)\",\"Tự vệ (SA)\"],\"rows\":[{\"label\":\"Phản ứng với điều gì\",\"cells\":[\"Hàng bán sang nước nhập khẩu với giá thấp hơn giá bán tại thị trường nước xuất khẩu (Điều 2.1)\",\"Nhập khẩu tăng đột ngột, dù không có bán phá giá (Điều 2.1)\"]},{\"label\":\"Mức tổn hại phải có\",\"cells\":[\"Tổn hại, hoặc đe dọa gây tổn hại, cho ngành sản xuất trong nước (Điều 3)\",\"Tổn hại nghiêm trọng, là sự suy giảm toàn diện đáng kể vị trí của ngành, hoặc đe dọa gây ra điều đó (Điều 4.1)\"]},{\"label\":\"Quan hệ nhân quả\",\"cells\":[\"Phải chứng minh, và không tính vào tổn hại do nguyên nhân khác (Điều 3.5)\",\"Phải chứng minh, và không tính vào tổn hại do nguyên nhân khác (Điều 4.2(b))\"]},{\"label\":\"Áp dụng với ai\",\"cells\":[\"Chỉ hàng từ các nguồn bị phá giá và gây tổn hại, trừ nguồn đã có cam kết giá (Điều 9.2)\",\"Hàng nhập khẩu từ mọi nguồn (Điều 2.2); nước đang phát triển có thị phần dưới 3% được loại trừ (Điều 9.1)\"]},{\"label\":\"Mức biện pháp\",\"cells\":[\"Thuế không vượt quá biên độ phá giá (Điều 9.3); nên thấp hơn nếu đủ loại bỏ tổn hại (Điều 9.1)\",\"Trong giới hạn cần thiết để ngăn chặn hay khắc phục tổn hại nghiêm trọng (Điều 5.1)\"]},{\"label\":\"Thời hạn\",\"cells\":[\"Thuế chấm dứt không muộn hơn 5 năm, trừ khi rà soát cho thấy phá giá và tổn hại sẽ tiếp diễn (Điều 11.3)\",\"Tối đa 4 năm; gia hạn được, tổng không quá 8 năm (Điều 7.1 đến 7.3)\"]},{\"label\":\"Bên áp dụng có phải bù đắp không\",\"cells\":[\"Trong các điều đã đọc không có cơ chế bồi thường tương tự Điều 8 của SA\",\"Phải cố gắng duy trì mức nhượng bộ tương đương; nếu không thỏa thuận được, bên xuất khẩu có thể đình chỉ nhượng bộ tương đương (Điều 8)\"]},{\"label\":\"Câu tự kiểm tra\",\"cells\":[\"Có doanh nghiệp xuất khẩu bán phá giá không?\",\"Có nhập khẩu tăng nhanh gây tổn hại nghiêm trọng không, và biện pháp có áp cho mọi nguồn không?\"]}]}", "DE_XUAT_CHUA_DUYET"], ["TR-03B", "3_SO_DO", "Cây quyết định: có được mở và áp dụng chống bán phá giá không", "Đi qua năm câu hỏi. Ba câu đầu là điều kiện về nội dung, hai câu sau là điều kiện để cuộc điều tra được bắt đầu hoặc tiếp tục.", "ADA Điều 2.1, 3, 5.4, 5.8", "QUY_DINH_RO_DOI_CHIEU_BAN_DICH_DRIVE_DIEN_GIAI", "", "CAY_QUYET_DINH", "{\"start\":\"q1\",\"nodes\":[{\"id\":\"q1\",\"cspl\":\"Điều 2.1, 2.2\",\"text\":\"Giá xuất khẩu của sản phẩm có thấp hơn giá có thể so sánh của sản phẩm tương tự bán tại nước xuất khẩu theo điều kiện thương mại thông thường không? (Nếu không có giá nội địa dùng được, so với giá xuất sang nước thứ ba phù hợp hoặc chi phí sản xuất cộng chi phí và lợi nhuận hợp lý.)\",\"yes\":\"q2\",\"no\":\"e1\"},{\"id\":\"q2\",\"cspl\":\"Điều 3.1, 3.2, 3.4, 3.7\",\"text\":\"Có tổn hại, hoặc đe dọa gây tổn hại, cho ngành sản xuất trong nước, xét trên khối lượng hàng nhập khẩu, ảnh hưởng đến giá và hậu quả với các nhà sản xuất?\",\"yes\":\"q3\",\"no\":\"e2\"},{\"id\":\"q3\",\"cspl\":\"Điều 3.5\",\"text\":\"Hàng bán phá giá thực sự gây ra tổn hại đó, sau khi đã loại trừ tổn hại do các nguyên nhân khác?\",\"yes\":\"q4\",\"no\":\"e3\"},{\"id\":\"q4\",\"cspl\":\"Điều 5.4\",\"text\":\"Đơn được ủng hộ bởi các nhà sản xuất chiếm ít nhất 50% sản lượng của những nhà sản xuất đã bày tỏ ý kiến, và những nhà ủng hộ chiếm ít nhất 25% tổng sản lượng của ngành?\",\"yes\":\"q5\",\"no\":\"e4\"},{\"id\":\"q5\",\"cspl\":\"Điều 5.8\",\"text\":\"Biên độ phá giá từ 2% giá xuất khẩu trở lên, và hàng từ nước đó chiếm ít nhất 3% tổng nhập khẩu sản phẩm tương tự (hoặc nhiều nước dưới 3% nhưng cộng lại trên 7%)?\",\"yes\":\"e5\",\"no\":\"e4\"}],\"ends\":[{\"id\":\"e1\",\"text\":\"Không có bán phá giá theo định nghĩa của Điều 2.1. Không áp dụng được.\"},{\"id\":\"e2\",\"text\":\"Không có tổn hại hoặc đe dọa tổn hại. Không áp dụng được.\"},{\"id\":\"e3\",\"text\":\"Không chứng minh được quan hệ nhân quả. Không áp dụng được.\"},{\"id\":\"e4\",\"text\":\"Điều tra không được bắt đầu hoặc phải đình chỉ ngay.\"},{\"id\":\"e5\",\"text\":\"Có thể áp dụng chống bán phá giá. Mức thuế không vượt quá biên độ phá giá (Điều 9.3), nên thấp hơn nếu đủ xóa tổn hại (Điều 9.1).\"}]}", "DE_XUAT_CHUA_DUYET"], ["TR-03C", "3_SO_DO", "Dòng thời gian một vụ chống bán phá giá", "Sáu mốc trên một trục, kèm các thời hạn tối đa.", "ADA Điều 5.10, 7.3, 7.4, 9, 11.3", "QUY_DINH_RO_DOI_CHIEU_BAN_DICH_DRIVE_DIEN_GIAI", "", "DONG_THOI_GIAN", "{\"events\":[{\"id\":\"t1\",\"label\":\"Bắt đầu điều tra\"},{\"id\":\"t2\",\"label\":\"Sớm nhất 60 ngày: được áp dụng biện pháp tạm thời (Điều 7.3)\"},{\"id\":\"t3\",\"label\":\"Biện pháp tạm thời hết hạn, 4 tháng (Điều 7.4)\"},{\"id\":\"t4\",\"label\":\"Kết thúc điều tra: 1 năm, tối đa 18 tháng (Điều 5.10)\"},{\"id\":\"t5\",\"label\":\"Thuế chống bán phá giá chính thức\"},{\"id\":\"t6\",\"label\":\"Không muộn hơn 5 năm: thuế chấm dứt, trừ khi rà soát cho thấy phá giá và tổn hại sẽ tiếp diễn (Điều 11.3)\"}],\"spans\":[{\"from\":\"t1\",\"to\":\"t2\",\"label\":\"Chưa được áp dụng biện pháp tạm thời. Phải có kết luận sơ bộ khẳng định có phá giá và tổn hại (Điều 7.1)\"},{\"from\":\"t2\",\"to\":\"t3\",\"label\":\"Biện pháp tạm thời dưới dạng thuế tạm thời hoặc tiền đặt cọc. Có thể kéo dài tới 6 tháng khi các nhà xuất khẩu chiếm tỷ trọng đáng kể yêu cầu; 6 và 9 tháng khi xét mức thuế thấp hơn biên độ (Điều 7.2, 7.4)\"},{\"from\":\"t3\",\"to\":\"t4\",\"label\":\"Có thể thay bằng cam kết giá của nhà xuất khẩu, khi đã có kết luận sơ bộ khẳng định phá giá và tổn hại (Điều 8.1, 8.2)\"},{\"from\":\"t4\",\"to\":\"t5\",\"label\":\"Thuế chính thức chỉ áp cho hàng đưa vào tiêu dùng sau ngày có hiệu lực, trừ ngoại lệ hồi tố (Điều 10.1)\"},{\"from\":\"t5\",\"to\":\"t6\",\"label\":\"Có thể rà soát sớm theo đề nghị của các bên liên quan; mỗi lần rà soát hoàn tất trong 12 tháng (Điều 11.2, 11.4)\"}]}", "DE_XUAT_CHUA_DUYET"], ["TR-03D", "3_SO_DO", "Cây quyết định: có được áp dụng tự vệ không", "Năm câu hỏi theo thứ tự. Khác chống bán phá giá, không có câu hỏi nào về giá bán của nhà xuất khẩu.", "SA Điều 2, 3, 4, 9", "QUY_DINH_RO_DOI_CHIEU_BAN_DICH_DRIVE_DIEN_GIAI", "", "CAY_QUYET_DINH", "{\"start\":\"q1\",\"nodes\":[{\"id\":\"q1\",\"cspl\":\"Điều 2.1\",\"text\":\"Sản phẩm có được nhập khẩu với số lượng tăng, tuyệt đối hoặc tương đối so với sản xuất trong nước?\",\"yes\":\"q2\",\"no\":\"e1\"},{\"id\":\"q2\",\"cspl\":\"Điều 4.1, 4.2(a)\",\"text\":\"Hàng nhập khẩu tăng đó gây ra hoặc đe dọa gây ra tổn hại nghiêm trọng (suy giảm toàn diện đáng kể vị trí của ngành), xét trên các yếu tố khách quan như tốc độ tăng, thị phần, doanh số, sản lượng, lợi nhuận, việc làm?\",\"yes\":\"q3\",\"no\":\"e2\"},{\"id\":\"q3\",\"cspl\":\"Điều 4.2(b)\",\"text\":\"Có quan hệ nhân quả giữa nhập khẩu tăng và tổn hại, sau khi không tính tổn hại do các yếu tố khác?\",\"yes\":\"q4\",\"no\":\"e3\"},{\"id\":\"q4\",\"cspl\":\"Điều 3.1\",\"text\":\"Đã điều tra theo thủ tục được công bố, có thông báo công khai và cho các bên liên quan cơ hội trình bày, phản biện?\",\"yes\":\"q5\",\"no\":\"e4\"},{\"id\":\"q5\",\"cspl\":\"Điều 2.2, 9.1\",\"text\":\"Biện pháp áp dụng cho hàng nhập khẩu từ mọi nguồn, trừ nước đang phát triển có thị phần dưới 3% (và tổng các nước như vậy không quá 9%)?\",\"yes\":\"e5\",\"no\":\"e6\"}],\"ends\":[{\"id\":\"e1\",\"text\":\"Không có nhập khẩu tăng. Không áp dụng được tự vệ.\"},{\"id\":\"e2\",\"text\":\"Không có tổn hại nghiêm trọng hoặc đe dọa. Không áp dụng được.\"},{\"id\":\"e3\",\"text\":\"Không chứng minh được nhân quả. Không áp dụng được.\"},{\"id\":\"e4\",\"text\":\"Thiếu thủ tục điều tra. Không được áp dụng.\"},{\"id\":\"e5\",\"text\":\"Có thể áp dụng tự vệ, trong giới hạn cần thiết, tối đa 4 năm và tổng không quá 8 năm.\"},{\"id\":\"e6\",\"text\":\"Biện pháp sai phạm vi: không được chọn riêng một nước (Điều 2.2).\"}]}", "DE_XUAT_CHUA_DUYET"], ["TR-03E", "3_SO_DO", "Dòng thời gian một biện pháp tự vệ", "Sáu mốc trên một trục. Quan trọng nhất là mốc 4 năm, mốc 8 năm, và mốc 3 năm đầu chưa được trả đũa.", "SA Điều 6, 7, 8.3", "QUY_DINH_RO_DOI_CHIEU_BAN_DICH_DRIVE_DIEN_GIAI", "", "DONG_THOI_GIAN", "{\"events\":[{\"id\":\"t1\",\"label\":\"Bắt đầu điều tra\"},{\"id\":\"t2\",\"label\":\"Biện pháp tạm thời, tối đa 200 ngày (Điều 6)\"},{\"id\":\"t3\",\"label\":\"Biện pháp chính thức có hiệu lực\"},{\"id\":\"t4\",\"label\":\"Hết 3 năm đầu: bên xuất khẩu có thể đình chỉ nhượng bộ tương đương, nếu không còn hạn chế của Điều 8.3\"},{\"id\":\"t5\",\"label\":\"Hết 4 năm: thời hạn thông thường (Điều 7.1)\"},{\"id\":\"t6\",\"label\":\"Hết 8 năm: giới hạn tuyệt đối, tính cả biện pháp tạm thời và gia hạn (Điều 7.3)\"}],\"spans\":[{\"from\":\"t1\",\"to\":\"t2\",\"label\":\"Biện pháp tạm thời chỉ khi trường hợp nghiêm trọng, sự chậm trễ gây thiệt hại khó khắc phục; dưới dạng tăng thuế, hoàn trả nếu điều tra không xác nhận tổn hại (Điều 6)\"},{\"from\":\"t2\",\"to\":\"t3\",\"label\":\"Thời gian tạm thời được tính vào thời hạn ban đầu (Điều 6)\"},{\"from\":\"t3\",\"to\":\"t4\",\"label\":\"Nếu biện pháp quá 1 năm phải nới lỏng dần; quá 3 năm phải rà soát không muộn hơn trung kỳ (Điều 7.4)\"},{\"from\":\"t4\",\"to\":\"t5\",\"label\":\"Nếu nhập khẩu tăng tuyệt đối và biện pháp hợp lệ thì trong 3 năm đầu không được đình chỉ nhượng bộ; sau đó được, nếu không thỏa thuận được bồi thường (Điều 8.2, 8.3)\"},{\"from\":\"t5\",\"to\":\"t6\",\"label\":\"Gia hạn nếu vẫn cần thiết, ngành đang điều chỉnh, và biện pháp không hạn chế hơn trước (Điều 7.2, 7.4). Nước đang phát triển được thêm tối đa 2 năm (Điều 9.2)\"}]}", "DE_XUAT_CHUA_DUYET"], ["TR-04A", "4_VI_DU", "Ví dụ 1: qua được điều kiện mở điều tra", "Ngành thép nước X nộp đơn đề nghị điều tra thép nước Y. Các nhà sản xuất bày tỏ ý kiến, trong đó bên ủng hộ chiếm 60% sản lượng của những người bày tỏ ý kiến và 40% tổng sản lượng của ngành. Thép Y chiếm 10% tổng nhập khẩu thép tương tự, giá xuất khẩu thấp hơn giá bán tại Y, biên độ phá giá 8% giá xuất khẩu. Bước 1: có bán phá giá (Điều 2.1). Bước 2: đơn đủ ủng hộ, vì từ 50% của người bày tỏ ý kiến và trên 25% tổng sản lượng (Điều 5.4). Bước 3: biên độ trên 2% và thị phần nhập khẩu trên 3% nên vượt ngưỡng tối thiểu (Điều 5.8). Kết luận: có thể mở điều tra. Việc có áp thuế hay không còn phụ thuộc kết luận về tổn hại và nhân quả (Điều 3). Tình huống là giả định.", "ADA Điều 2.1, 5.4, 5.8", "QUY_DINH_RO_DOI_CHIEU_BAN_DICH_DRIVE_DIEN_GIAI", "", "", "", "DE_XUAT_CHUA_DUYET"], ["TR-04B", "4_VI_DU", "Ví dụ 2: trượt ở ngưỡng tối thiểu", "Cùng tình huống nhưng biên độ phá giá chỉ 1,5% giá xuất khẩu. Biên độ dưới 2% giá xuất khẩu được coi là không quá mức tối thiểu. Kết luận: cuộc điều tra phải bị đình chỉ ngay (Điều 5.8), dù đơn có đủ ủng hộ và dù ngành trong nước đang gặp khó. Tương tự, nếu thép Y chỉ chiếm 2% tổng nhập khẩu và không có điều kiện cộng gộp các nước dưới 3% cộng lại trên 7%, khối lượng nhập khẩu bị coi là không đáng kể và cuộc điều tra cũng bị đình chỉ. Tình huống là giả định.", "ADA Điều 5.8", "QUY_DINH_RO_DOI_CHIEU_BAN_DICH_DRIVE_DIEN_GIAI", "", "", "", "DE_XUAT_CHUA_DUYET"], ["TR-04C", "4_VI_DU", "Ví dụ 3: tự vệ và nước đang phát triển", "Thép từ nhiều nước đổ vào nước X, không nước nào bán phá giá, nhập khẩu tăng 60% trong hai năm và ngành thép trong nước giảm thị phần, giảm việc làm, lỗ liên tục. Điều tra công khai xác định có quan hệ nhân quả. X áp thuế tự vệ ba năm lên thép từ mọi nguồn (Điều 2.2). Nước Z là nước đang phát triển có thị phần thép nhập vào X chỉ 2%, nên được loại trừ khỏi biện pháp, miễn là tổng thị phần của các nước đang phát triển dưới 3% như vậy không vượt 9% (Điều 9.1). Nếu X chỉ áp thuế riêng cho thép Y thì vi phạm Điều 2.2. Nếu biện pháp phát sinh do nhập khẩu tăng tuyệt đối thì trong ba năm đầu các nước xuất khẩu chưa được đình chỉ nhượng bộ tương đương (Điều 8.3). Tình huống là giả định.", "SA Điều 2.1, 2.2, 4, 8.3, 9.1", "QUY_DINH_RO_DOI_CHIEU_BAN_DICH_DRIVE_DIEN_GIAI", "", "", "", "DE_XUAT_CHUA_DUYET"], ["TR-05A", "5_BAY", "Bẫy 1: bán phá giá không phải là bán rẻ hơn thị trường nước nhập khẩu", "Phá giá được so sánh với giá bán của sản phẩm tương tự tại thị trường nước xuất khẩu theo điều kiện thương mại thông thường, không phải với giá bán trong nước nhập khẩu. Nếu không có giá nội địa dùng được thì so với giá xuất sang nước thứ ba hoặc chi phí sản xuất cộng chi phí và lợi nhuận hợp lý (Điều 2.2). Bán dưới chi phí trong thời gian kéo dài với khối lượng đáng kể có thể bị coi là không theo điều kiện thương mại thông thường (Điều 2.2.1). Chỉ bán phá giá thôi chưa đủ để áp thuế. Còn phải có tổn hại và nhân quả.", "ADA Điều 2.1, 2.2, 2.2.1", "QUY_DINH_RO_DOI_CHIEU_BAN_DICH_DRIVE_DIEN_GIAI", "", "", "", "DE_XUAT_CHUA_DUYET"], ["TR-05B", "5_BAY", "Bẫy 2: một công cụ chọn nguồn, một công cụ không", "Chống bán phá giá đánh vào hàng từ các nguồn bị coi là bán phá giá và gây tổn hại, và loại các nguồn đã có cam kết giá được chấp nhận (Điều 9.2). Tự vệ áp cho hàng nhập từ mọi nguồn (Điều 2.2). Đề thi hay đưa một biện pháp chỉ nhắm vào một nước rồi gọi là tự vệ. Đó là sai.", "ADA Điều 9.2; SA Điều 2.2", "QUY_DINH_RO_DOI_CHIEU_BAN_DICH_DRIVE_DIEN_GIAI", "", "", "", "DE_XUAT_CHUA_DUYET"], ["TR-05C", "5_BAY", "Bẫy 3: mức tổn hại khác nhau", "Chống bán phá giá cần tổn hại hoặc đe dọa tổn hại, và đe dọa phải dựa trên chứng cứ thực tế, không phải phỏng đoán hay khả năng mơ hồ (Điều 3.7). Tự vệ cần tổn hại nghiêm trọng, được định nghĩa là suy giảm toàn diện đáng kể vị trí của ngành (Điều 4.1(a)). Cả hai đều phải chứng minh nhân quả và loại trừ tổn hại do nguyên nhân khác (ADA Điều 3.5, SA Điều 4.2(b)). Bản dịch ADA chỉ ghi “tổn hại”, không ghi rõ mức; cần xem bản tiếng Anh nếu đề hỏi chính xác mức này.", "ADA Điều 3.5, 3.7; SA Điều 4.1, 4.2", "QUY_DINH_RO_DOI_CHIEU_BAN_DICH_DRIVE_DIEN_GIAI", "", "", "", "DE_XUAT_CHUA_DUYET"], ["TR-05D", "5_BAY", "Bẫy 4: mức thuế và hồi tố", "Thuế chống bán phá giá không được vượt biên độ phá giá (Điều 9.3). Việc áp mức thấp hơn nếu đủ loại bỏ tổn hại là điều được khuyến khích, không bắt buộc (Điều 9.1). Thuế chính thức chỉ áp cho hàng đưa vào tiêu dùng sau ngày có hiệu lực (Điều 10.1). Ngoại lệ hồi tố có điều kiện: ví dụ đã có xác định tổn hại thực tế thì tính cho cả thời gian áp biện pháp tạm thời (Điều 10.2); hoặc đến 90 ngày trước biện pháp tạm thời khi thỏa các điều kiện của Điều 10.6. Không bao giờ hồi tố về trước ngày bắt đầu điều tra (Điều 10.8).", "ADA Điều 9.1, 9.3, 10.1, 10.2, 10.6, 10.8", "QUY_DINH_RO_DOI_CHIEU_BAN_DICH_DRIVE_DIEN_GIAI", "", "", "", "DE_XUAT_CHUA_DUYET"], ["TR-05E", "5_BAY", "Bẫy 5: tự vệ không tự do áp lại và không cấm trả đũa", "Sau một biện pháp tự vệ, không được áp lại cho cùng sản phẩm trong thời gian bằng thời gian đã áp, tối thiểu 2 năm (Điều 7.5). Ngoại lệ: được áp lại trong 180 ngày hoặc ít hơn nếu đã qua ít nhất 1 năm kể từ lần áp trước và chưa áp quá hai lần trong 5 năm liền trước (Điều 7.6). Tự vệ không có yếu tố lỗi của nhà xuất khẩu, nên bên áp dụng phải cố gắng giữ mức nhượng bộ tương đương và có thể phải thỏa thuận đền bù; nếu không thỏa thuận được, bên xuất khẩu có thể đình chỉ nhượng bộ tương đương, nhưng không trong ba năm đầu nếu biện pháp do nhập khẩu tăng tuyệt đối và đúng quy định (Điều 8). Cấm xuất khẩu tự nguyện và thỏa thuận chia thị trường tương tự (Điều 11.1(b)).", "SA Điều 7.5, 7.6, 8, 11.1(b)", "QUY_DINH_RO_DOI_CHIEU_BAN_DICH_DRIVE_DIEN_GIAI", "", "", "", "DE_XUAT_CHUA_DUYET"], ["TR-06-AD", "6_BANG_TRA", "Bảng tra: các con số của chống bán phá giá", "Ngưỡng ủng hộ đơn: 50% của người bày tỏ ý kiến, và không dưới 25% tổng sản lượng (5.4). Biên độ tối thiểu: dưới 2% giá xuất khẩu (5.8). Khối lượng không đáng kể: dưới 3% tổng nhập khẩu, trừ khi các nước dưới 3% cộng lại trên 7% (5.8). Điều tra: 1 năm, tối đa 18 tháng (5.10). Biện pháp tạm thời: không sớm hơn 60 ngày, tối đa 4 tháng, kéo dài 6 tháng khi có yêu cầu, hoặc 6 và 9 tháng khi xét mức thuế thấp hơn biên độ (7.3, 7.4). Hồi tố: tối đa 90 ngày trước biện pháp tạm thời, khi đủ điều kiện (10.6). Thời hạn thuế: 5 năm, rà soát hoàn tất trong 12 tháng (11.3, 11.4).", "ADA Điều 5, 7, 10, 11", "QUY_DINH_RO_DOI_CHIEU_BAN_DICH_DRIVE_DIEN_GIAI", "", "", "", "DE_XUAT_CHUA_DUYET"], ["TR-06-SA", "6_BANG_TRA", "Bảng tra: các con số của tự vệ", "Biện pháp tạm thời: tối đa 200 ngày, dưới dạng tăng thuế (Điều 6). Thời hạn: 4 năm, tổng tối đa 8 năm (7.1 đến 7.3); nước đang phát triển thêm tối đa 2 năm (9.2). Nới lỏng dần nếu quá 1 năm; rà soát không muộn hơn trung kỳ nếu quá 3 năm (7.4). Hạn chế định lượng không thấp hơn mức nhập khẩu trung bình của 3 năm đại diện gần nhất, trừ khi có biện minh (5.1). Không áp lại trong thời gian bằng thời gian đã áp, tối thiểu 2 năm (7.5). Nước đang phát triển bị loại khi thị phần dưới 3% và tổng không quá 9% (9.1). Tham vấn đền bù: 30 ngày; quyền đình chỉ nhượng bộ tương đương trong 90 ngày sau khi biện pháp được áp dụng, không trong 3 năm đầu nếu nhập khẩu tăng tuyệt đối (8.2, 8.3).", "SA Điều 5, 6, 7, 8, 9", "QUY_DINH_RO_DOI_CHIEU_BAN_DICH_DRIVE_DIEN_GIAI", "", "", "", "DE_XUAT_CHUA_DUYET"], ["TR-07", "7_GHI_CHU_NGUON", "Ghi chú nguồn và giới hạn đối chiếu", "Nguồn: file “Vbqppl LUẬT THƯƠNG MẠI QUỐC TẾ.pdf” trong Drive của anh, bản dịch tiếng Việt, không phải văn bản tiếng Anh chính thức, và có vài lỗi chính tả. Đã đối chiếu: ADA Điều 1, 2.1, 2.2, 2.2.1, 3, 5, 7, 8, 9, 10, 11; SA Điều 1 đến 12 (Điều 12 mới đọc phần đầu). Chưa đối chiếu: ADA Điều 2.3 đến 2.4 (so sánh công bằng, cách tính biên độ), Điều 4, 6, 12 đến 18; phần còn lại Điều 12 và Điều 13 đến 14 của SA; GATT Điều VI và Điều XIX; Hiệp định SCM và biện pháp đối kháng; báo cáo vụ việc; luật Việt Nam về phòng vệ thương mại. Bản dịch ADA dùng chữ “tổn hại” mà không ghi rõ mức. Các ví dụ là tình huống giả định. Toàn bộ cần anh duyệt.", "", "CHUA_XAC_MINH", "https://drive.google.com/file/d/1ZvH0_KdKGC1u_p8PFJIogjHLyXSgWhd_/view", "", "", "DE_XUAT_CHUA_DUYET"]], "SOAN_THU_20261026_INCOTERMS": [["INC-00", "0_PHAM_VI", "Chủ đề và phạm vi", "Chủ đề: Incoterms 2020 và bốn điều kiện hay thi: CIP, CFR, FAS, CIF. Bài chỉ bàn bốn điều kiện này và các nguyên tắc chung của Incoterms. Bảy điều kiện còn lại (EXW, FCA, CPT, DAP, DPU, DDP, FOB) chỉ nhắc để so sánh. Chưa bàn nội dung từng điều A1 đến A10 và B1 đến B10 của cả bốn điều kiện; các hàng so sánh chỉ lấy những điều quyết định rủi ro, chi phí, vận tải, bảo hiểm và thông quan. Nguồn: bản tiếng Anh ICC (phần giới thiệu và điều kiện CIP) và bản giải thích tiếng Việt của Vinatrain (FAS, CFR, CIF). Bản tiếng Anh trích được trong Drive bị cắt trước các điều kiện đường biển nên chưa có bản gốc cho FAS, CFR, CIF. Nên học sau bài hình thành hợp đồng CISG vì Incoterms chỉ có hiệu lực khi được đưa vào hợp đồng.", "Incoterms 2020: Phần giới thiệu mục I đến IV; điều kiện CIP", "QUY_DINH_RO_DOI_CHIEU_ICC_ANH_DIEN_GIAI", "https://drive.google.com/file/d/16pmTsELToNtEPHMyhgDw7iI7ojShsd6N/view", "", "", "DE_XUAT_CHUA_DUYET"], ["INC-01", "1_CAU_HOI", "Ba câu hỏi đời thường", "Câu 1: Công ty A ở Việt Nam bán một lô thép cho công ty B ở Hàn Quốc, điều kiện CIF cảng Busan. Hàng đã lên tàu ở Hải Phòng, ra khơi thì tàu gặp bão, hàng hỏng. Ai chịu thiệt hại, và ai đòi được tiền bảo hiểm? Câu 2: Nếu hợp đồng ghi CFR thay vì CIF thì câu trả lời đổi thế nào? Câu 3: Nếu hàng đóng container và giao cho hãng tàu ở bãi tại cảng, điều kiện nào còn phù hợp?", "", "QUAN_DIEM_GIANG_DAY", "", "", "", "DE_XUAT_CHUA_DUYET"], ["INC-02", "2_QUY_TAC", "Quy tắc nền tảng", "Incoterms 2020 chỉ mô tả ba việc giữa người bán và người mua: nghĩa vụ ai làm gì, rủi ro chuyển khi nào, chi phí ai trả. Incoterms không phải hợp đồng mua bán và không phải luật; nó chỉ có hiệu lực khi các bên đưa nó vào hợp đồng, nên phải ghi rõ dạng \"điều kiện + địa điểm + Incoterms 2020\". Mốc chuyển rủi ro nằm ở điểm giao hàng. Với nhóm C (CFR, CIF, CIP), địa điểm ghi kèm tên điều kiện là nơi hàng đến mà người bán phải trả tiền vận chuyển, không phải nơi giao hàng và chuyển rủi ro.", "Incoterms 2020: Phần giới thiệu mục 4 đến 12", "QUY_DINH_RO_DOI_CHIEU_ICC_ANH_DIEN_GIAI", "https://drive.google.com/file/d/16pmTsELToNtEPHMyhgDw7iI7ojShsd6N/view", "", "", "DE_XUAT_CHUA_DUYET"], ["INC-03A", "3_SO_DO", "Ma trận so sánh FAS, CFR, CIF, CIP", "Tám hàng so sánh bốn điều kiện. Cột CIP lấy từ bản tiếng Anh của ICC; ba cột còn lại lấy từ bản giải thích tiếng Việt.", "Incoterms 2020: FAS, CFR, CIF, CIP", "DOI_CHIEU_BAN_GIAI_THICH_VN_CHUA_CO_BAN_GOC", "", "MA_TRAN", "{\"cols\":[\"FAS\",\"CFR\",\"CIF\",\"CIP\"],\"rows\":[{\"label\":\"Phương thức vận tải\",\"cells\":[\"Biển và thủy nội địa\",\"Biển và thủy nội địa\",\"Biển và thủy nội địa\",\"Mọi phương thức\"]},{\"label\":\"Giao hàng và chuyển rủi ro khi nào\",\"cells\":[\"Hàng đặt dọc mạn tàu do người mua chỉ định, tại cảng xếp hàng\",\"Hàng được giao lên tàu tại cảng đi (hoặc mua hàng đã giao như vậy)\",\"Hàng được giao lên tàu tại cảng đi (hoặc mua hàng đã giao như vậy)\",\"Hàng giao cho người chuyên chở do người bán ký hợp đồng (hoặc mua hàng đã giao như vậy)\"]},{\"label\":\"Ai ký hợp đồng vận tải\",\"cells\":[\"Người mua (người bán không có nghĩa vụ)\",\"Người bán, tới cảng đến\",\"Người bán, tới cảng đến\",\"Người bán, tới địa điểm đến\"]},{\"label\":\"Ai mua bảo hiểm\",\"cells\":[\"Không bên nào có nghĩa vụ với bên kia\",\"Người bán không có nghĩa vụ; người mua tự mua nếu cần\",\"Người bán mua cho người mua\",\"Người bán mua cho người mua\"]},{\"label\":\"Mức bảo hiểm tối thiểu\",\"cells\":[\"Không có\",\"Không có\",\"Điều kiện C của Institute Cargo Clauses hoặc tương tự; 110% giá hợp đồng, cùng tiền tệ hợp đồng\",\"Điều kiện A của Institute Cargo Clauses hoặc tương tự; 110% giá hợp đồng, cùng tiền tệ hợp đồng\"]},{\"label\":\"Thông quan xuất khẩu\",\"cells\":[\"Người bán\",\"Người bán\",\"Người bán\",\"Người bán\"]},{\"label\":\"Thông quan nhập khẩu\",\"cells\":[\"Người mua\",\"Người mua\",\"Người mua\",\"Người mua\"]},{\"label\":\"Chi phí dỡ hàng ở nơi đến\",\"cells\":[\"Không áp dụng (người mua nhận hàng ở cảng xếp)\",\"Người bán chịu nếu nằm trong hợp đồng vận tải của mình, không đòi lại người mua trừ khi thỏa thuận khác\",\"Người bán chịu nếu nằm trong hợp đồng vận tải của mình, không đòi lại người mua trừ khi thỏa thuận khác\",\"Người bán chịu nếu nằm trong hợp đồng vận tải của mình, không đòi lại người mua trừ khi thỏa thuận khác\"]}]}", "DE_XUAT_CHUA_DUYET"], ["INC-03B", "3_SO_DO", "Cây quyết định: hàng hỏng, ai chịu rủi ro", "Hai câu hỏi để biết rủi ro hàng hỏng thuộc về ai. Áp dụng cho cả bốn điều kiện; chỉ khác ở điều \"giao hàng\" là gì.", "Incoterms 2020: A2, A3, B3, B10 của từng điều kiện", "DOI_CHIEU_BAN_GIAI_THICH_VN_CHUA_CO_BAN_GOC", "", "CAY_QUYET_DINH", "{\"start\":\"q1\",\"nodes\":[{\"id\":\"q1\",\"cspl\":\"A2, A3, B3\",\"text\":\"Hàng đã được giao theo điều A2 của điều kiện đã chọn? (FAS: đặt dọc mạn tàu; CFR, CIF: lên tàu tại cảng đi; CIP: giao cho người chuyên chở đầu tiên do người bán ký hợp đồng)\",\"yes\":\"e1\",\"no\":\"q2\"},{\"id\":\"q2\",\"cspl\":\"B3, B10\",\"text\":\"Người mua có quyền chọn thời điểm hoặc địa điểm nhận, nhưng không thông báo đủ cho người bán, và hàng đã được xác định rõ là hàng của hợp đồng?\",\"yes\":\"e2\",\"no\":\"e3\"}],\"ends\":[{\"id\":\"e1\",\"text\":\"Người mua chịu rủi ro mất mát hoặc hư hỏng từ lúc giao hàng. Với CIF và CIP, người mua đòi tiền bảo hiểm trực tiếp từ công ty bảo hiểm.\"},{\"id\":\"e2\",\"text\":\"Người mua chịu rủi ro từ ngày thỏa thuận hoặc ngày cuối của thời hạn giao hàng, dù hàng chưa thực giao.\"},{\"id\":\"e3\",\"text\":\"Người bán vẫn chịu rủi ro, vì hàng chưa được giao.\"}]}", "DE_XUAT_CHUA_DUYET"], ["INC-03C", "3_SO_DO", "Dòng thời gian một lô hàng CIF", "Năm mốc của một lô hàng bán CIF, kèm ai chịu rủi ro, ai trả cước và bảo hiểm ở từng đoạn. Với CFR thì giống hệt, chỉ bỏ nghĩa vụ bảo hiểm của người bán.", "Incoterms 2020: CIF A2 đến A9, B3, B9", "DOI_CHIEU_BAN_GIAI_THICH_VN_CHUA_CO_BAN_GOC", "", "DONG_THOI_GIAN", "{\"events\":[{\"id\":\"t1\",\"label\":\"Người bán sản xuất, đóng gói, thông quan xuất khẩu\"},{\"id\":\"t2\",\"label\":\"Hàng được giao lên tàu tại cảng đi: rủi ro chuyển sang người mua\"},{\"id\":\"t3\",\"label\":\"Tàu chạy trên biển\"},{\"id\":\"t4\",\"label\":\"Tàu đến cảng đích\"},{\"id\":\"t5\",\"label\":\"Dỡ hàng, người mua nhận hàng và thông quan nhập khẩu\"}],\"spans\":[{\"from\":\"t1\",\"to\":\"t2\",\"label\":\"Người bán chịu rủi ro và chi phí. Người bán đã ký hợp đồng vận tải và mua bảo hiểm\"},{\"from\":\"t2\",\"to\":\"t3\",\"label\":\"Người mua chịu rủi ro hàng hỏng, nhưng bảo hiểm do người bán mua bảo vệ cho người mua; người mua đòi bảo hiểm trực tiếp\"},{\"from\":\"t3\",\"to\":\"t4\",\"label\":\"Người bán đã trả cước vận chuyển tới cảng đích. Bảo hiểm phải có hiệu lực ít nhất tới cảng đích\"},{\"from\":\"t4\",\"to\":\"t5\",\"label\":\"Chi phí dỡ hàng thuộc người bán nếu nằm trong hợp đồng vận tải của người bán, còn lại người mua trả\"}]}", "DE_XUAT_CHUA_DUYET"], ["INC-03D", "3_SO_DO", "Cây quyết định: chọn điều kiện nào", "Ba câu hỏi để chọn trong bốn điều kiện, hoặc biết phải chuyển sang điều kiện khác.", "Incoterms 2020: Hướng dẫn sử dụng của FAS, CFR, CIF, CIP", "DOI_CHIEU_BAN_GIAI_THICH_VN_CHUA_CO_BAN_GOC", "", "CAY_QUYET_DINH", "{\"start\":\"q1\",\"nodes\":[{\"id\":\"q1\",\"cspl\":\"Hướng dẫn sử dụng, mục 1\",\"text\":\"Hàng được giao cho người chuyên chở trước khi lên tàu (ví dụ container giao tại bãi ở cảng)?\",\"yes\":\"e1\",\"no\":\"q2\"},{\"id\":\"q2\",\"cspl\":\"A4\",\"text\":\"Người bán phải ký hợp đồng vận tải tới nơi đến?\",\"yes\":\"q3\",\"no\":\"e2\"},{\"id\":\"q3\",\"cspl\":\"A5\",\"text\":\"Người bán phải mua bảo hiểm cho người mua?\",\"yes\":\"e3\",\"no\":\"e4\"}],\"ends\":[{\"id\":\"e1\",\"text\":\"Không dùng FAS, CFR, CIF. Dùng FCA thay FAS; dùng CPT hoặc CIP thay CFR hoặc CIF (CIP nếu người bán phải mua bảo hiểm).\"},{\"id\":\"e2\",\"text\":\"FAS: người mua thuê tàu và chịu mọi chi phí từ khi hàng đặt dọc mạn tàu.\"},{\"id\":\"e3\",\"text\":\"CIF: người bán thuê tàu và mua bảo hiểm tối thiểu điều kiện C.\"},{\"id\":\"e4\",\"text\":\"CFR: người bán thuê tàu, không có nghĩa vụ bảo hiểm.\"}]}", "DE_XUAT_CHUA_DUYET"], ["INC-04A", "4_VI_DU", "Ví dụ 1: CIF, tàu gặp bão", "A (Việt Nam) bán thép cho B (Hàn Quốc) CIF Busan Incoterms 2020. Hàng lên tàu ở Hải Phòng ngày 1/3, ngày 5/3 tàu gặp bão, hàng hỏng. Bước 1: hàng đã được giao lên tàu, nên rủi ro đã chuyển sang B (A3, B3). Bước 2: B vẫn phải trả tiền hàng. Bước 3: A đã mua bảo hiểm cho B (A5), nên B đòi bồi thường trực tiếp từ công ty bảo hiểm, mức tối thiểu 110% giá hợp đồng. Kết luận: B chịu rủi ro nhưng được bảo hiểm bù. Lưu ý: nếu bảo hiểm chỉ ở mức tối thiểu điều kiện C thì nhiều rủi ro có thể không được bồi thường; cần xem rủi ro gây ra thiệt hại có nằm trong phạm vi điều kiện C hay không, việc này ngoài phạm vi bài. Tình huống là giả định.", "Incoterms 2020: CIF A3, A5, B3", "DOI_CHIEU_BAN_GIAI_THICH_VN_CHUA_CO_BAN_GOC", "", "", "", "DE_XUAT_CHUA_DUYET"], ["INC-04B", "4_VI_DU", "Ví dụ 2: cùng tình huống nhưng CFR", "Hợp đồng ghi CFR Busan Incoterms 2020, cùng diễn biến tàu gặp bão. Rủi ro vẫn chuyển sang B khi hàng lên tàu. Khác biệt: A không có nghĩa vụ phải mua bảo hiểm cho B, và B không có nghĩa vụ với A về việc đó. Nếu B không tự mua bảo hiểm thì B chịu toàn bộ thiệt hại. Đây là lý do bản giải thích khuyên người mua nên tự mua bảo hiểm khi dùng CFR. Tình huống là giả định.", "Incoterms 2020: CFR A3, A5, B3, B5", "DOI_CHIEU_BAN_GIAI_THICH_VN_CHUA_CO_BAN_GOC", "", "", "", "DE_XUAT_CHUA_DUYET"], ["INC-04C", "4_VI_DU", "Ví dụ 3: CIP, giao cho người chuyên chở đầu tiên", "Hàng giao cho người chuyên chở ở Las Vegas để chuyển đến Southampton, theo CIP. Rủi ro chuyển sang người mua tại Las Vegas, nơi giao cho người chuyên chở; nhưng người bán phải ký hợp đồng vận tải tới Southampton và mua bảo hiểm điều kiện A từ Las Vegas đến ít nhất Southampton. Người bán không đảm bảo hàng đến nơi nguyên vẹn. Nếu có nhiều người chuyên chở cho từng chặng và các bên không thỏa thuận địa điểm giao, thì mặc định rủi ro chuyển khi giao cho người chuyên chở đầu tiên tại điểm do người bán chọn. Ví dụ địa điểm lấy từ chính bản tiếng Anh của ICC.", "Incoterms 2020: CIP, Ghi chú giải thích mục 1, 4, 5; A2 đến A5", "QUY_DINH_RO_DOI_CHIEU_ICC_ANH_DIEN_GIAI", "https://drive.google.com/file/d/16pmTsELToNtEPHMyhgDw7iI7ojShsd6N/view", "", "", "DE_XUAT_CHUA_DUYET"], ["INC-04D", "4_VI_DU", "Ví dụ 4: FAS, người mua không thông báo", "Hợp đồng FAS Hải Phòng. Hai bên thỏa thuận giao hàng trong khoảng từ 1 đến 10/4, và người mua có quyền chọn ngày giao nhưng không thông báo cho người bán. Hàng đã được phân biệt rõ là hàng của hợp đồng. Theo B3, người mua chịu rủi ro và chi phí từ ngày cuối của khoảng thời gian thỏa thuận (10/4), dù hàng chưa được đặt dọc mạn tàu. Tình huống là giả định.", "Incoterms 2020: FAS A2, A3, B3, B9, B10", "DOI_CHIEU_BAN_GIAI_THICH_VN_CHUA_CO_BAN_GOC", "", "", "", "DE_XUAT_CHUA_DUYET"], ["INC-05A", "5_BAY", "Bẫy 1: địa điểm ghi kèm có hai nghĩa khác nhau", "Với nhóm C (CFR, CIF, CIP): địa điểm ghi kèm là nơi người bán phải tổ chức và trả tiền vận chuyển tới, không phải nơi giao hàng. Với nhóm F như FAS: địa điểm ghi kèm là cảng giao hàng, nơi rủi ro chuyển. Đề thi hay hỏi “CIF Busan thì rủi ro chuyển ở đâu”: đáp án là ở cảng đi khi hàng lên tàu, không phải ở Busan. Hai địa điểm, hai mốc khác nhau, đây là lý do gọi là hai điểm tới hạn.", "Incoterms 2020: Phần giới thiệu mục 12", "QUY_DINH_RO_DOI_CHIEU_ICC_ANH_DIEN_GIAI", "https://drive.google.com/file/d/16pmTsELToNtEPHMyhgDw7iI7ojShsd6N/view", "", "", "DE_XUAT_CHUA_DUYET"], ["INC-05B", "5_BAY", "Bẫy 2: trả cước không phải chịu rủi ro đến nơi", "Trong CFR, CIF, CIP, người bán trả cước tới đích nhưng không chịu rủi ro tới đích. Người bán không đảm bảo hàng đến nơi nguyên vẹn, đủ số lượng, hay đến nơi (bản ICC nói rõ đối với CIP).", "Incoterms 2020: CIP Ghi chú giải thích mục 1", "QUY_DINH_RO_DOI_CHIEU_ICC_ANH_DIEN_GIAI", "https://drive.google.com/file/d/16pmTsELToNtEPHMyhgDw7iI7ojShsd6N/view", "", "", "DE_XUAT_CHUA_DUYET"], ["INC-05C", "5_BAY", "Bẫy 3: Incoterms không quyết định những điều hay bị hỏi", "Incoterms không nói gì về: có hợp đồng mua bán hay không, đặc điểm hàng hóa, thời điểm phương thức và tiền tệ thanh toán, chế tài khi vi phạm, hậu quả chậm giao, trừng phạt, thuế quan, cấm xuất nhập khẩu, bất khả kháng, quyền sở hữu trí tuệ, cách giải quyết tranh chấp. Đặc biệt quan trọng: Incoterms không quyết định việc chuyển quyền sở hữu hàng hóa. Rủi ro chuyển không có nghĩa là quyền sở hữu cũng chuyển. Ngoài ra Incoterms không phải luật áp dụng cho hợp đồng; luật áp dụng có thể là điều ước quốc tế như CISG hoặc luật trong nước.", "Incoterms 2020: Phần giới thiệu mục 6 đến 8", "QUY_DINH_RO_DOI_CHIEU_ICC_ANH_DIEN_GIAI", "https://drive.google.com/file/d/16pmTsELToNtEPHMyhgDw7iI7ojShsd6N/view", "", "", "DE_XUAT_CHUA_DUYET"], ["INC-05D", "5_BAY", "Bẫy 4: CIF và CIP khác mức bảo hiểm", "Theo Incoterms 2020, CIP đòi bảo hiểm mức rộng điều kiện A của Institute Cargo Clauses; các bên vẫn có thể thỏa thuận mức thấp hơn (bản ICC). CIF yêu cầu tối thiểu điều kiện C (bản giải thích tiếng Việt). Giá trị bảo hiểm tối thiểu là 110% giá hợp đồng, cùng tiền tệ hợp đồng, phủ từ điểm giao đến ít nhất điểm đến. Bảo hiểm phải cho phép người mua đòi trực tiếp công ty bảo hiểm. Chủ đề này gặp lỗi trong một bản dịch Vinatrain khác trong Drive, viết lẫn lộn “mức cao nhất” và “hạ thấp xuống” cho CIP; đúng là theo bản ICC: mức mặc định là điều kiện A, và các bên được thỏa thuận mức thấp hơn.", "Incoterms 2020: CIP A5; CIF A5", "DOI_CHIEU_BAN_GIAI_THICH_VN_CHUA_CO_BAN_GOC", "", "", "", "DE_XUAT_CHUA_DUYET"], ["INC-05E", "5_BAY", "Bẫy 5: container và thông quan nhập khẩu", "FAS, CFR, CIF chỉ phù hợp khi hàng giao lên tàu hoặc dọc mạn tàu. Hàng đóng container thường giao cho hãng tàu ở bãi cảng trước khi lên tàu, nên bản giải thích khuyên dùng FCA thay FAS và CPT thay CFR, CIF (CIP thay khi cần bảo hiểm). Với cả bốn điều kiện, người bán thông quan xuất khẩu, còn thông quan nhập khẩu, thuế nhập khẩu và quá cảnh nước thứ ba do người mua.", "Incoterms 2020: Hướng dẫn sử dụng mục 1 và mục thông quan của FAS, CFR, CIF, CIP", "DOI_CHIEU_BAN_GIAI_THICH_VN_CHUA_CO_BAN_GOC", "", "", "", "DE_XUAT_CHUA_DUYET"], ["INC-05F", "5_BAY", "Bẫy 6: ghi chú nhiều người chuyên chở trong CFR, CIF", "Bản giải thích tiếng Việt của CFR và CIF có đoạn nói mặc định rủi ro chuyển khi giao cho người chuyên chở đầu tiên (ví dụ Hồng Kông). Đoạn này mâu thuẫn với chính A2, A3 của CFR và CIF trong cùng bản (giao lên tàu) và có vẻ sao chép từ giải thích của CPT, CIP, nơi bản ICC nói mặc định như vậy. Không dùng đoạn này để trả lời cho CFR, CIF. CHƯA XÁC MINH vì chưa có bản tiếng Anh của CFR, CIF.", "Incoterms 2020: CFR, CIF A2, A3; Ghi chú giải thích mục 3", "CHUA_XAC_MINH", "", "", "", "DE_XUAT_CHUA_DUYET"], ["INC-06", "6_BANG_TRA", "Bảng tra nhanh bốn điều kiện", "FAS: giao dọc mạn tàu; người mua thuê tàu; không ai mua bảo hiểm cho bên kia. CFR: giao lên tàu; người bán thuê tàu tới cảng đến; người bán không phải mua bảo hiểm. CIF: như CFR nhưng người bán mua bảo hiểm tối thiểu điều kiện C, 110%. CIP: giao cho người chuyên chở đầu tiên, mọi phương thức, người bán mua bảo hiểm điều kiện A, 110%. Cả bốn: người bán thông quan xuất khẩu, người mua thông quan nhập khẩu. Ba điều kiện biển dùng khi hàng lên tàu hoặc dọc mạn tàu; CIP dùng mọi phương thức.", "Incoterms 2020: FAS, CFR, CIF, CIP", "DOI_CHIEU_BAN_GIAI_THICH_VN_CHUA_CO_BAN_GOC", "", "", "", "DE_XUAT_CHUA_DUYET"], ["INC-07", "7_GHI_CHU_NGUON", "Ghi chú nguồn và giới hạn đối chiếu", "Nguồn: thư mục Drive Incoterms 2020 anh gửi gồm 4 file. (1) “Incoterms ® 2020 by International Chamber of Commerce ICC - VINATRAIN.pdf”: bản tiếng Anh của ICC do Vinatrain đăng lại. Bản trích chữ trên máy chủ đọc được phần giới thiệu và các điều kiện EXW đến DDP (trong đó có CIP), nhưng bị cắt trước FAS, FOB, CFR, CIF. (2) hai bản tiếng Việt của Vinatrain: tài liệu giải thích có đủ FAS, CFR, CIF. Đây là bản giải thích của trung tâm đào tạo, không phải bản dịch chính thức của ICC, có lỗi chính tả và có một đoạn mâu thuẫn (xem INC-05D, INC-05F). (3) file “Incoterms-2020.pdf” (bản quét, 26MB) không đọc được chữ, chưa dùng. Đã đối chiếu bản gốc ICC: phần giới thiệu mục 4 đến 12, 59 đến 62, và toàn bộ phần CIP. Chưa có bản gốc cho FAS, CFR, CIF: phần này dựa vào bản giải thích tiếng Việt và cần đối chiếu với bản ICC trước khi duyệt. Chưa bàn EXW, FCA, CPT, DAP, DPU, DDP, FOB. Các ví dụ là tình huống giả định (trừ ví dụ Las Vegas lấy từ bản ICC). Toàn bộ cần anh duyệt.", "", "CHUA_XAC_MINH", "https://drive.google.com/drive/folders/16n65477z57340jnmFA9w2Wp6pKaQqslS", "", "", "DE_XUAT_CHUA_DUYET"]], "SOAN_THU_20261026_MFN_NT": [["MFN-00", "0_PHAM_VI", "Chủ đề và điều kiện đứng trước", "Chủ đề: Hai nước đối xử khác nhau với hàng hóa có được không (MFN và NT). Chương nguồn trong Sheet: I.3. Chủ đề này giả định cả hai nước là thành viên WTO và biện pháp liên quan đến thương mại hàng hóa. Dịch vụ và sở hữu trí tuệ có quy tắc riêng, không bàn ở đây. Việc biện pháp có được miễn trừ hay không thuộc chương I.4.", "GATT Thành viên WTO, Điều I:1, Điều III", "QUY_DINH_RO_DOI_CHIEU_WTO_DIEN_GIAI", "https://www.wto.org/English/Docs_E/legal_e/gatt47_e.pdf", "", "", "DE_XUAT_CHUA_DUYET"], ["MFN-01", "1_CAU_HOI", "Hai câu hỏi đời thường", "Câu 1: Nước X cho thép Nhật vào với thuế 0% nhưng thép Hàn Quốc thuế 5%, trong khi không có hiệp định riêng nào. Điều này có được không? Câu 2: Thép đã nhập khẩu vào nước X rồi, nhưng nước X đánh thuế tiêu thụ nội địa cao hơn lên thép nhập so với thép sản xuất trong nước. Điều này có được không? Hai câu hỏi giống nhau ở chỗ đều nói về đối xử khác nhau, nhưng chúng thuộc hai nguyên tắc khác nhau.", "", "QUAN_DIEM_GIANG_DAY", "", "", "", "DE_XUAT_CHUA_DUYET"], ["MFN-02", "2_QUY_TAC", "Quy tắc của hai nguyên tắc", "MFN: khi nước nào dành một lợi ích cho hàng hóa của một thành viên thì phải dành ngay và vô điều kiện cho hàng giống của mọi thành viên khác (Điều I:1). NT: hàng nhập khẩu không được bị đối xử kém hơn hàng giống sản xuất trong nước về thuế và quy định nội địa (Điều III). Cách phân biệt nhanh: MFN so hàng nhập với hàng nhập từ nước khác; NT so hàng nhập với hàng nội địa.", "GATT Điều I:1, Điều III", "QUY_DINH_RO_DOI_CHIEU_WTO_DIEN_GIAI", "https://www.wto.org/English/Docs_E/legal_e/gatt47_e.pdf", "", "", "DE_XUAT_CHUA_DUYET"], ["MFN-03A", "3_SO_DO", "Ma trận so sánh MFN và NT", "Năm hàng so sánh MFN và NT: so sánh ai với ai, điều khoản, điều kiện then chốt, ví dụ, câu tự kiểm tra.", "GATT Điều I:1, Điều III", "QUY_DINH_RO_DOI_CHIEU_WTO_DIEN_GIAI", "", "MA_TRAN", "{\"cols\":[\"MFN\",\"NT\"],\"rows\":[{\"label\":\"So sánh ai với ai\",\"cells\":[\"Hàng nhập khẩu từ nước này với hàng nhập khẩu từ nước khác\",\"Hàng nhập khẩu với hàng sản xuất trong nước\"]},{\"label\":\"Điều khoản chính\",\"cells\":[\"GATT Điều I:1\",\"GATT Điều III (III:1, III:2, III:4)\"]},{\"label\":\"Điều kiện then chốt\",\"cells\":[\"Hàng giống; lợi ích phải mở rộng ngay và vô điều kiện\",\"Hàng giống; không được đối xử kém hơn, không nhằm bảo hộ sản xuất trong nước\"]},{\"label\":\"Ví dụ\",\"cells\":[\"Thuế nhập khẩu 0% cho thép Nhật nhưng 5% cho thép Hàn\",\"Thuế tiêu thụ nội địa đánh lên thép nhập khẩu cao hơn lên thép sản xuất trong nước\"]},{\"label\":\"Câu tự kiểm tra\",\"cells\":[\"Có nước nào được đối xử tốt hơn nước khác không?\",\"Hàng ngoại có bị thiệt hơn hàng nội sau khi vào thị trường không?\"]}]}", "DE_XUAT_CHUA_DUYET"], ["MFN-03B", "3_SO_DO", "Cây quyết định: biện pháp có vi phạm MFN hay NT không", "Đi qua từng câu hỏi để biết biện pháp rơi vào nguyên tắc nào và có vi phạm không. Đây là bản đơn giản hóa để học, thực tế từng vụ còn phụ thuộc cách xem xét hàng giống và ngữ cảnh.", "GATT Điều I:1, Điều III", "QUY_DINH_RO_DOI_CHIEU_WTO_DIEN_GIAI; PHAM_VI_DON_GIAN_HOA_LA_QUAN_DIEM_GIANG_DAY", "", "CAY_QUYET_DINH", "{\"start\":\"q1\",\"nodes\":[{\"id\":\"q1\",\"cspl\":\"Điều I:1, Điều III\",\"text\":\"Biện pháp có đối xử khác nhau giữa các hàng hóa tùy theo nguồn gốc hoặc xuất xứ không?\",\"yes\":\"q2\",\"no\":\"e1\"},{\"id\":\"q2\",\"cspl\":\"Điều I:1, III:2, III:4\",\"text\":\"Các hàng hóa đem ra so sánh có phải hàng giống nhau không?\",\"yes\":\"q3\",\"no\":\"e2\"},{\"id\":\"q3\",\"cspl\":\"Điều I:1\",\"text\":\"Sự khác biệt là giữa hàng nhập khẩu từ các nước khác nhau?\",\"yes\":\"q4\",\"no\":\"q5\"},{\"id\":\"q4\",\"cspl\":\"Điều I:1\",\"text\":\"Lợi ích dành cho hàng của một nước có được mở rộng ngay và vô điều kiện cho hàng giống của mọi thành viên khác không?\",\"yes\":\"e3\",\"no\":\"q6\"},{\"id\":\"q5\",\"cspl\":\"Điều III:2, III:4\",\"text\":\"Hàng nhập khẩu có bị đối xử kém hơn hàng giống sản xuất trong nước về thuế hoặc quy định nội địa không?\",\"yes\":\"q7\",\"no\":\"e6\"},{\"id\":\"q6\",\"cspl\":\"Chương I.4\",\"text\":\"Có ngoại lệ được phép áp dụng cho biện pháp này không (ví dụ khu vực thương mại tự do, ngoại lệ chung)?\",\"yes\":\"e4\",\"no\":\"e5\"},{\"id\":\"q7\",\"cspl\":\"Chương I.4\",\"text\":\"Có ngoại lệ được phép áp dụng cho biện pháp này không (ví dụ ngoại lệ chung)?\",\"yes\":\"e4\",\"no\":\"e7\"}],\"ends\":[{\"id\":\"e1\",\"text\":\"Không phân biệt theo xuất xứ: chưa vi phạm MFN hay NT. Biện pháp vẫn có thể vi phạm quy tắc khác.\"},{\"id\":\"e2\",\"text\":\"Không phải hàng giống: chưa thể so sánh theo MFN hay NT.\"},{\"id\":\"e3\",\"text\":\"Không vi phạm MFN (Điều I:1).\"},{\"id\":\"e4\",\"text\":\"Có thể được phép nhờ ngoại lệ. Xem chương I.4 để xét điều kiện.\"},{\"id\":\"e5\",\"text\":\"Vi phạm MFN (Điều I:1), nếu không có ngoại lệ.\"},{\"id\":\"e6\",\"text\":\"Không vi phạm NT (Điều III).\"},{\"id\":\"e7\",\"text\":\"Vi phạm NT (Điều III), nếu không có ngoại lệ.\"}]}", "DE_XUAT_CHUA_DUYET"], ["MFN-04A", "4_VI_DU", "Ví dụ 1: thuế nhập khẩu khác nhau", "Nước X (thành viên WTO) áp thuế nhập khẩu 5% cho thép Hàn Quốc và 0% cho thép Nhật, các loại thép giống nhau, không có hiệp định thương mại riêng hay ngoại lệ nào. Bước 1: có đối xử khác nhau theo xuất xứ. Bước 2: hàng giống nhau (theo giả định). Bước 3: sự khác biệt là giữa hai loại hàng nhập khẩu từ hai nước, nên xem xét theo MFN. Bước 4: lợi ích 0% dành cho Nhật không được mở rộng cho Hàn Quốc. Bước 5: không có ngoại lệ. Kết luận: vi phạm Điều I:1.", "GATT Điều I:1", "QUY_DINH_RO_DOI_CHIEU_WTO_DIEN_GIAI", "", "", "", "DE_XUAT_CHUA_DUYET"], ["MFN-04B", "4_VI_DU", "Ví dụ 2: thuế nội địa cao hơn cho hàng nhập", "Nước X đánh thuế tiêu thụ nội địa 10% lên thép nhập khẩu và 5% lên thép sản xuất trong nước, hai loại thép giống nhau, không có ngoại lệ. Sự khác biệt là giữa hàng nhập và hàng nội, nên xem xét theo NT. Thuế nội địa đánh lên hàng nhập khẩu vượt mức áp dụng cho hàng giống nội địa. Kết luận: vi phạm Điều III:2 (câu thứ nhất). Chú ý: nếu 10% là thuế nhập khẩu đánh lúc hàng qua cửa khẩu thì đó là thuế quan, xem theo cam kết thuế quan chứ không phải NT.", "GATT Điều III:2", "QUY_DINH_RO_DOI_CHIEU_WTO_DIEN_GIAI", "", "", "", "DE_XUAT_CHUA_DUYET"], ["MFN-04C", "4_VI_DU", "Ví dụ 3: thuế khác nhau cho hai loại hàng khác nhau", "Nước X áp thuế nhập khẩu 5% cho thép và 0% cho gạo. Hai hàng này không phải hàng giống nhau. Kết luận: không đặt ra vấn đề MFN hay NT, vì không có sự so sánh hợp lệ giữa hai hàng. Sai lầm phổ biến là thấy thuế khác nhau là kết luận vi phạm.", "GATT Điều I:1", "QUY_DINH_RO_DOI_CHIEU_WTO_DIEN_GIAI", "", "", "", "DE_XUAT_CHUA_DUYET"], ["MFN-05A", "5_BAY", "Bẫy 1: nhầm điểm so sánh", "MFN hỏi nước nào được đối xử tốt hơn nước khác. NT hỏi hàng ngoại có bị thiệt hơn hàng nội hay không. Nếu đề bài nói về hai nước xuất khẩu khác nhau thì nghĩ tới MFN; nếu nói về hàng nhập so với hàng nội thì nghĩ tới NT.", "GATT Điều I:1, Điều III", "QUY_DINH_RO_DOI_CHIEU_WTO_DIEN_GIAI", "", "", "", "DE_XUAT_CHUA_DUYET"], ["MFN-05B", "5_BAY", "Bẫy 2: NT không áp dụng cho thuế nhập khẩu lúc qua cửa khẩu", "NT nói về thuế và quy định nội địa sau khi hàng đã vào thị trường. Thuế nhập khẩu đánh ở cửa khẩu là thuế quan, xem theo biểu cam kết của từng nước. Điều II của GATT chưa được đối chiếu trong lần soạn này.", "GATT Điều III, Điều II", "CHUA_XAC_MINH", "", "", "", "DE_XUAT_CHUA_DUYET"], ["MFN-05C", "5_BAY", "Bẫy 3: thế nào là hàng giống", "Hàng giống không có nghĩa là giống hệt nhau. Trong thực tiễn giải quyết tranh chấp WTO, việc hàng giống được xét từng vụ, thường căn cứ tính chất sản phẩm, công dụng, thị hiếu người tiêu dùng và phân loại thuế quan. Đây là quan điểm thực tiễn, chưa đối chiếu với báo cáo của ban hội thẩm hay cơ quan phúc thẩm.", "GATT Điều I:1, III:2, III:4", "CHUA_XAC_MINH", "", "", "", "DE_XUAT_CHUA_DUYET"], ["MFN-05D", "5_BAY", "Bẫy 4: phân biệt không nêu tên nước", "Một biện pháp không nêu tên nước nào vẫn có thể thực tế đối xử khác nhau theo xuất xứ. Trong thực tiễn WTO, phân biệt trên thực tế cũng có thể bị xem xét. Quan điểm thực tiễn, chưa đối chiếu với báo cáo vụ việc cụ thể.", "GATT Điều I:1", "CHUA_XAC_MINH", "", "", "", "DE_XUAT_CHUA_DUYET"], ["MFN-05E", "5_BAY", "Bẫy 5: MFN và NT không tuyệt đối", "Có những trường hợp biện pháp đối xử khác nhau vẫn được phép theo ngoại lệ (ví dụ khu vực thương mại tự do, ngoại lệ chung). Điều kiện áp dụng từng ngoại lệ thuộc chương I.4; Điều XXIV và Điều XX chưa được đối chiếu trong lần soạn này.", "GATT Điều XX, Điều XXIV", "CHUA_XAC_MINH", "", "", "", "DE_XUAT_CHUA_DUYET"], ["MFN-06-I1", "6_BANG_TRA", "Điều I:1: đối xử tối huệ quốc chung", "Lợi ích mà một bên dành cho sản phẩm đến từ hoặc gửi tới một nước phải được dành “ngay lập tức và vô điều kiện” cho sản phẩm giống của mọi bên khác. Từ khóa trong văn bản: “immediately and unconditionally”, “like product”.", "GATT Điều I:1", "QUY_DINH_RO_DOI_CHIEU_WTO_DIEN_GIAI", "https://www.wto.org/English/Docs_E/legal_e/gatt47_e.pdf", "", "", "DE_XUAT_CHUA_DUYET"], ["MFN-06-III1", "6_BANG_TRA", "Điều III:1: nguyên tắc chung của NT", "Thuế, phí, luật và quy định nội địa ảnh hưởng tới việc bán, vận chuyển hay sử dụng hàng không được áp dụng cho hàng nhập khẩu hay hàng nội địa theo cách nhằm bảo hộ sản xuất trong nước. Từ khóa: “so as to afford protection to domestic production”.", "GATT Điều III:1", "QUY_DINH_RO_DOI_CHIEU_WTO_DIEN_GIAI", "https://www.wto.org/English/Docs_E/legal_e/gatt47_e.pdf", "", "", "DE_XUAT_CHUA_DUYET"], ["MFN-06-III2", "6_BANG_TRA", "Điều III:2 (câu thứ nhất): thuế nội địa", "Sản phẩm nhập khẩu không được chịu thuế hay khoản thu nội địa, trực tiếp hay gián tiếp, vượt quá mức áp dụng cho sản phẩm nội địa giống. Từ khóa: “in excess of those applied, directly or indirectly, to like domestic products”.", "GATT Điều III:2", "QUY_DINH_RO_DOI_CHIEU_WTO_DIEN_GIAI", "https://www.wto.org/English/Docs_E/legal_e/gatt47_e.pdf", "", "", "DE_XUAT_CHUA_DUYET"], ["MFN-06-III4", "6_BANG_TRA", "Điều III:4: luật và quy định nội địa", "Sản phẩm nhập khẩu phải được đối xử không kém thuận lợi hơn sản phẩm nội địa giống theo mọi luật, quy định, yêu cầu về bán, chào bán, mua, vận chuyển, phân phối hay sử dụng. Phí vận chuyển khác nhau chỉ do cách vận hành phương tiện, không do quốc tịch hàng, thì được phép. Từ khóa: “treatment no less favourable than that accorded to like products of national origin”.", "GATT Điều III:4", "QUY_DINH_RO_DOI_CHIEU_WTO_DIEN_GIAI", "https://www.wto.org/English/Docs_E/legal_e/gatt47_e.pdf", "", "", "DE_XUAT_CHUA_DUYET"], ["MFN-07", "7_GHI_CHU_NGUON", "Cách đối chiếu và giới hạn", "Các điều I:1, III:1, III:2 (câu thứ nhất) và III:4 được đối chiếu với bản The Text of the General Agreement on Tariffs and Trade (Geneva, 1986) đăng tại wto.org, là văn bản GATT 1947. GATT 1994 gồm các điều của GATT 1947 đã được sửa đổi và bổ sung bằng các văn kiện khác; chưa đối chiếu các văn kiện đó, chưa đối chiếu Điều II, XX, XXIV, chưa đối chiếu báo cáo vụ việc hay bình luận học thuật. Các ví dụ là tình huống giả định do người soạn đặt. Toàn bộ cần anh duyệt trước khi dùng.", "", "CHUA_XAC_MINH", "https://www.wto.org/English/Docs_E/legal_e/gatt47_e.pdf", "", "", "DE_XUAT_CHUA_DUYET"]], "SOAN_THU_20261026_DSU_CO_CAU": [["DSU-00", "0_PHAM_VI", "Chủ đề và phạm vi", "Chủ đề: Cơ cấu WTO, cách ra quyết định, và đường đi của một vụ tranh chấp. Chương nguồn trong Sheet: I.2 và I.6. Bài này gồm ba phần: (1) các cơ quan của WTO; (2) khi nào quyết định cần đồng thuận, khi nào được bỏ phiếu, ngưỡng bao nhiêu; (3) vụ tranh chấp đi qua tham vấn, ban hội thẩm, phúc thẩm, thực thi, trả đũa theo thứ tự nào và trong bao lâu. Chưa bàn: gia nhập WTO (Điều XII), rà soát chính sách thương mại, các thủ tục đặc biệt trong từng hiệp định (như chống bán phá giá). Văn bản dùng là bản dịch tiếng Việt lưu trong Drive của anh, chưa đối chiếu với bản tiếng Anh chính thức.", "Hiệp định Marrakesh Điều IV, IX; DSU Điều 1 đến Điều 23", "QUY_DINH_RO_DOI_CHIEU_BAN_DICH_DRIVE_DIEN_GIAI", "https://drive.google.com/file/d/1ZvH0_KdKGC1u_p8PFJIogjHLyXSgWhd_/view", "", "", "DE_XUAT_CHUA_DUYET"], ["DSU-01", "1_CAU_HOI", "Ba câu hỏi đời thường", "Câu 1: Ai là người có quyền quyết định cao nhất ở WTO, và nếu các nước không đồng ý với nhau thì có bỏ phiếu được không? Câu 2: Công ty A ở nước X bị nước Y áp một biện pháp mà A cho là trái luật WTO. Nước X muốn kiện thì phải làm gì trước, rồi gì sau, mất bao lâu? Câu 3: Nước Y thua mà không chịu sửa. Nước X làm được gì, và làm được đến đâu?", "", "QUAN_DIEM_GIANG_DAY", "", "", "", "DE_XUAT_CHUA_DUYET"], ["DSU-02", "2_QUY_TAC", "Quy tắc nền tảng", "Ra quyết định: WTO ra quyết định bằng đồng thuận; chỉ khi không có đồng thuận mới bỏ phiếu, mỗi thành viên một phiếu, và thông thường theo đa số phiếu. Có hai việc cần 3/4 số thành viên: thông qua giải thích chính thức (khoản 2 Điều IX) và miễn trừ nghĩa vụ (khoản 3 Điều IX). Giải quyết tranh chấp: Cơ quan Giải quyết Tranh chấp (DSB) là cơ quan ra quyết định, nhưng ở bốn bước quan trọng (lập ban hội thẩm, thông qua báo cáo ban hội thẩm, thông qua báo cáo phúc thẩm, cho phép trả đũa) DSB mặc nhiên thông qua trừ khi toàn thể đồng thuận bác bỏ. Gọi là đồng thuận ngược.", "Marrakesh Điều IX:1, IX:2, IX:3; DSU Điều 2:4, Điều 6:1, Điều 16:4, Điều 17:14, Điều 22:6", "QUY_DINH_RO_DOI_CHIEU_BAN_DICH_DRIVE_DIEN_GIAI", "https://drive.google.com/file/d/1ZvH0_KdKGC1u_p8PFJIogjHLyXSgWhd_/view", "", "", "DE_XUAT_CHUA_DUYET"], ["DSU-03A", "3_SO_DO", "Ma trận cơ cấu WTO", "Sáu cơ quan, mỗi cơ quan ai tham gia, làm gì, họp thế nào.", "Marrakesh Điều IV, VI", "QUY_DINH_RO_DOI_CHIEU_BAN_DICH_DRIVE_DIEN_GIAI", "", "MA_TRAN", "{\"cols\":[\"Ai tham gia\",\"Làm gì\",\"Họp khi nào\"],\"rows\":[{\"label\":\"Hội nghị Bộ trưởng\",\"cells\":[\"Đại diện tất cả thành viên\",\"Thực hiện chức năng của WTO; có quyền quyết định mọi vấn đề thuộc hiệp định thương mại đa biên khi có thành viên yêu cầu\",\"Hai năm một lần\"]},{\"label\":\"Đại Hội đồng\",\"cells\":[\"Đại diện tất cả thành viên\",\"Làm thay Hội nghị Bộ trưởng giữa hai kỳ họp; cũng họp với tư cách DSB và Cơ quan Rà soát Chính sách Thương mại\",\"Khi cần thiết\"]},{\"label\":\"Cơ quan Giải quyết Tranh chấp (DSB)\",\"cells\":[\"Chính là Đại Hội đồng khi triệu tập làm DSB; có thể có chủ tịch riêng\",\"Lập ban hội thẩm, thông qua báo cáo, giám sát thực thi, cho phép trả đũa\",\"Khi cần thiết, theo các thời hạn của DSU\"]},{\"label\":\"Ba Hội đồng chuyên ngành\",\"cells\":[\"Đại diện các thành viên: Hội đồng Thương mại Hàng hóa, Dịch vụ, và TRIPS\",\"Giám sát việc thực hiện các hiệp định trong Phụ lục 1A, GATS và TRIPS; hoạt động theo chỉ đạo chung của Đại Hội đồng\",\"Khi cần thiết\"]},{\"label\":\"Các Ủy ban\",\"cells\":[\"Do Hội nghị Bộ trưởng lập: Thương mại và Phát triển; Cán cân Thanh toán; Ngân sách, Tài chính và Quản trị\",\"Làm các chức năng ghi trong hiệp định và việc Đại Hội đồng giao\",\"Khi cần thiết\"]},{\"label\":\"Ban Thư ký\",\"cells\":[\"Do một Tổng Giám đốc lãnh đạo\",\"Hỗ trợ hành chính và kỹ thuật; giữ danh sách hội thẩm viên và đề xuất thành viên ban hội thẩm\",\"Thường trực\"]}]}", "DE_XUAT_CHUA_DUYET"], ["DSU-03B", "3_SO_DO", "Cây quyết định: quyết định này cần bao nhiêu phiếu", "Đi từ trên xuống để biết một quyết định ở Hội nghị Bộ trưởng hoặc Đại Hội đồng được thông qua bằng cách nào.", "Marrakesh Điều IX:1 đến IX:3", "QUY_DINH_RO_DOI_CHIEU_BAN_DICH_DRIVE_DIEN_GIAI; PHAN_SUA_DOI_DIEU_X_CHUA_DOC_DAY_DU", "", "CAY_QUYET_DINH", "{\"start\":\"q1\",\"nodes\":[{\"id\":\"q1\",\"cspl\":\"Điều IX:1\",\"text\":\"Không thành viên nào có mặt tại phiên họp chính thức phản đối quyết định dự kiến? (Đây là cách hiểu về đồng thuận trong chú thích của Điều IX.)\",\"yes\":\"e1\",\"no\":\"q2\"},{\"id\":\"q2\",\"cspl\":\"Điều IX:2\",\"text\":\"Quyết định là thông qua một giải thích chính thức của Hiệp định WTO hoặc hiệp định thương mại đa biên?\",\"yes\":\"e2\",\"no\":\"q3\"},{\"id\":\
