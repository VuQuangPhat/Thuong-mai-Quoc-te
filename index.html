function ptimeline(r){
  var spec=null;try{spec=JSON.parse(r.data);}catch(e){}

    var n=pcard(r,'sum');
    if(/^https:\/\//.test(r.url)){var a=el('a','','Văn bản gốc ↗');a.href=r.url;a.target='_blank';a.rel='noopener noreferrer';var p=el('p');p.appendChild(a);n.appendChild(p);}
    sd2.appendChild(n);d.appendChild(sd2);

  [[i-1,'Trước'],[i+1,'Tiếp']].forEach(function(p){

    b.addEventListener('click',function(){go(t);});pg.appendChild(b);

function go(id,noScroll){
  if(!S.D||!S.D.meta[id])return;
  S.cur=id;
  try{history.replaceState(null,'','#'+id);}catch(e){}
  var m=S.D.meta[id],bl=S.D.by[id]||[],c=S.D.chap[id];
  if(S.D.pilots[id]){renderPilot(id,m,noScroll);return;}
  var ctx={title:m.title,skipTitle:!!c,outline:[],tables:S.D.tables[id]||[],figs:S.D.figs[id]||[],bangIdx:0,figIdx:0,
    bangCount:bl.filter(function(b){return b.type==='BANG';}).length,figCount:bl.filter(function(b){return b.type==='SO_DO_HINH';}).length};
  var d=$('#doc');d.innerHTML='';
  d.appendChild(el('p','eyebrow',m.grp+(m.disp?' · '+m.disp:'')));
  d.appendChild(el('h1','',m.title));
  var chips=el('div','chips');
  chips.appendChild(el('span','chip warn',c?'Bản thảo · chưa nghiệm thu':'Bản thảo · chưa duyệt'));
  chips.appendChild(el('span','chip',bl.length+' khối'));
  if(ctx.tables.length)chips.appendChild(el('span','chip',ctx.tables.length+' bảng'));
  if(ctx.figs.length)chips.appendChild(el('span','chip',ctx.figs.length+' sơ đồ'));
  chips.appendChild(el('span','chip',S.mode==='proposal'?'Bản đề xuất':'Bản gốc V11'));
  d.appendChild(chips);
  if(c&&(c.note||c.ed)){
    var bn=el('details','banner'),sm=el('summary','','Tình trạng kiểm định chương này');bn.appendChild(sm);
    if(c.ed)bn.appendChild(el('p','','Biên tập: '+c.ed.replace(/_/g,' ').toLowerCase()));
    if(c.note)bn.appendChild(el('p','',c.note));
    d.appendChild(bn);
  }
  var hero=ctx.figs[0]||null;ctx.heroId=hero?hero.id:null;
  if(hero)d.appendChild(figureCard(hero,'Sơ đồ chính của chương'));

  var body=document.createDocumentFragment();

  if(ctx.outline.length>=3){
    var ol=el('nav','outline');ol.setAttribute('aria-label','Trong chương này');ol.appendChild(el('b','','Trong chương này'));

    var b=el('button');b.type='button';b.appendChild(el('small','',p[1]));b.appendChild(el('span','',(S.D.meta[t].disp?S.D.meta[t].disp+' · ':'')+S.D.meta[t].title));
    b.addEventListener('click',function(){go(t);});pg.appendChild(b);
  });
  d.appendChild(pg);
  markNav();
  if(!noScroll)window.scrollTo(0,0);

/* ---------- Tìm kiếm ---------- */
var idx=null;
function search(q){
  q=q.trim();
  if(q.length<2){if(S.cur)go(S.cur,true);return;}
  if(!idx)idx=S.D.blocks.map(function(b){var t=(b.title+' '+b.f+' '+b.w);return {b:b,t:t,n:norm(t)};});
  var nq=norm(q),res=[];
  for(var i=0;i<idx.length&&res.length<40;i++){var p=idx[i].n.indexOf(nq);if(p>=0)res.push({b:idx[i].b,t:idx[i].t,p:p});}
  var d=$('#doc');d.innerHTML='';
  d.appendChild(el('p','eyebrow','Kết quả tìm kiếm'));
  d.appendChild(el('h1','',res.length?res.length+(res.length>=40?'+':'')+' kết quả cho “'+q+'”':'Không thấy “'+q+'”'));
  res.forEach(function(r){
    var m=S.D.meta[r.b.ch],bt=el('button','hit');bt.type='button';
    bt.appendChild(el('b','',m?((m.disp?m.disp+' · ':'')+m.title):r.b.ch));
    var sn=el('span'),s0=Math.max(0,r.p-50),seg=r.t.slice(s0,s0+190);
    var np=norm(seg).indexOf(nq);
    if(np>=0&&norm(seg).length===seg.length){sn.appendChild(document.createTextNode((s0>0?'… ':'')+seg.slice(0,np)));var mk=el('mark','',seg.slice(np,np+nq.length));sn.appendChild(mk);sn.appendChild(document.createTextNode(seg.slice(np+nq.length)+' …'));}
    else sn.textContent=(s0>0?'… ':'')+seg+' …';
    bt.appendChild(sn);
    bt.addEventListener('click',function(){
      closeNav();go(r.b.ch,true);
      setTimeout(function(){var t=document.getElementById('b-'+r.b.id)||document.getElementById('h-'+r.b.id);if(t)t.scrollIntoView({block:'center'});},30);
    });
    d.appendChild(bt);
  });
  window.scrollTo(0,0);
}

function syncPanel(){
  $('#mProp').setAttribute('aria-pressed',S.mode==='proposal');$('#mOrig').setAttribute('aria-pressed',S.mode==='original');
  $('#fOn').setAttribute('aria-pressed',S.flags);$('#fOn').textContent=S.flags?'Đang bật':'Bật';
}

applyZoom();syncPanel();load(false);
})();
