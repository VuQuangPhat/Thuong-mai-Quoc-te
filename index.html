"q3\",\"cspl\":\"Điều IX:3\",\"text\":\"Quyết định là miễn trừ nghĩa vụ cho một thành viên trong trường hợp ngoại lệ?\",\"yes\":\"e3\",\"no\":\"e4\"}],\"ends\":[{\"id\":\"e1\",\"text\":\"Thông qua bằng đồng thuận.\"},{\"id\":\"e2\",\"text\":\"Cần 3/4 số thành viên. Với hiệp định trong Phụ lục 1, phải có đề xuất của Hội đồng giám sát hiệp định đó.\"},{\"id\":\"e3\",\"text\":\"Cần 3/4 số thành viên. Yêu cầu miễn trừ được xem xét trong thời hạn không quá 90 ngày. Miễn trừ quá một năm phải rà soát hằng năm.\"},{\"id\":\"e4\",\"text\":\"Bỏ phiếu, mỗi thành viên một phiếu, theo đa số phiếu, trừ khi hiệp định liên quan quy định khác.\"}]}", "DE_XUAT_CHUA_DUYET"], ["DSU-03C", "3_SO_DO", "Dòng thời gian một vụ tranh chấp", "Chín mốc trên một trục, kèm thời hạn tối đa giữa các mốc. Đây là hình quan trọng nhất của chủ đề này.", "DSU Điều 4, 6, 12, 16, 17, 20, 21, 22", "QUY_DINH_RO_DOI_CHIEU_BAN_DICH_DRIVE_DIEN_GIAI", "", "DONG_THOI_GIAN", "{\"events\":[{\"id\":\"t1\",\"label\":\"Nguyên đơn yêu cầu tham vấn\"},{\"id\":\"t2\",\"label\":\"Sau 60 ngày tham vấn không giải quyết được: được yêu cầu lập ban hội thẩm (Điều 4:7)\"},{\"id\":\"t3\",\"label\":\"DSB lập ban hội thẩm (chậm nhất ở cuộc họp thứ hai, Điều 6:1)\"},{\"id\":\"t4\",\"label\":\"Ban hội thẩm gửi báo cáo cuối cùng cho các thành viên\"},{\"id\":\"t5\",\"label\":\"DSB thông qua báo cáo, hoặc một bên kháng cáo (Điều 16:4)\"},{\"id\":\"t6\",\"label\":\"Cơ quan Phúc thẩm gửi báo cáo\"},{\"id\":\"t7\",\"label\":\"DSB thông qua báo cáo phúc thẩm (Điều 17:14)\"},{\"id\":\"t8\",\"label\":\"Hết thời gian hợp lý để thực thi (Điều 21:3)\"},{\"id\":\"t9\",\"label\":\"DSB cho phép tạm hoãn nhượng bộ, tức trả đũa (Điều 22:6)\"}],\"spans\":[{\"from\":\"t1\",\"to\":\"t2\",\"label\":\"Bị đơn trả lời trong 10 ngày, tham vấn trong 30 ngày. Nếu bị đơn không làm vậy, nguyên đơn được yêu cầu lập ban hội thẩm ngay. Việc khẩn cấp: 10 ngày tham vấn, 20 ngày thì được yêu cầu (Điều 4:3, 4:8)\"},{\"from\":\"t2\",\"to\":\"t3\",\"label\":\"Chỉ bị chặn nếu toàn thể DSB đồng thuận không lập (Điều 6:1)\"},{\"from\":\"t3\",\"to\":\"t4\",\"label\":\"Theo nguyên tắc không quá 6 tháng, khẩn cấp 3 tháng, tuyệt đối không quá 9 tháng kể từ khi lập (Điều 12:8, 12:9)\"},{\"from\":\"t4\",\"to\":\"t5\",\"label\":\"Không được xem xét thông qua trước 20 ngày; phải thông qua trong 60 ngày trừ khi kháng cáo hoặc đồng thuận không thông qua (Điều 16:1, 16:4)\"},{\"from\":\"t5\",\"to\":\"t6\",\"label\":\"Nguyên tắc 60 ngày, tối đa 90 ngày kể từ lúc thông báo kháng cáo. Chỉ xét vấn đề pháp lý (Điều 17:5, 17:6)\"},{\"from\":\"t6\",\"to\":\"t7\",\"label\":\"Tự động thông qua và các bên chấp nhận vô điều kiện, trừ khi đồng thuận không thông qua trong 30 ngày (Điều 17:14)\"},{\"from\":\"t7\",\"to\":\"t8\",\"label\":\"Thời gian hợp lý do DSB chấp thuận đề xuất của bên bị kiện, hoặc các bên thỏa thuận trong 45 ngày, hoặc trọng tài quyết trong 90 ngày. Gợi ý của Điều 21:3(c) là không quá 15 tháng kể từ ngày thông qua báo cáo\"},{\"from\":\"t8\",\"to\":\"t9\",\"label\":\"Nếu không đàm phán được bồi thường trong 20 ngày, nguyên đơn xin trả đũa. DSB cho phép trong 30 ngày kể từ hết thời gian hợp lý, trừ khi đồng thuận từ chối (Điều 22:2, 22:6)\"}]}", "DE_XUAT_CHUA_DUYET"], ["DSU-03D", "3_SO_DO", "Cây quyết định: thực thi và trả đũa", "Sau khi báo cáo được thông qua, bên thua phải làm gì và bên thắng làm được gì, theo thứ tự ưu tiên.", "DSU Điều 3:7, 21, 22", "QUY_DINH_RO_DOI_CHIEU_BAN_DICH_DRIVE_DIEN_GIAI", "", "CAY_QUYET_DINH", "{\"start\":\"q1\",\"nodes\":[{\"id\":\"q1\",\"cspl\":\"Điều 21:1, 21:3\",\"text\":\"Bên thua có thể thực thi ngay các khuyến nghị và phán quyết?\",\"yes\":\"e1\",\"no\":\"q2\"},{\"id\":\"q2\",\"cspl\":\"Điều 21:3\",\"text\":\"Bên thua thực thi xong trong thời gian hợp lý đã xác định?\",\"yes\":\"e1\",\"no\":\"q3\"},{\"id\":\"q3\",\"cspl\":\"Điều 22:2\",\"text\":\"Hai bên thỏa thuận được bồi thường trong 20 ngày sau khi hết thời gian hợp lý?\",\"yes\":\"e2\",\"no\":\"q4\"},{\"id\":\"q4\",\"cspl\":\"Điều 22:3, 22:6\",\"text\":\"Bên thua phản đối mức trả đũa đề xuất, hoặc nói bên thắng chưa theo đúng nguyên tắc chọn lĩnh vực?\",\"yes\":\"e3\",\"no\":\"e4\"}],\"ends\":[{\"id\":\"e1\",\"text\":\"Tranh chấp được giải quyết bằng thực thi. Đây là mục tiêu số một (Điều 3:7). Trả đũa không phải là biện pháp ưu tiên.\"},{\"id\":\"e2\",\"text\":\"Bồi thường. Việc này là tự nguyện và phải phù hợp với hiệp định liên quan (Điều 22:1).\"},{\"id\":\"e3\",\"text\":\"Chuyển sang trọng tài, xong trong 60 ngày kể từ khi hết thời gian hợp lý. Trọng tài chỉ xét mức trả đũa có tương ứng với mức thiệt hại không và nguyên tắc đã được theo chưa. Quyết định chung thẩm (Điều 22:6, 22:7).\"},{\"id\":\"e4\",\"text\":\"DSB cho phép tạm hoãn nhượng bộ trong 30 ngày kể từ hết thời gian hợp lý, trừ khi đồng thuận từ chối. Mức trả đũa phải tương ứng với mức thiệt hại, và chỉ tạm thời (Điều 22:4, 22:6, 22:8).\"}]}", "DE_XUAT_CHUA_DUYET"], ["DSU-03E", "3_SO_DO", "Ma trận: bốn lần DSB ra quyết định theo đồng thuận ngược", "Bốn lần DSB ra quyết định, mỗi lần mặc định là thông qua và chỉ bị chặn khi toàn thể đồng thuận bác bỏ. Hình này giúp tránh nhầm với đồng thuận thông thường.", "DSU Điều 2:4, 6:1, 16:4, 17:14, 22:6", "QUY_DINH_RO_DOI_CHIEU_BAN_DICH_DRIVE_DIEN_GIAI", "", "MA_TRAN", "{\"cols\":[\"Căn cứ\",\"Mặc định\",\"Cách để chặn\"],\"rows\":[{\"label\":\"Lập ban hội thẩm\",\"cells\":[\"Điều 6:1\",\"Được lập, chậm nhất ở cuộc họp thứ hai nơi có yêu cầu\",\"Toàn thể đồng thuận không lập (gồm cả nguyên đơn, nên gần như không xảy ra)\"]},{\"label\":\"Thông qua báo cáo ban hội thẩm\",\"cells\":[\"Điều 16:4\",\"Được thông qua trong 60 ngày\",\"Một bên kháng cáo, hoặc toàn thể đồng thuận không thông qua\"]},{\"label\":\"Thông qua báo cáo phúc thẩm\",\"cells\":[\"Điều 17:14\",\"Được thông qua, các bên chấp nhận vô điều kiện\",\"Toàn thể đồng thuận không thông qua trong 30 ngày\"]},{\"label\":\"Cho phép trả đũa\",\"cells\":[\"Điều 22:6\",\"Được cho phép trong 30 ngày kể từ hết thời gian hợp lý\",\"Toàn thể đồng thuận từ chối; hoặc chuyển trọng tài nếu bên thua phản đối mức trả đũa\"]}]}", "DE_XUAT_CHUA_DUYET"], ["DSU-04A", "4_VI_DU", "Ví dụ 1: bị đơn im lặng", "Nước X gửi yêu cầu tham vấn về biện pháp của nước Y ngày 1/3. Đến ngày 12/3 Y vẫn không trả lời. Bước 1: Y phải trả lời trong 10 ngày và tham vấn trong không quá 30 ngày (Điều 4:3). Bước 2: Y không trả lời trong 10 ngày, nên X có thể yêu cầu lập ban hội thẩm ngay mà không phải chờ đủ 60 ngày. Bước 3: DSB lập ban hội thẩm chậm nhất ở cuộc họp thứ hai, trừ khi toàn thể đồng thuận không lập (Điều 6:1). Tình huống là giả định.", "DSU Điều 4:3, 4:7, 6:1", "QUY_DINH_RO_DOI_CHIEU_BAN_DICH_DRIVE_DIEN_GIAI", "", "", "", "DE_XUAT_CHUA_DUYET"], ["DSU-04B", "4_VI_DU", "Ví dụ 2: bên thua kháng cáo", "Ban hội thẩm gửi báo cáo cho các thành viên ngày 1/6, kết luận biện pháp của Y trái quy định. Nếu không ai kháng cáo: DSB không được xem xét trong 20 ngày đầu, và báo cáo được thông qua trong 60 ngày, tức chậm nhất khoảng 31/7 (Điều 16:1, 16:4). Nếu Y thông báo kháng cáo: DSB không xem xét thông qua báo cáo ban hội thẩm cho đến khi phúc thẩm xong. Cơ quan Phúc thẩm thường không quá 60 ngày, tối đa 90 ngày (Điều 17:5). Sau đó báo cáo phúc thẩm mặc nhiên được thông qua trừ khi đồng thuận không thông qua trong 30 ngày (Điều 17:14). Tính từ lúc lập ban hội thẩm đến lúc DSB xem xét thông qua, thông thường không quá 9 tháng nếu không kháng cáo, 12 tháng nếu có kháng cáo (Điều 20). Tình huống là giả định, ngày tháng chỉ để minh họa.", "DSU Điều 16:1, 16:4, 17:5, 17:14, 20", "QUY_DINH_RO_DOI_CHIEU_BAN_DICH_DRIVE_DIEN_GIAI", "", "", "", "DE_XUAT_CHUA_DUYET"], ["DSU-04C", "4_VI_DU", "Ví dụ 3: Y thất bại và không sửa", "Báo cáo được thông qua ngày 1/9. Trong 30 ngày Y phải thông báo cho DSB dự định thực thi (Điều 21:3). Hai bên thỏa thuận thời gian hợp lý là 10 tháng. Hết hạn Y vẫn giữ biện pháp. X có thể đàm phán bồi thường; sau 20 ngày không được thì xin DSB cho phép trả đũa (Điều 22:2). DSB cho phép trong 30 ngày trừ khi đồng thuận từ chối. X phải ưu tiên trả đũa trong cùng lĩnh vực bị vi phạm; với hàng hóa thì tất cả hàng hóa là một lĩnh vực (Điều 22:3(a), 22:3(f)). Nếu muốn trả đũa sang dịch vụ hoặc sở hữu trí tuệ, X phải nêu lý do và chỉ được khi thấy cách thông thường không thực tế hoặc không hiệu quả (Điều 22:3(b), (c), (e)). Mức trả đũa phải tương ứng với mức thiệt hại (Điều 22:4). Tình huống là giả định.", "DSU Điều 21:3, 22:2, 22:3, 22:4, 22:6", "QUY_DINH_RO_DOI_CHIEU_BAN_DICH_DRIVE_DIEN_GIAI", "", "", "", "DE_XUAT_CHUA_DUYET"], ["DSU-05A", "5_BAY", "Bẫy 1: đồng thuận ngược khác đồng thuận", "Đề hay hỏi “quyết định của DSB cần đồng thuận”. Đúng là DSU Điều 2:4 nói DSB quyết định bằng đồng thuận, nhưng ở lập ban hội thẩm, thông qua báo cáo và cho phép trả đũa, điều khoản nói rõ DSB làm theo mặc định trừ khi đồng thuận không làm. Quan trọng là đọc đúng chiều của cụm từ. Nguyên đơn thắng có phiếu của chính mình, nên bên thua không thể tự chặn.", "DSU Điều 2:4, 6:1, 16:4, 17:14, 22:6", "QUY_DINH_RO_DOI_CHIEU_BAN_DICH_DRIVE_DIEN_GIAI", "", "", "", "DE_XUAT_CHUA_DUYET"], ["DSU-05B", "5_BAY", "Bẫy 2: ai được kháng cáo, kháng cáo về gì", "Chỉ các bên tranh chấp mới được kháng cáo. Bên thứ ba đã thông báo lợi ích chỉ được nộp văn bản và được nghe. Kháng cáo chỉ về vấn đề pháp lý và giải thích pháp luật của ban hội thẩm, không cãi lại dữ kiện. Cơ quan Phúc thẩm có thể giữ nguyên, sửa đổi hoặc đảo ngược kết luận của ban hội thẩm.", "DSU Điều 17:4, 17:6, 17:13", "QUY_DINH_RO_DOI_CHIEU_BAN_DICH_DRIVE_DIEN_GIAI", "", "", "", "DE_XUAT_CHUA_DUYET"], ["DSU-05C", "5_BAY", "Bẫy 3: trả đũa không phải bước đầu, và không tự làm", "Mục tiêu số một là bên vi phạm rút biện pháp. Bồi thường và trả đũa chỉ là biện pháp tạm thời, không ưu tiên hơn việc thực thi đầy đủ. Bên thắng không được tự kết luận rồi trả đũa, mà phải dùng cơ chế DSU và xin phép DSB trước. Trả đũa phải tương ứng mức thiệt hại và chỉ tạm thời.", "DSU Điều 3:7, 22:1, 22:4, 22:8, 23:1, 23:2", "QUY_DINH_RO_DOI_CHIEU_BAN_DICH_DRIVE_DIEN_GIAI", "", "", "", "DE_XUAT_CHUA_DUYET"], ["DSU-05D", "5_BAY", "Bẫy 4: thời hạn là “theo quy tắc chung”", "Nhiều thời hạn có chữ “theo quy định chung”, “nguyên tắc” hoặc “tối đa” và có thể kéo dài: ban hội thẩm 6 tháng nhưng tuyệt đối không quá 9 tháng kể từ khi lập; phúc thẩm 60 ngày, tối đa 90 ngày; thời gian hợp lý 15 tháng chỉ là gợi ý cho trọng tài viên, có thể dài hoặc ngắn hơn. Ban hội thẩm có thể tạm ngừng theo yêu cầu nguyên đơn tối đa 12 tháng; quá 12 tháng thì thẩm quyền lập ban hội thẩm hết hiệu lực (Điều 12:12). Khi trả lời, cần phân biệt con số nào là mức mặc định, con số nào là trần.", "DSU Điều 12:8, 12:9, 12:12, 17:5, 21:3(c)", "QUY_DINH_RO_DOI_CHIEU_BAN_DICH_DRIVE_DIEN_GIAI", "", "", "", "DE_XUAT_CHUA_DUYET"], ["DSU-05E", "5_BAY", "Bẫy 5: tình trạng thực tế của Cơ quan Phúc thẩm", "Văn bản DSU nói Cơ quan Phúc thẩm gồm 7 người, nhiệm kỳ 4 năm, được tái bổ nhiệm một lần, mỗi vụ do 3 người xét xử (Điều 17:1, 17:2). Đây là quy định trên giấy. Việc hiện nay cơ quan này có đang hoạt động đủ thành viên hay không, và nếu kháng cáo mà không có người xét thì báo cáo ban hội thẩm đi về đâu: CHƯA XÁC MINH trong Sheet này. Cần tra nguồn WTO hiện hành và giáo trình của giảng viên trước khi trả lời đề thi theo thực tiễn.", "DSU Điều 17:1, 17:2", "CHUA_XAC_MINH", "", "", "", "DE_XUAT_CHUA_DUYET"], ["DSU-06-DSU", "6_BANG_TRA", "Bảng tra: các thời hạn của DSU", "Tham vấn: trả lời 10 ngày, tham vấn trong 30 ngày, chờ 60 ngày mới được yêu cầu lập ban hội thẩm (khẩn cấp: 10 ngày và 20 ngày). Ban hội thẩm: 3 người; chọn người trong 20 ngày thì tổng giám đốc bổ nhiệm; xem xét 6 tháng (khẩn cấp 3 tháng), tối đa 9 tháng. DSB xem xét báo cáo: sau 20 ngày, thông qua trong 60 ngày. Phúc thẩm: 60 ngày, tối đa 90 ngày; DSB thông qua trong 30 ngày. Tổng từ lúc lập ban hội thẩm đến lúc DSB xem xét thông qua: 9 tháng (không kháng cáo) hoặc 12 tháng (kháng cáo). Thực thi: thông báo dự định trong 30 ngày; thời gian hợp lý thỏa thuận trong 45 ngày hoặc trọng tài trong 90 ngày; ban hội thẩm kiểm tra thực thi 90 ngày. Trả đũa: đàm phán bồi thường 20 ngày; DSB cho phép trong 30 ngày; trọng tài mức trả đũa 60 ngày.", "DSU Điều 4, 8, 12, 16, 17, 20, 21, 22", "QUY_DINH_RO_DOI_CHIEU_BAN_DICH_DRIVE_DIEN_GIAI", "", "", "", "DE_XUAT_CHUA_DUYET"], ["DSU-06-IX", "6_BANG_TRA", "Bảng tra: ngưỡng biểu quyết", "Đồng thuận: không thành viên có mặt nào phản đối chính thức. Quyết định thông thường ở Hội nghị Bộ trưởng và Đại Hội đồng khi không đạt đồng thuận: đa số phiếu. Giải thích chính thức hiệp định: 3/4 số thành viên. Miễn trừ nghĩa vụ: 3/4 số thành viên, xem xét trong không quá 90 ngày; nếu quá một năm thì rà soát hằng năm. Sửa đổi (Điều 10): trước hết bàn bằng đồng thuận trong 90 ngày; nếu không được thì 2/3 số thành viên quyết định có trình sửa đổi cho các thành viên thông qua hay không; một số sửa đổi chỉ có hiệu lực khi tất cả thành viên chấp nhận. Phần Điều X chưa đọc đầy đủ phần điều khoản nào cần tất cả chấp nhận.", "Marrakesh Điều IX:1, IX:2, IX:3, IX:4, X:1, X:2", "QUY_DINH_RO_DOI_CHIEU_BAN_DICH_DRIVE_DIEN_GIAI; PHAN_SUA_DOI_DIEU_X_CHUA_DOC_DAY_DU", "", "", "", "DE_XUAT_CHUA_DUYET"], ["DSU-07", "7_GHI_CHU_NGUON", "Ghi chú nguồn và giới hạn đối chiếu", "Nguồn: file “Vbqppl LUẬT THƯƠNG MẠI QUỐC TẾ.pdf” trong Drive của anh, gồm bản dịch tiếng Việt Hiệp định Marrakesh và DSU. Đãy là bản dịch, không phải văn bản tiếng Anh chính thức, và có một vài lỗi chính tả. Đã đối chiếu: Marrakesh Điều IV, IX, phần đầu Điều X; DSU từ Điều 1 đến Điều 23:2. Điều IX cũng đã đối chiếu bằng bản sao Analytical Index của WTO, khớp. Chưa đối chiếu: bản tiếng Anh chính thức của WTO; phần sau của Điều X, Điều XII (gia nhập), Điều 24 đến 27 của DSU, các phụ lục của DSU (thủ tục làm việc của ban hội thẩm, nhóm chuyên gia); các báo cáo vụ việc; tình trạng hoạt động hiện hành của Cơ quan Phúc thẩm; các đề xuất cải cách. Các ví dụ là tình huống giả định. Toàn bộ cần anh duyệt.", "", "CHUA_XAC_MINH", "https://drive.google.com/file/d/1ZvH0_KdKGC1u_p8PFJIogjHLyXSgWhd_/view", "", "", "DE_XUAT_CHUA_DUYET"]], "SOAN_THU_20261026_CISG_PHAM_VI": [["CPV-00", "0_PHAM_VI", "Chủ đề và điều kiện đứng trước", "Chủ đề: CISG áp dụng cho giao dịch nào, loại trừ nào, và khi nào được miễn trách nhiệm. Chương nguồn trong Sheet: II.4 và II.5. Đây là bài đứng trước bài hình thành hợp đồng: phải biết CISG có áp dụng thì mới dùng các quy tắc chào hàng, chấp nhận. Bài chỉ bàn Điều 1 đến 6, Điều 10, Điều 79, Điều 80 và Điều 96 theo bản Công ước đăng trong Treaty Series của Liên Hợp Quốc.", "CISG Điều 1 đến 6, 10, 79, 80, 96", "QUY_DINH_RO_DOI_CHIEU_UNTS_DIEN_GIAI", "https://treaties.un.org/doc/Publication/UNTS/Volume%201489/volume-1489-I-25567-English.pdf", "", "", "DE_XUAT_CHUA_DUYET"], ["CPV-01", "1_CAU_HOI", "Câu hỏi đời thường", "Công ty A ở Việt Nam bán thép cho công ty B ở Hàn Quốc, hợp đồng không ghi luật nào điều chỉnh. Khi tranh chấp xảy ra, luật nào áp dụng? Và nếu một cơn bão làm A không giao được hàng, A có phải bồi thường cho B không?", "", "QUAN_DIEM_GIANG_DAY", "", "", "", "DE_XUAT_CHUA_DUYET"], ["CPV-02", "2_QUY_TAC", "Quy tắc một câu", "CISG tự áp dụng cho hợp đồng mua bán hàng hóa giữa hai bên có trụ sở ở hai nước khác nhau, khi cả hai nước là thành viên hoặc luật tư pháp quốc tế dẫn tới luật của một nước thành viên; trừ những loại giao dịch bị loại ra, và trừ khi hai bên thỏa thuận loại trừ. Trong phạm vi đó, bên không thực hiện chỉ được miễn bồi thường thiệt hại khi có trở ngại ngoài tầm kiểm soát mà người ta không thể lường trước hay tránh được một cách hợp lý.", "CISG Điều 1(1), 2, 3, 6, 79(1)", "QUY_DINH_RO_DOI_CHIEU_UNTS_DIEN_GIAI", "https://treaties.un.org/doc/Publication/UNTS/Volume%201489/volume-1489-I-25567-English.pdf", "", "", "DE_XUAT_CHUA_DUYET"], ["CPV-03A", "3_SO_DO", "Cây quyết định: CISG có áp dụng không", "Đi theo năm câu hỏi theo thứ tự. Mỗi câu có hai lối rẽ, dẫn tới kết luận.", "CISG Điều 1 đến 6, 95", "QUY_DINH_RO_DOI_CHIEU_UNTS_DIEN_GIAI", "", "CAY_QUYET_DINH", "{\"start\":\"q1\",\"nodes\":[{\"id\":\"q1\",\"cspl\":\"Điều 1(1), 1(3)\",\"text\":\"Hai bên có trụ sở kinh doanh ở hai quốc gia khác nhau? (quốc tịch và việc bên nào là thương nhân hay không đều không được xét)\",\"yes\":\"q2\",\"no\":\"e1\"},{\"id\":\"q2\",\"cspl\":\"Điều 1(1)(a), 1(1)(b), 95\",\"text\":\"Cả hai nước đều là thành viên CISG, hoặc quy tắc tư pháp quốc tế dẫn tới luật của một nước thành viên? (một nước có thể đã tuyên bố không bị ràng buộc bởi Điều 1(1)(b))\",\"yes\":\"q3\",\"no\":\"e2\"},{\"id\":\"q3\",\"cspl\":\"Điều 2, 5\",\"text\":\"Giao dịch thuộc nhóm bị loại ra: hàng mua cho cá nhân, gia đình hay nội trợ (mà bên bán biết hoặc lẽ ra phải biết), bán đấu giá, bán theo thi hành án hay thẩm quyền pháp luật, chứng khoán, giấy tờ có giá, tiền, tàu thủy, tàu đệm khí, tàu bay, điện?\",\"yes\":\"e3\",\"no\":\"q4\"},{\"id\":\"q4\",\"cspl\":\"Điều 3\",\"text\":\"Phần lớn nghĩa vụ của bên cung cấp hàng là lao động hay dịch vụ khác, hoặc bên đặt hàng tự cung cấp phần quan trọng nguyên liệu để sản xuất?\",\"yes\":\"e4\",\"no\":\"q5\"},{\"id\":\"q5\",\"cspl\":\"Điều 6\",\"text\":\"Hai bên đã thỏa thuận loại trừ CISG?\",\"yes\":\"e5\",\"no\":\"e6\"}],\"ends\":[{\"id\":\"e1\",\"text\":\"Không thuộc phạm vi CISG. Đây là giao dịch trong nước theo luật quốc gia.\"},{\"id\":\"e2\",\"text\":\"CISG chưa áp dụng. Xét lại quy tắc tư pháp quốc tế và các tuyên bố của từng nước.\"},{\"id\":\"e3\",\"text\":\"CISG không áp dụng cho giao dịch này.\"},{\"id\":\"e4\",\"text\":\"Hợp đồng không được coi là mua bán theo CISG nên Công ước không áp dụng.\"},{\"id\":\"e5\",\"text\":\"CISG bị loại trừ. Luật khác do hai bên chọn hoặc luật được dẫn tới sẽ áp dụng.\"},{\"id\":\"e6\",\"text\":\"CISG áp dụng. Dùng các quy tắc về hình thành hợp đồng, quyền và nghĩa vụ của hai bên.\"}]}", "DE_XUAT_CHUA_DUYET"], ["CPV-03B", "3_SO_DO", "Ma trận: những loại bị loại ra khỏi CISG", "Mỗi dòng là một loại giao dịch hoặc vấn đề nằm ngoài CISG, kèm căn cứ và điều kiện còn lại.", "CISG Điều 2, 3, 5", "QUY_DINH_RO_DOI_CHIEU_UNTS_DIEN_GIAI", "", "MA_TRAN", "{\"cols\":[\"Căn cứ\",\"Điều kiện hoặc ngoại lệ\"],\"rows\":[{\"label\":\"Hàng mua cho cá nhân, gia đình, nội trợ\",\"cells\":[\"Điều 2(a)\",\"Vẫn thuộc CISG nếu bên bán không biết và không thể biết mục đích đó vào lúc ký hoặc trước khi ký\"]},{\"label\":\"Bán đấu giá\",\"cells\":[\"Điều 2(b)\",\"Không có ngoại lệ trong điều khoản\"]},{\"label\":\"Bán theo thi hành án hoặc thẩm quyền pháp luật\",\"cells\":[\"Điều 2(c)\",\"Không có ngoại lệ trong điều khoản\"]},{\"label\":\"Chứng khoán, giấy tờ có giá, tiền\",\"cells\":[\"Điều 2(d)\",\"Không có ngoại lệ trong điều khoản\"]},{\"label\":\"Tàu thủy, tàu đệm khí, tàu bay\",\"cells\":[\"Điều 2(e)\",\"Không có ngoại lệ trong điều khoản\"]},{\"label\":\"Điện\",\"cells\":[\"Điều 2(f)\",\"Không có ngoại lệ trong điều khoản\"]},{\"label\":\"Hợp đồng chủ yếu là lao động hoặc dịch vụ\",\"cells\":[\"Điều 3(2)\",\"Hợp đồng cung cấp hàng sẽ sản xuất vẫn là mua bán, trừ khi bên đặt hàng cung cấp phần quan trọng nguyên liệu (Điều 3(1))\"]},{\"label\":\"Trách nhiệm về chết hoặc thương tích do hàng gây ra\",\"cells\":[\"Điều 5\",\"Công ước không điều chỉnh vấn đề này\"]}]}", "DE_XUAT_CHUA_DUYET"], ["CPV-03C", "3_SO_DO", "Cây quyết định: có được miễn trách nhiệm không", "Năm câu hỏi theo Điều 79. Câu nào trả lời Không thì bên không thực hiện không được miễn.", "CISG Điều 79", "QUY_DINH_RO_DOI_CHIEU_UNTS_DIEN_GIAI", "", "CAY_QUYET_DINH", "{\"start\":\"q1\",\"nodes\":[{\"id\":\"q1\",\"cspl\":\"Điều 79(1)\",\"text\":\"Việc không thực hiện là do một trở ngại ngoài tầm kiểm soát của bên đó?\",\"yes\":\"q2\",\"no\":\"e1\"},{\"id\":\"q2\",\"cspl\":\"Điều 79(1)\",\"text\":\"Lúc ký hợp đồng, người ta không thể mong đợi một cách hợp lý bên đó đã tính đến trở ngại?\",\"yes\":\"q3\",\"no\":\"e1\"},{\"id\":\"q3\",\"cspl\":\"Điều 79(1)\",\"text\":\"Người ta không thể mong đợi một cách hợp lý bên đó tránh hay vượt qua được trở ngại hoặc hậu quả của nó?\",\"yes\":\"q4\",\"no\":\"e1\"},{\"id\":\"q4\",\"cspl\":\"Điều 79(2)\",\"text\":\"Nếu bên đó dùng người thứ ba để thực hiện một phần hay toàn bộ hợp đồng: người thứ ba cũng đủ điều kiện được miễn? (nếu không dùng người thứ ba, chọn Có)\",\"yes\":\"q5\",\"no\":\"e1\"},{\"id\":\"q5\",\"cspl\":\"Điều 79(4)\",\"text\":\"Bên kia nhận được thông báo về trở ngại và ảnh hưởng của nó trong thời hạn hợp lý kể từ lúc bên đó biết hoặc lẽ ra phải biết?\",\"yes\":\"e2\",\"no\":\"e3\"}],\"ends\":[{\"id\":\"e1\",\"text\":\"Không được miễn. Bên không thực hiện chịu trách nhiệm bồi thường thiệt hại.\"},{\"id\":\"e2\",\"text\":\"Được miễn bồi thường thiệt hại trong thời gian trở ngại còn tồn tại (Điều 79(3)). Các biện pháp khác ngoài bồi thường thiệt hại vẫn thuộc về bên kia (Điều 79(5)).\"},{\"id\":\"e3\",\"text\":\"Điều kiện miễn có thể vẫn thỏa, nhưng bên đó phải bồi thường thiệt hại do bên kia không nhận được thông báo (Điều 79(4)).\"}]}", "DE_XUAT_CHUA_DUYET"], ["CPV-03D", "3_SO_DO", "Dòng thời gian của một trở ngại", "Năm mốc trên một trục: ký hợp đồng, trở ngại xuất hiện, bên bị ảnh hưởng biết, thông báo đến nơi, trở ngại chấm dứt.", "CISG Điều 79(1), 79(3), 79(4)", "QUY_DINH_RO_DOI_CHIEU_UNTS_DIEN_GIAI", "", "DONG_THOI_GIAN", "{\"events\":[{\"id\":\"t1\",\"label\":\"Ký hợp đồng\"},{\"id\":\"t2\",\"label\":\"Trở ngại xuất hiện\"},{\"id\":\"t3\",\"label\":\"Bên bị ảnh hưởng biết hoặc lẽ ra phải biết\"},{\"id\":\"t4\",\"label\":\"Thông báo đến bên kia\"},{\"id\":\"t5\",\"label\":\"Trở ngại chấm dứt\"}],\"spans\":[{\"from\":\"t1\",\"to\":\"t2\",\"label\":\"Phải chứng minh trở ngại không thể lường trước một cách hợp lý ở thời điểm ký (Điều 79(1))\"},{\"from\":\"t2\",\"to\":\"t3\",\"label\":\"Khoảng chưa biết\"},{\"from\":\"t3\",\"to\":\"t4\",\"label\":\"Thông báo phải đến trong thời hạn hợp lý, nếu không phải bồi thường thiệt hại do không nhận được thông báo (Điều 79(4))\"},{\"from\":\"t4\",\"to\":\"t5\",\"label\":\"Sự miễn trách nhiệm chỉ kéo dài trong thời gian trở ngại còn tồn tại (Điều 79(3))\"}]}", "DE_XUAT_CHUA_DUYET"], ["CPV-04A", "4_VI_DU", "Ví dụ 1: CISG áp dụng khi không chọn luật", "A (trụ sở tại Việt Nam) bán thép cho B (trụ sở tại Hàn Quốc), hợp đồng không ghi luật. Bước 1: hai bên ở hai nước khác nhau (Điều 1(1)). Bước 2: giả định cả hai nước là thành viên CISG (cần kiểm tra khi giải đề cụ thể), nên Điều 1(1)(a) thỏa. Bước 3: thép không thuộc nhóm bị loại ở Điều 2 và không phải hợp đồng dịch vụ (Điều 3). Bước 4: không có thỏa thuận loại trừ (Điều 6). Kết luận: CISG tự áp dụng, hai bên không cần dẫn chiếu. Tình huống là giả định.", "CISG Điều 1(1)(a), 2, 3, 6", "QUY_DINH_RO_DOI_CHIEU_UNTS_DIEN_GIAI", "", "", "", "DE_XUAT_CHUA_DUYET"], ["CPV-04B", "4_VI_DU", "Ví dụ 2: hàng mua cho tiêu dùng cá nhân", "Một công ty ở Việt Nam bán một chiếc máy tính cho một cá nhân ở Hàn Quốc. Đơn đặt hàng ghi rõ mua để tặng gia đình. Kết luận: hàng mua cho mục đích cá nhân, gia đình mà bên bán biết nên bị loại ra (Điều 2(a)). Nếu đơn đặt hàng không nói gì và bên bán không thể biết mục đích đó thì CISG vẫn có thể áp dụng. Tình huống là giả định.", "CISG Điều 2(a)", "QUY_DINH_RO_DOI_CHIEU_UNTS_DIEN_GIAI", "", "", "", "DE_XUAT_CHUA_DUYET"], ["CPV-04C", "4_VI_DU", "Ví dụ 3: đặt làm máy theo yêu cầu", "A đặt B sản xuất một máy theo thiết kế riêng, B tự mua toàn bộ nguyên liệu. Hợp đồng cung cấp hàng sẽ sản xuất vẫn được coi là mua bán (Điều 3(1)). Nếu A tự cung cấp phần quan trọng nguyên liệu, hoặc nghĩa vụ chính của B là lao động, lắp đặt, dịch vụ, thì không được coi là mua bán và CISG không áp dụng (Điều 3). Việc xem phần nào là quan trọng cần xem từng vụ. Tình huống là giả định.", "CISG Điều 3(1), 3(2)", "QUY_DINH_RO_DOI_CHIEU_UNTS_DIEN_GIAI", "", "", "", "DE_XUAT_CHUA_DUYET"], ["CPV-04D", "4_VI_DU", "Ví dụ 4: lệnh cấm xuất khẩu sau khi ký", "A bán gạo cho B, hợp đồng ký tháng 1, giao tháng 5. Tháng 4 nhà nước của A bất ngờ ban lệnh cấm xuất khẩu gạo, A không giao được. Bước 1: lệnh cấm là trở ngại ngoài tầm kiểm soát của A. Bước 2: lúc ký chưa có dấu hiệu nào buộc A phải tính đến. Bước 3: A không thể tránh hay vượt qua. Bước 4: A phải thông báo B trong thời hạn hợp lý. Kết luận: A được miễn bồi thường thiệt hại trong thời gian lệnh cấm còn hiệu lực; B vẫn có thể hủy hợp đồng nếu đủ điều kiện hủy, vì Điều 79(5) chỉ chặn đòi bồi thường. Việc lệnh cấm cụ thể có thuộc phạm vi trở ngại hay không cần xem từng vụ. Tình huống là giả định.", "CISG Điều 79(1), 79(4), 79(5)", "QUY_DINH_RO_DOI_CHIEU_UNTS_DIEN_GIAI", "", "", "", "DE_XUAT_CHUA_DUYET"], ["CPV-04E", "4_VI_DU", "Ví dụ 5: bên kia gây ra vi phạm", "A phải giao hàng sau khi B mở thư tín dụng, nhưng B không mở. A không giao được. Kết luận: B không thể viện dẫn việc A không giao hàng, vì chính hành vi của B gây ra việc đó, trong phạm vi hành vi của B gây ra (Điều 80). Tình huống là giả định.", "CISG Điều 80", "QUY_DINH_RO_DOI_CHIEU_UNTS_DIEN_GIAI", "", "", "", "DE_XUAT_CHUA_DUYET"], ["CPV-05A", "5_BAY", "Bẫy 1: chỉ tính trụ sở, không tính quốc tịch", "Điều kiện là trụ sở ở hai nước khác nhau. Quốc tịch của các bên và việc họ là thương nhân hay dân sự không được xét (Điều 1(3)). Hai công ty cùng quốc tịch nhưng trụ sở hai nước vẫn có thể thuộc CISG. Nếu một bên có nhiều trụ sở, lấy nơi có quan hệ gần nhất với hợp đồng và việc thực hiện (Điều 10(a)); không có trụ sở thì lấy nơi cư trú thường xuyên (Điều 10(b)). Việc hai bên ở nước khác nhau phải thể hiện được từ hợp đồng, từ giao dịch trước đó hoặc thông tin trao đổi, không thể hiện thì bị bỏ qua (Điều 1(2)).", "CISG Điều 1(2), 1(3), 10", "QUY_DINH_RO_DOI_CHIEU_UNTS_DIEN_GIAI", "", "", "", "DE_XUAT_CHUA_DUYET"], ["CPV-05B", "5_BAY", "Bẫy 2: CISG không điều chỉnh mọi thứ", "Điều 4 nói Công ước chỉ điều chỉnh việc giao kết hợp đồng và quyền, nghĩa vụ của người bán, người mua. Công ước không điều chỉnh hiệu lực của hợp đồng hay của điều khoản nào, hiệu lực của tập quán, và tác động của hợp đồng đến quyền sở hữu hàng hóa. Cũng loại ra trách nhiệm về chết hoặc thương tích do hàng gây ra (Điều 5). Các vấn đề này do luật được dẫn tới điều chỉnh. Điều 7(2) nói vấn đề CISG điều chỉnh nhưng không giải quyết rõ thì dùng nguyên tắc chung của Công ước trước, rồi mới đến luật được dẫn tới.", "CISG Điều 4, 5, 7(2)", "QUY_DINH_RO_DOI_CHIEU_UNTS_DIEN_GIAI", "", "", "", "DE_XUAT_CHUA_DUYET"], ["CPV-05C", "5_BAY", "Bẫy 3: loại trừ CISG phải rõ, và có thể loại một phần", "Điều 6 cho phép hai bên loại trừ Công ước, hoặc trừ Điều 12 thì được làm trái hoặc thay đổi hiệu lực của từng quy định. Đề thi hay hỏi: ghi rằng hợp đồng chịu điều chỉnh của luật nước X (một nước thành viên) có phải là loại trừ CISG không. Bài giảng WTO 24-25 lưu trong Drive của anh ghi: nếu cả hai bên đều là thành viên mà chọn pháp luật quốc gia thì không có nghĩa là loại trừ Công ước Viên, chỉ khi các bên loại trừ thì Công ước mới bị loại (ghi chú có nhắc án lệ). Cách hiểu này là ghi chú bài giảng, chưa đối chiếu án lệ hay bình luận, nên cần ghi rõ loại trừ CISG trong hợp đồng.", "CISG Điều 6, 12", "QUAN_DIEM_GIANG_DAY", "https://drive.google.com/file/d/1Ai0ltjDV658sDsj1jSWGPz_9o7H4_URL/view", "", "", "DE_XUAT_CHUA_DUYET"], ["CPV-05D", "5_BAY", "Bẫy 4: tuyên bố Điều 96 của Việt Nam", "Thông báo của Tổng thư ký Liên Hợp Quốc năm 2015 (CN.700.2015) ghi Việt Nam gia nhập kèm một tuyên bố theo Điều 12 và 96: các quy định cho phép hợp đồng mua bán, việc sửa đổi, chấm dứt, chào hàng và chấp nhận được làm dưới hình thức khác văn bản (Điều 11, Điều 29, Phần II) không áp dụng khi một bên có trụ sở ở Việt Nam. Công ước có hiệu lực với Việt Nam từ 1/1/2017. Hệ quả: với bên Việt Nam, hình thức văn bản có ý nghĩa mà bài hình thành hợp đồng chưa tính. Chưa kiểm tra tuyên bố này đến nay có bị rút hay không và chưa soạn hệ quả cụ thể theo luật Việt Nam.", "CISG Điều 11, 12, 29, 96; Thông báo CN.700.2015", "QUY_DINH_RO_DOI_CHIEU_UNTS_DIEN_GIAI; CHUA_XAC_MINH_CON_HIEU_LUC", "https://treaties.un.org/doc/Publication/CN/2015/CN.700.2015-Eng.pdf", "", "", "DE_XUAT_CHUA_DUYET"], ["CPV-05E", "5_BAY", "Bẫy 5: miễn trách nhiệm chỉ chặn bồi thường thiệt hại", "Điều 79(5) nói điều khoản này không ngăn bên nào thực hiện quyền nào khác ngoài đòi bồi thường thiệt hại. Nên khi được miễn, bên kia vẫn có thể dùng các biện pháp khác theo Công ước (như hủy hợp đồng, nếu đủ điều kiện). Hai điều kiện hay bị quên: phải thông báo (Điều 79(4)) và sự miễn chỉ kéo dài khi trở ngại còn (Điều 79(3)). Nếu dùng người thứ ba để thực hiện thì cả hai đều phải thỏa điều kiện (Điều 79(2)).", "CISG Điều 79(2), 79(3), 79(4), 79(5)", "QUY_DINH_RO_DOI_CHIEU_UNTS_DIEN_GIAI", "", "", "", "DE_XUAT_CHUA_DUYET"], ["CPV-05F", "5_BAY", "Bẫy 6: giá tăng không đương nhiên là trở ngại", "Điều 79 dùng chữ trở ngại ngoài tầm kiểm soát và không dùng chữ bất khả kháng. Giá nguyên liệu tăng hay chi phí thực hiện tăng thường được xem là rủi ro thương mại bình thường, khó đáp ứng ba điều kiện không thể lường trước, không thể tránh, không thể vượt qua. Đây là quan điểm giảng dạy, chưa đối chiếu án lệ hay Ý kiến tư vấn của Hội đồng tư vấn CISG, cần xác nhận thêm.", "CISG Điều 79(1)", "QUAN_DIEM_GIANG_DAY; CHUA_XAC_MINH", "", "", "", "DE_XUAT_CHUA_DUYET"], ["CPV-06-01", "6_BANG_TRA", "Điều 1: phạm vi áp dụng", "Công ước áp dụng cho hợp đồng mua bán hàng hóa giữa các bên có trụ sở ở các quốc gia khác nhau, khi các quốc gia đó là thành viên hoặc quy tắc tư pháp quốc tế dẫn tới luật của một nước thành viên. Việc các bên ở nước khác nhau bị bỏ qua nếu không thể hiện từ hợp đồng, giao dịch trước đó hay thông tin trao đổi. Quốc tịch và tính dân sự hay thương mại không được xét.", "CISG Điều 1", "QUY_DINH_RO_DOI_CHIEU_UNTS_DIEN_GIAI", "", "", "", "DE_XUAT_CHUA_DUYET"], ["CPV-06-02", "6_BANG_TRA", "Điều 2: loại trừ theo loại giao dịch", "Không áp dụng cho hàng mua để dùng cá nhân, gia đình, nội trợ (trừ khi bên bán không biết và không thể biết), bán đấu giá, bán theo thi hành án hay thẩm quyền pháp luật, chứng khoán, giấy tờ có giá, tiền, tàu thủy, tàu đệm khí, tàu bay, điện.", "CISG Điều 2", "QUY_DINH_RO_DOI_CHIEU_UNTS_DIEN_GIAI", "", "", "", "DE_XUAT_CHUA_DUYET"], ["CPV-06-03", "6_BANG_TRA", "Điều 3: hợp đồng cung cấp hàng sản xuất và dịch vụ", "Hợp đồng cung cấp hàng sẽ sản xuất được coi là mua bán, trừ khi bên đặt hàng cung cấp phần quan trọng nguyên liệu. Không áp dụng khi phần lớn nghĩa vụ của bên cung cấp là lao động hay dịch vụ khác.", "CISG Điều 3", "QUY_DINH_RO_DOI_CHIEU_UNTS_DIEN_GIAI", "", "", "", "DE_XUAT_CHUA_DUYET"], ["CPV-06-04", "6_BANG_TRA", "Điều 4: Công ước điều chỉnh gì", "Chỉ điều chỉnh việc giao kết hợp đồng và quyền, nghĩa vụ của người bán, người mua. Không điều chỉnh hiệu lực của hợp đồng hay điều khoản nào, hiệu lực của tập quán, và tác động của hợp đồng đến quyền sở hữu hàng hóa.", "CISG Điều 4", "QUY_DINH_RO_DOI_CHIEU_UNTS_DIEN_GIAI", "", "", "", "DE_XUAT_CHUA_DUYET"], ["CPV-06-05", "6_BANG_TRA", "Điều 5: thương tích do hàng", "Công ước không áp dụng cho trách nhiệm của người bán về chết hoặc thương tích do hàng hóa gây ra.", "CISG Điều 5", "QUY_DINH_RO_DOI_CHIEU_UNTS_DIEN_GIAI", "", "", "", "DE_XUAT_CHUA_DUYET"], ["CPV-06-06", "6_BANG_TRA", "Điều 6: tự do thỏa thuận", "Các bên có thể loại trừ Công ước, và tùy Điều 12, làm trái hoặc thay đổi hiệu lực của quy định của Công ước.", "CISG Điều 6", "QUY_DINH_RO_DOI_CHIEU_UNTS_DIEN_GIAI", "", "", "", "DE_XUAT_CHUA_DUYET"], ["CPV-06-10", "6_BANG_TRA", "Điều 10: nơi kinh doanh", "Nhiều trụ sở thì lấy nơi có quan hệ gần nhất với hợp đồng và việc thực hiện, xét hoàn cảnh các bên biết hay dự liệu lúc ký. Không có trụ sở thì lấy nơi cư trú thường xuyên.", "CISG Điều 10", "QUY_DINH_RO_DOI_CHIEU_UNTS_DIEN_GIAI", "", "", "", "DE_XUAT_CHUA_DUYET"], ["CPV-06-79", "6_BANG_TRA", "Điều 79: miễn trách nhiệm", "Bên không thực hiện không chịu trách nhiệm nếu do trở ngại ngoài tầm kiểm soát mà lúc ký không thể mong đợi một cách hợp lý bên đó tính đến, tránh hoặc vượt qua được. Dùng bên thứ ba thì cả hai phải đủ điều kiện. Miễn trong thời gian trở ngại còn tồn tại. Phải thông báo, nếu không phải bồi thường thiệt hại do không nhận được thông báo. Chỉ ngăn đòi bồi thường thiệt hại.", "CISG Điều 79", "QUY_DINH_RO_DOI_CHIEU_UNTS_DIEN_GIAI", "", "", "", "DE_XUAT_CHUA_DUYET"], ["CPV-06-80", "6_BANG_TRA", "Điều 80: lỗi của bên kia", "Một bên không được viện dẫn việc bên kia không thực hiện nghĩa vụ trong chừng mực chính hành động hoặc sự bỏ sót của mình gây ra việc đó.", "CISG Điều 80", "QUY_DINH_RO_DOI_CHIEU_UNTS_DIEN_GIAI", "", "", "", "DE_XUAT_CHUA_DUYET"], ["CPV-07", "7_GHI_CHU_NGUON", "Cách đối chiếu và giới hạn", "Nguồn: bản Công ước trong Treaty Series của Liên Hợp Quốc (tập 1489) cho Điều 1 đến 7, 9, 10, 79, 80, 95, 96, 98, 100, và thông báo CN.700.2015 của Tổng thư ký Liên Hợp Quốc về việc Việt Nam gia nhập. Nội dung là diễn giải của người soạn, không chèn nguyên văn. Chưa đối chiếu bản tiếng Việt chính thức, án lệ, Ý kiến tư vấn của Hội đồng tư vấn CISG hay bình luận. Chưa kiểm tra tình trạng thành viên và bảo lưu của từng nước (ví dụ Hàn Quốc), chưa kiểm tra tuyên bố Điều 96 của Việt Nam hiện nay còn hiệu lực hay không, và chưa soạn Điều 8, 9 (tập quán) ngoài phạm vi. Hai điểm quan điểm giảng dạy (loại trừ CISG bằng cách chọn luật nước thành viên; giá tăng không phải trở ngại) chưa xác minh. Ví dụ là tình huống giả định. Toàn bộ cần anh duyệt.", "", "CHUA_XAC_MINH", "https://treaties.un.org/doc/Publication/UNTS/Volume%201489/volume-1489-I-25567-English.pdf", "", "", "DE_XUAT_CHUA_DUYET"]], "SOAN_THU_20261026_TRO_CAP": [["SCM-00", "0_PHAM_VI", "Chủ đề và phạm vi", "Chủ đề: Trợ cấp và biện pháp đối kháng, theo Hiệp định về Trợ cấp và các Biện pháp Đối kháng (SCM). Đây là bài còn thiếu của nhóm phòng vệ thương mại, học sau bài chống bán phá giá và tự vệ. Đã đọc nguyên văn bản tiếng Việt trong Drive của anh: Điều 1 đến 7 (định nghĩa, tính riêng biệt, trợ cấp bị cấm, trợ cấp có thể bị kiện), Điều 10 đến 16 và 19 đến 21 (thuế đối kháng), Điều 27 (nước đang phát triển), Điều 30 đến 32. Đã đọc lướt nhưng chưa đưa vào bài: Điều 8, 9 (trợ cấp không thể bị kiện), Điều 12 chi tiết về bằng chứng, các Phụ lục. Chưa đọc: Điều 17, 18 (biện pháp tạm thời, cam kết), 22 đến 26, 28, 29. Văn bản dùng là bản dịch tiếng Việt, chưa đối chiếu bản tiếng Anh chính thức.", "SCM Điều 1, 2, 3, 5, 10, 11", "QUY_DINH_RO_DOI_CHIEU_BAN_DICH_DRIVE_DIEN_GIAI", "https://drive.google.com/file/d/1ZvH0_KdKGC1u_p8PFJIogjHLyXSgWhd_/view", "", "", "DE_XUAT_CHUA_DUYET"], ["SCM-01", "1_CAU_HOI", "Câu hỏi đời thường", "Chính phủ nước A cho các nhà máy giày xuất khẩu vay vốn với lãi suất thấp hơn hẳn thị trường. Nhà sản xuất giày ở nước B mất khách vì giày A rẻ hơn. Chính phủ B có hai cách đáp lại: tự đánh thuế lên giày nhập từ A, hoặc kiện A lên WTO. Mỗi cách đòi hỏi chứng minh những gì, và có làm cả hai được không?", "", "QUAN_DIEM_GIANG_DAY", "", "", "", "DE_XUAT_CHUA_DUYET"], ["SCM-02", "2_QUY_TAC", "Quy tắc một câu", "Trợ cấp theo SCM là khoản chính phủ đóng góp về tài chính mang lại lợi ích, và chỉ bị điều chỉnh nếu mang tính riêng biệt cho một số doanh nghiệp hay ngành. Có ba lớp: bị cấm (gắn với xuất khẩu hoặc dùng hàng nội địa), có thể bị kiện (gây tác động có hại), và khi hàng trợ cấp vào nước khác gây tổn hại thì nước nhập khẩu có thể đánh thuế đối kháng. Với cùng một tác động trên thị trường nước nhập khẩu, chỉ được dùng một trong hai cách: thuế đối kháng hoặc kiện lên WTO.", "SCM Điều 1.1, 1.2, 2, 3, 5, 10, 19; chú thích 39", "QUY_DINH_RO_DOI_CHIEU_BAN_DICH_DRIVE_DIEN_GIAI", "https://drive.google.com/file/d/1ZvH0_KdKGC1u_p8PFJIogjHLyXSgWhd_/view", "", "", "DE_XUAT_CHUA_DUYET"], ["SCM-03A", "3_SO_DO", "Cây quyết định: khoản hỗ trợ này thuộc loại nào", "Đi theo bốn câu hỏi theo thứ tự. Mỗi câu có hai lối rẽ, dẫn tới kết luận.", "SCM Điều 1 đến 5", "QUY_DINH_RO_DOI_CHIEU_BAN_DICH_DRIVE_DIEN_GIAI", "", "CAY_QUYET_DINH", "{\"start\":\"q1\",\"nodes\":[{\"id\":\"q1\",\"cspl\":\"Điều 1.1(a)\",\"text\":\"Chính phủ hoặc cơ quan công cộng có đóng góp về tài chính (chuyển vốn, bảo lãnh, bỏ qua khoản thu như miễn thuế, cung cấp hàng hoặc dịch vụ không phải hạ tầng chung, mua hàng, hoặc giao một tổ chức tư nhân làm các việc đó), hoặc có hỗ trợ thu nhập hay giá theo Điều XVI GATT 1994?\",\"yes\":\"q2\",\"no\":\"e1\"},{\"id\":\"q2\",\"cspl\":\"Điều 1.1(b), 14\",\"text\":\"Việc đó mang lại lợi ích cho người nhận, so với điều kiện thị trường?\",\"yes\":\"q3\",\"no\":\"e1\"},{\"id\":\"q3\",\"cspl\":\"Điều 1.2, 2\",\"text\":\"Trợ cấp mang tính riêng biệt: chỉ dành cho một doanh nghiệp, nhóm doanh nghiệp, ngành hoặc vùng nhất định, bằng văn bản hay trên thực tế?\",\"yes\":\"q4\",\"no\":\"e2\"},{\"id\":\"q4\",\"cspl\":\"Điều 3.1\",\"text\":\"Trợ cấp phụ thuộc vào kết quả xuất khẩu, hoặc phụ thuộc vào việc ưu tiên dùng hàng nội địa hơn hàng ngoại?\",\"yes\":\"e3\",\"no\":\"e4\"}],\"ends\":[{\"id\":\"e1\",\"text\":\"Không phải trợ cấp theo nghĩa của SCM.\"},{\"id\":\"e2\",\"text\":\"Là trợ cấp nhưng không riêng biệt, nên không thuộc các quy định về trợ cấp bị cấm, có thể bị kiện và thuế đối kháng (Điều 1.2).\"},{\"id\":\"e3\",\"text\":\"Trợ cấp bị cấm. Mỗi thành viên không được cấp hay duy trì (Điều 3.2).\"},{\"id\":\"e4\",\"text\":\"Trợ cấp riêng biệt không bị cấm. Có thể bị kiện nếu gây tác động có hại (Điều 5), hoặc bị đánh thuế đối kháng nếu gây tổn hại ngành sản xuất nước nhập khẩu (Phần V).\"}]}", "DE_XUAT_CHUA_DUYET"], ["SCM-03B", "3_SO_DO", "Ma trận: bốn hình thức đóng góp tài chính và cách xem có lợi ích", "Mỗi dòng là một hình thức đóng góp tài chính. Cột cuối cho biết cách so sánh với thị trường để xác định có lợi ích hay không.", "SCM Điều 1.1(a)(1), 14", "QUY_DINH_RO_DOI_CHIEU_BAN_DICH_DRIVE_DIEN_GIAI", "", "MA_TRAN", "{\"cols\":[\"Ví dụ\",\"Cách xác định có lợi ích (Điều 14)\"],\"rows\":[{\"label\":\"Chuyển vốn hoặc có khả năng chuyển hay nhận nợ trực tiếp (Điều 1.1(a)(1)(i))\",\"cells\":[\"Cấp phát, cho vay, góp cổ phần, bảo lãnh vay\",\"Góp vốn không có lợi ích trừ khi quyết định đầu tư trái với thông lệ đầu tư tư nhân (14(a)). Cho vay: lợi ích là chênh lệch với khoản vay thương mại tương tự (14(b)). Bảo lãnh: chênh lệch với vay thương mại không có bảo lãnh, tính cả chênh lệch lệ phí (14(c))\"]},{\"label\":\"Bỏ qua hay không thu các khoản phải nộp cho chính phủ (Điều 1.1(a)(1)(ii))\",\"cells\":[\"Miễn thuế, ưu đãi tài chính\",\"Điều 14 không nêu cách tính riêng cho dạng này. Miễn thuế xuất khẩu hoặc hoàn thuế không vượt mức đã nộp, đối với sản phẩm tương tự tiêu dùng trong nước, không bị coi là trợ cấp (chú thích 5)\"]},{\"label\":\"Cung cấp hàng hoá hay dịch vụ không phải hạ tầng chung, hoặc mua hàng (Điều 1.1(a)(1)(iii))\",\"cells\":[\"Bán nguyên liệu giá thấp, mua hàng giá cao\",\"Có lợi ích nếu trả ít hơn hoặc nhận nhiều hơn mức thích đáng, so với điều kiện thị trường phổ biến về giá, chất lượng, tính sẵn có, vận chuyển (14(d))\"]},{\"label\":\"Góp tiền vào cơ chế tài trợ, hoặc giao hay lệnh cho tổ chức tư nhân thực hiện các việc trên (Điều 1.1(a)(1)(iv))\",\"cells\":[\"Giao ngân hàng tư nhân cho vay ưu đãi theo lệnh của chính phủ\",\"Áp dụng cách tính theo hình thức thực tế mà tổ chức tư nhân thực hiện\"]}]}", "DE_XUAT_CHUA_DUYET"], ["SCM-03C", "3_SO_DO", "Ma trận: trợ cấp bị cấm và trợ cấp có thể bị kiện", "Hai con đường kiện lên WTO. Cột cho biết phải chứng minh gì, mốc thời hạn trong Hiệp định, và hậu quả nếu thắng.", "SCM Điều 3, 4, 5, 7", "QUY_DINH_RO_DOI_CHIEU_BAN_DICH_DRIVE_DIEN_GIAI", "", "MA_TRAN", "{\"cols\":[\"Phải chứng minh gì\",\"Thời hạn chính\",\"Nếu thắng\"],\"rows\":[{\"label\":\"Trợ cấp bị cấm (Điều 3, 4)\",\"cells\":[\"Có trợ cấp và nó gắn với xuất khẩu hoặc ưu tiên hàng nội địa. Yêu cầu tham vấn kèm bằng chứng về sự tồn tại và tính chất của trợ cấp (4.2)\",\"Tham vấn 30 ngày rồi có thể đưa ra DSB (4.4). Ban hội thẩm báo cáo trong 90 ngày (4.6). Kháng cáo 30 ngày, tối đa 60 (4.9). Các thời hạn khác bằng nửa thời hạn trong DSU (4.12)\",\"Ban hội thẩm khuyến nghị bỏ ngay trợ cấp và nêu thời hạn bỏ (4.7). Nếu không thực hiện đúng hạn, DSB cho phép biện pháp đối kháng phù hợp (4.10)\"]},{\"label\":\"Trợ cấp có thể bị kiện (Điều 5, 6, 7)\",\"cells\":[\"Trợ cấp gây tác động có hại: gây tổn hại ngành sản xuất, vô hiệu hay làm suy giảm lợi ích theo GATT, hoặc gây tổn hại nghiêm trọng (Điều 5). Yêu cầu tham vấn phải nêu bằng chứng về trợ cấp và tác động (7.2)\",\"Tham vấn 60 ngày (7.4). Ban hội thẩm báo cáo trong 120 ngày (7.5). Kháng cáo 60 ngày, tối đa 90 (7.7). Sau khi báo cáo được thông qua, 6 tháng để loại bỏ tác động hoặc trợ cấp (7.9)\",\"Bên áp dụng trợ cấp phải loại bỏ tác động có hại hoặc bỏ trợ cấp (7.8). Nếu không, DSB cho phép biện pháp đối kháng tương xứng với tác động đã xác định (7.9)\"]}]}", "DE_XUAT_CHUA_DUYET"], ["SCM-03D", "3_SO_DO", "Cây quyết định: có đánh thuế đối kháng được không", "Bốn câu hỏi theo Phần V. Câu nào trả lời Không thì nước nhập khẩu không được đánh thuế đối kháng.", "SCM Điều 10, 11, 15, 19", "QUY_DINH_RO_DOI_CHIEU_BAN_DICH_DRIVE_DIEN_GIAI", "", "CAY_QUYET_DINH", "{\"start\":\"q1\",\"nodes\":[{\"id\":\"q1\",\"cspl\":\"Điều 11.1, 11.4\",\"text\":\"Có đơn bằng văn bản của hoặc thay mặt ngành sản xuất trong nước, và các nhà sản xuất ủng hộ chiếm hơn 50% sản lượng của những người bày tỏ ý kiến, đồng thời vượt 25% tổng sản lượng ngành?\",\"yes\":\"q2\",\"no\":\"e1\"},{\"id\":\"q2\",\"cspl\":\"Điều 11.9\",\"text\":\"Trợ cấp không ở mức tối thiểu, tức là từ 1% trị giá sản phẩm trở lên? (với nước đang phát triển, ngưỡng chấm dứt điều tra là 2%, Điều 27.10)\",\"yes\":\"q3\",\"no\":\"e2\"},{\"id\":\"q3\",\"cspl\":\"Điều 15.1, chú thích 49\",\"text\":\"Hàng nhập khẩu được trợ cấp gây tổn hại vật chất, đe doạ gây tổn hại vật chất, hoặc gây chậm trễ thực sự cho việc thiết lập ngành sản xuất trong nước?\",\"yes\":\"q4\",\"no\":\"e3\"},{\"id\":\"q4\",\"cspl\":\"Điều 11.2(c), 19.1\",\"text\":\"Có quan hệ nhân quả giữa nhập khẩu được trợ cấp và tổn hại đó?\",\"yes\":\"e4\",\"no\":\"e3\"}],\"ends\":[{\"id\":\"e1\",\"text\":\"Không được mở điều tra.\"},{\"id\":\"e2\",\"text\":\"Điều tra chấm dứt ngay lập tức (Điều 11.9).\"},{\"id\":\"e3\",\"text\":\"Không đủ điều kiện đánh thuế đối kháng.\"},{\"id\":\"e4\",\"text\":\"Có thể đánh thuế đối kháng. Mức thuế bằng hoặc thấp hơn mức trợ cấp (Điều 19.2, 19.4), áp dụng không phân biệt đối xử với mọi nguồn bị kết luận (Điều 19.3).\"}]}", "DE_XUAT_CHUA_DUYET"], ["SCM-03E", "3_SO_DO", "Dòng thời gian của một vụ thuế đối kháng", "Các mốc từ nộp đơn đến hết hạn thuế. Giữa các mốc là các khoảng có thời hạn theo Hiệp định.", "SCM Điều 11.3, 11.11, 19, 21.3", "QUY_DINH_RO_DOI_CHIEU_BAN_DICH_DRIVE_DIEN_GIAI", "", "DONG_THOI_GIAN", "{\"events\":[{\"id\":\"t1\",\"label\":\"Ngành sản xuất nộp đơn\"},{\"id\":\"t2\",\"label\":\"Cơ quan có thẩm quyền quyết định mở điều tra\"},{\"id\":\"t3\",\"label\":\"Kết thúc điều tra, có kết luận\"},{\"id\":\"t4\",\"label\":\"Bắt đầu thu thuế đối kháng\"},{\"id\":\"t5\",\"label\":\"Hết 5 năm kể từ khi áp dụng\"}],\"spans\":[{\"from\":\"t1\",\"to\":\"t2\",\"label\":\"Cơ quan phải kiểm tra bằng chứng và mức ủng hộ của ngành đủ chưa (11.3, 11.4)\"},{\"from\":\"t2\",\"to\":\"t3\",\"label\":\"Điều tra xong trong một năm, tối đa 18 tháng, trừ trường hợp đặc biệt (11.11)\"},{\"from\":\"t3\",\"to\":\"t4\",\"label\":\"Quyết định có đánh thuế và mức thuế, không vượt mức trợ cấp (19.2, 19.4)\"},{\"from\":\"t4\",\"to\":\"t5\",\"label\":\"Thuế chỉ tồn tại khi và chừng nào cần để đối kháng trợ cấp đang gây tổn hại (21.1), và kết thúc muộn nhất sau 5 năm trừ khi rà soát cho thấy trợ cấp và tổn hại có khả năng tiếp diễn hoặc tái diễn (21.3). Rà soát thường xong trong 12 tháng (21.4)\"}]}", "DE_XUAT_CHUA_DUYET"], ["SCM-04A", "4_VI_DU", "Ví dụ 1: vay ưu đãi cho nhà xuất khẩu", "Chính phủ A cho các nhà máy dệt xuất khẩu vay với lãi suất 2% khi vay thương mại cùng điều kiện là 8%. Bước 1: cho vay trực tiếp là đóng góp tài chính (Điều 1.1(a)(1)(i)). Bước 2: lợi ích là chênh lệch lãi suất so với vay thương mại (Điều 14(b)). Bước 3: chỉ dành cho ngành dệt nên riêng biệt (Điều 2.1(a)). Bước 4: nếu khoản vay chỉ dành cho doanh nghiệp xuất khẩu hoặc tuỳ theo kết quả xuất khẩu thì rơi vào Điều 3.1(a), là trợ cấp bị cấm. Kết luận: nước B có thể yêu cầu tham vấn theo Điều 4.1 mà không cần chứng minh tác động có hại. Tình huống là giả định.", "SCM Điều 1.1, 2.1(a), 3.1(a), 4.1, 14(b)", "QUY_DINH_RO_DOI_CHIEU_BAN_DICH_DRIVE_DIEN_GIAI", "", "", "", "DE_XUAT_CHUA_DUYET"], ["SCM-04B", "4_VI_DU", "Ví dụ 2: ưu đãi theo quy mô doanh nghiệp", "Chính phủ giảm thuế thu nhập cho mọi doanh nghiệp dưới 200 lao động, tự động áp dụng cho ai đủ điều kiện, tiêu chí ghi rõ trong luật. Bước 1: giảm thuế là bỏ qua khoản thu, có đóng góp tài chính và lợi ích. Bước 2: tiêu chí số lao động hay quy mô doanh nghiệp là tiêu chí khách quan, trung lập, được áp dụng tự động và tuân thủ chặt (Điều 2.1(b) và chú thích 6). Kết luận: không riêng biệt, nên không thuộc các quy định về trợ cấp bị cấm, có thể bị kiện và thuế đối kháng (Điều 1.2). Cần lưu ý nếu trên thực tế chỉ vài doanh nghiệp hưởng phần lớn trợ cấp thì Điều 2.1(c) vẫn có thể coi là riêng biệt trên thực tế. Tình huống là giả định.", "SCM Điều 1.2, 2.1(b), 2.1(c), chú thích 6", "QUY_DINH_RO_DOI_CHIEU_BAN_DICH_DRIVE_DIEN_GIAI", "", "", "", "DE_XUAT_CHUA_DUYET"], ["SCM-04C", "4_VI_DU", "Ví dụ 3: thưởng cho dùng linh kiện nội địa", "Chính phủ thưởng cho nhà máy lắp ráp xe nếu dùng ít nhất 40% linh kiện sản xuất trong nước. Khoản thưởng phụ thuộc vào việc ưu tiên dùng hàng nội địa hơn hàng ngoại. Kết luận: rơi vào Điều 3.1(b), là trợ cấp bị cấm, và mỗi thành viên không được cấp hay duy trì (Điều 3.2). Tình huống là giả định.", "SCM Điều 3.1(b), 3.2", "QUY_DINH_RO_DOI_CHIEU_BAN_DICH_DRIVE_DIEN_GIAI", "", "", "", "DE_XUAT_CHUA_DUYET"], ["SCM-04D", "4_VI_DU", "Ví dụ 4: đơn yêu cầu điều tra không đủ ủng hộ", "Nước B nhận đơn yêu cầu điều tra thuế đối kháng với gạo nhập từ A. Nhà sản xuất nộp đơn chiếm 20% tổng sản lượng gạo trong nước, các nhà sản xuất khác không lên tiếng. Điều 11.4 nói điều tra không được tiến hành nếu tiếng nói ủng hộ không vượt quá 25% tổng khối lượng của ngành sản xuất sản phẩm tương tự trong nước. Kết luận: cơ quan có thẩm quyền không được mở điều tra. Tình huống là giả định.", "SCM Điều 11.4", "QUY_DINH_RO_DOI_CHIEU_BAN_DICH_DRIVE_DIEN_GIAI", "", "", "", "DE_XUAT_CHUA_DUYET"], ["SCM-04E", "4_VI_DU", "Ví dụ 5: trợ cấp quá nhỏ", "Điều tra thuế đối kháng cho thấy trợ cấp là 1,5% trị giá sản phẩm. Nếu nước xuất khẩu không phải nước đang phát triển, mức này vượt ngưỡng 1% nên điều tra tiếp tục (Điều 11.9). Nếu nước xuất khẩu là thành viên đang phát triển, Điều 27.10(a) buộc chấm dứt điều tra khi tổng trợ cấp không vượt quá 2%. Kết luận: cùng mức trợ cấp, kết quả khác nhau theo nước xuất khẩu. Tình huống là giả định.", "SCM Điều 11.9, 27.10(a)", "QUY_DINH_RO_DOI_CHIEU_BAN_DICH_DRIVE_DIEN_GIAI", "", "", "", "DE_XUAT_CHUA_DUYET"], ["SCM-05A", "5_BAY", "Bẫy 1: có trợ cấp chưa chắc bị điều chỉnh", "Điều 1.2 nói trợ cấp chỉ chịu các quy định về trợ cấp bị cấm, có thể bị kiện và thuế đối kháng khi nó riêng biệt theo Điều 2. Trợ cấp không riêng biệt (ví dụ tiêu chí khách quan áp dụng tự động cho mọi doanh nghiệp) nằm ngoài các quy định này. Ngược lại, trợ cấp bị cấm theo Điều 3 được coi là riêng biệt (Điều 2.3). Việc thay đổi thuế suất áp dụng chung không phải trợ cấp riêng biệt (Điều 2.2).", "SCM Điều 1.2, 2.2, 2.3", "QUY_DINH_RO_DOI_CHIEU_BAN_DICH_DRIVE_DIEN_GIAI", "", "", "", "DE_XUAT_CHUA_DUYET"], ["SCM-05B", "5_BAY", "Bẫy 2: bị cấm không cần chứng minh tác động, có thể bị kiện thì phải", "Với trợ cấp bị cấm, yêu cầu tham vấn chỉ cần kèm bằng chứng về sự tồn tại và tính chất của trợ cấp (Điều 4.2). Với trợ cấp có thể bị kiện, yêu cầu tham vấn phải nêu bằng chứng cả về trợ cấp lẫn thiệt hại hay tổn hại nghiêm trọng đã gây ra (Điều 7.2). Đây là khác biệt lớn nhất về gánh nặng chứng minh giữa hai nhóm.", "SCM Điều 4.2, 7.2", "QUY_DINH_RO_DOI_CHIEU_BAN_DICH_DRIVE_DIEN_GIAI", "", "", "", "DE_XUAT_CHUA_DUYET"], ["SCM-05C", "5_BAY", "Bẫy 3: thuế đối kháng và biện pháp đối kháng là hai thứ", "Thuế đối kháng là khoản thuế riêng do nước nhập khẩu tự áp theo Phần V để triệt tiêu trợ cấp (Điều 10, chú thích 40). Biện pháp đối kháng là biện pháp DSB cho phép sau khi kiện thắng mà bên kia không thực hiện (Điều 4.10, 7.9). Bản dịch tiếng Việt dùng chữ đối kháng cho cả hai nên dễ lẫn. Với cùng một tác động của một trợ cấp trên thị trường nước nhập khẩu, chỉ được dùng một hình thức: thuế đối kháng hoặc biện pháp đối kháng theo Điều 4 hay 7 (chú thích 39).", "SCM Điều 4.10, 7.9, 10; chú thích 39, 40", "QUY_DINH_RO_DOI_CHIEU_BAN_DICH_DRIVE_DIEN_GIAI", "", "", "", "DE_XUAT_CHUA_DUYET"], ["SCM-05D", "5_BAY", "Bẫy 4: thuế không được vượt mức trợ cấp", "Mức thuế đối kháng phải bằng hoặc thấp hơn mức trợ cấp (Điều 19.2), và không được đánh vượt số tiền trợ cấp tính trên đơn vị sản phẩm (Điều 19.4). Hiệp định mong muốn mức thuế thấp hơn nếu đủ để khắc phục tổn hại (Điều 19.2). Thuế chỉ áp dụng cho hàng đưa vào tiêu thụ sau khi quyết định có hiệu lực, trừ các ngoại lệ về hồi tố (Điều 20).", "SCM Điều 19.2, 19.4, 20", "QUY_DINH_RO_DOI_CHIEU_BAN_DICH_DRIVE_DIEN_GIAI", "", "", "", "DE_XUAT_CHUA_DUYET"], ["SCM-05E", "5_BAY", "Bẫy 5: nước đang phát triển được đối xử khác", "Điều 3.1(a) cấm trợ cấp xuất khẩu không áp dụng cho các thành viên đang phát triển nêu trong Phụ lục VII (Điều 27.2(a)), và áp dụng thời hạn chuyển tiếp cho nước đang phát triển khác (Điều 27.2(b), 27.4). Điều tra thuế đối kháng chấm dứt khi trợ cấp không vượt 2% trị giá sản phẩm, hoặc khối lượng nhập khẩu được trợ cấp dưới 4% tổng nhập khẩu sản phẩm tương tự (Điều 27.10). Chưa kiểm tra Việt Nam có thuộc Phụ lục VII hay còn được hưởng các thời hạn chuyển tiếp này hay không.", "SCM Điều 27.2, 27.4, 27.10", "QUY_DINH_RO_DOI_CHIEU_BAN_DICH_DRIVE_DIEN_GIAI; CHUA_XAC_MINH", "", "", "", "DE_XUAT_CHUA_DUYET"], ["SCM-05F", "5_BAY", "Bẫy 6: các điều khoản có thời hạn 5 năm", "Điều 31 nói Điều 6.1 và các Điều 8, 9 (trợ cấp không thể bị kiện) chỉ áp dụng trong 5 năm kể từ ngày Hiệp định WTO có hiệu lực, và Ủy ban xem xét có gia hạn hay không. Bản trong Drive không nói kết quả. Theo hiểu biết của người soạn, các điều khoản này không được gia hạn nên đã hết hiệu lực, nhưng điểm này CHƯA XÁC MINH bằng nguồn. Giáo trình hay đề cũ vẫn có thể nhắc nhóm trợ cấp không thể bị kiện, cần hỏi giảng viên cách ra đề.", "SCM Điều 31", "CHUA_XAC_MINH", "", "", "", "DE_XUAT_CHUA_DUYET"], ["SCM-06-01", "6_BANG_TRA", "Điều 1: định nghĩa trợ cấp", "Trợ cấp tồn tại nếu có đóng góp tài chính của chính phủ hay cơ quan công cộng (chuyển vốn, bỏ qua khoản thu, cung cấp hàng hoặc dịch vụ không phải hạ tầng chung hay mua hàng, giao tổ chức tư nhân làm các việc đó) hoặc có hỗ trợ thu nhập hay trợ giá theo Điều XVI GATT 1994, và có lợi ích được cấp. Chỉ bị điều chỉnh bởi các phần về trợ cấp bị cấm, có thể bị kiện và thuế đối kháng khi riêng biệt.", "SCM Điều 1", "QUY_DINH_RO_DOI_CHIEU_BAN_DICH_DRIVE_DIEN_GIAI", "", "", "", "DE_XUAT_CHUA_DUYET"], ["SCM-06-02", "6_BANG_TRA", "Điều 2: tính riêng biệt", "Riêng biệt với một doanh nghiệp, nhóm doanh nghiệp hay ngành: khi luật hay cơ quan cấp hạn chế rõ người được hưởng (điểm a); không riêng biệt nếu dùng tiêu chuẩn khách quan, tự động, ghi rõ trong văn bản (điểm b); vẫn có thể riêng biệt trên thực tế theo các yếu tố như chỉ một số ít doanh nghiệp hưởng, hưởng phần lớn, số tiền chênh lệch, cơ quan tùy ý quyết định (điểm c). Trợ cấp giới hạn ở một vùng địa lý của cơ quan cấp là riêng biệt (2.2). Trợ cấp bị cấm coi là riêng biệt (2.3). Phải chứng minh bằng bằng chứng thực tế (2.4).", "SCM Điều 2", "QUY_DINH_RO_DOI_CHIEU_BAN_DICH_DRIVE_DIEN_GIAI", "", "", "", "DE_XUAT_CHUA_DUYET"], ["SCM-06-03", "6_BANG_TRA", "Điều 3: trợ cấp bị cấm", "Trừ quy định khác trong Hiệp định Nông nghiệp, bị cấm: trợ cấp phụ thuộc vào kết quả xuất khẩu, theo luật hay trên thực tế, dù độc lập hay kèm điều kiện khác, kể cả các biểu minh tại Phụ lục I; và trợ cấp phụ thuộc vào việc ưu tiên dùng hàng nội địa hơn hàng ngoại. Mỗi thành viên không được cấp hay duy trì.", "SCM Điều 3", "QUY_DINH_RO_DOI_CHIEU_BAN_DICH_DRIVE_DIEN_GIAI", "", "", "", "DE_XUAT_CHUA_DUYET"], ["SCM-06-04", "6_BANG_TRA", "Điều 4: khởi kiện trợ cấp bị cấm", "Tham vấn kèm bằng chứng; sau 30 ngày không đạt được giải pháp thì đưa ra DSB để lập ban hội thẩm ngay (trừ khi DSB nhất trí không lập). Ban hội thẩm có thể nhờ Nhóm chuyên gia thường trực, kết luận của nhóm này được chấp nhận không sửa. Báo cáo trong 90 ngày. DSB thông qua trong 30 ngày trừ khi kháng cáo hoặc đồng thuận không thông qua. Kháng cáo 30 ngày, tối đa 60. Thời hạn khác bằng một nửa DSU.", "SCM Điều 4", "QUY_DINH_RO_DOI_CHIEU_BAN_DICH_DRIVE_DIEN_GIAI", "", "", "", "DE_XUAT_CHUA_DUYET"], ["SCM-06-05", "6_BANG_TRA", "Điều 5 và 6.3: trợ cấp có thể bị kiện", "Không được dùng trợ cấp gây tác động có hại: gây tổn hại ngành sản xuất của thành viên khác, vô hiệu hay làm suy giảm lợi ích theo GATT, gây tổn hại nghiêm trọng. Tổn hại nghiêm trọng có thể phát sinh khi trợ cấp (a) cản trở nhập khẩu vào thị trường nước trợ cấp, (b) cản trở xuất khẩu của nước khác từ thị trường nước thứ ba, (c) hạ giá, ép giá, giảm doanh số đáng kể trên cùng thị trường, (d) làm tăng thị phần thế giới của nước trợ cấp so với trung bình ba năm trước.", "SCM Điều 5, 6.3", "QUY_DINH_RO_DOI_CHIEU_BAN_DICH_DRIVE_DIEN_GIAI", "", "", "", "DE_XUAT_CHUA_DUYET"], ["SCM-06-06", "6_BANG_TRA", "Điều 7: khởi kiện trợ cấp có thể bị kiện", "Tham vấn kèm bằng chứng về trợ cấp và tác động; sau 60 ngày đưa ra DSB. Ban hội thẩm báo cáo trong 120 ngày; DSB thông qua trong 30 ngày trừ khi kháng cáo; kháng cáo 60 ngày, tối đa 90. Thắng kiện thì bên trợ cấp loại bỏ tác động hoặc trợ cấp; sau 6 tháng nếu không làm và không có đền bù thì DSB cho phép biện pháp đối kháng tương xứng.", "SCM Điều 7", "QUY_DINH_RO_DOI_CHIEU_BAN_DICH_DRIVE_DIEN_GIAI", "", "", "", "DE_XUAT_CHUA_DUYET"], ["SCM-06-07", "6_BANG_TRA", "Điều 11: khởi động điều tra thuế đối kháng", "Điều tra khởi đầu trên đơn bằng văn bản của hoặc thay mặt ngành sản xuất trong nước, kèm bằng chứng về trợ cấp, thiệt hại và quan hệ nhân quả. Đơn được coi là của ngành nếu được nhà sản xuất chiếm hơn 50% sản lượng của những người bày tỏ ý kiến ủng hộ, nhưng không điều tra nếu ủng hộ không vượt 25% tổng khối lượng của ngành. Điều tra chấm dứt ngay nếu trợ cấp dưới 1% trị giá sản phẩm (hay khối lượng nhập khẩu hoặc thiệt hại không đáng kể). Hoàn thành trong một năm, tối đa 18 tháng.", "SCM Điều 11", "QUY_DINH_RO_DOI_CHIEU_BAN_DICH_DRIVE_DIEN_GIAI", "", "", "", "DE_XUAT_CHUA_DUYET"], ["SCM-06-08", "6_BANG_TRA", "Điều 14: tính lợi ích", "Phương pháp tính lợi ích phải nêu trong luật quốc gia hoặc văn bản hướng dẫn và áp dụng minh bạch. Góp vốn không có lợi ích trừ khi trái thông lệ đầu tư tư nhân; cho vay và bảo lãnh: lợi ích là chênh lệch với vay thương mại; cung cấp hay mua hàng: so với mức thanh toán thích đáng theo điều kiện thị trường nơi cung cấp hay mua.", "SCM Điều 14", "QUY_DINH_RO_DOI_CHIEU_BAN_DICH_DRIVE_DIEN_GIAI", "", "", "", "DE_XUAT_CHUA_DUYET"], ["SCM-06-09", "6_BANG_TRA", "Điều 19, 20, 21: thuế, hồi tố, thời hạn", "Sau khi tham vấn và xác định có trợ cấp, có thiệt hại qua trợ cấp, thì có thể đánh thuế đối kháng trừ khi trợ cấp được rút bỏ. Mức thuế bằng hoặc thấp hơn mức trợ cấp, không phân biệt nguồn. Chỉ áp dụng cho hàng đưa vào tiêu thụ sau khi quyết định có hiệu lực, có ngoại lệ hồi tố (Điều 20, trong trường hợp nghiêm trọng lùi tối đa 90 ngày trước biện pháp tạm thời). Thuế chỉ tồn tại khi và chừng nào cần thiết, rà soát khi có yêu cầu, kết thúc sau nhất 5 năm trừ khi rà soát cho thấy trợ cấp và tổn hại có khả năng tiếp diễn.", "SCM Điều 19, 20, 21", "QUY_DINH_RO_DOI_CHIEU_BAN_DICH_DRIVE_DIEN_GIAI", "", "", "", "DE_XUAT_CHUA_DUYET"], ["SCM-06-10", "6_BANG_TRA", "Điều 27: nước đang phát triển", "Nước đang phát triển được thời hạn chuyển tiếp với các cấm Điều 3 (trừ các nước trong Phụ lục VII miễn cấm xuất khẩu), không bị suy đoán gây tổn hại nghiêm trọng theo Điều 6.1, và điều tra thuế đối kháng chấm dứt khi trợ cấp không vượt 2% trị giá (3% trong một số trường hợp đã xoá bỏ trợ cấp xuất khẩu) hoặc khối lượng nhập khẩu được trợ cấp dưới 4% tổng nhập khẩu (trừ khi tổng các nước dưới 4% vượt 9%). Thời hạn 5 năm, 8 năm trong điều khoản tính từ ngày Hiệp định WTO có hiệu lực, nhiều khả năng đã qua.", "SCM Điều 27", "QUY_DINH_RO_DOI_CHIEU_BAN_DICH_DRIVE_DIEN_GIAI", "", "", "", "DE_XUAT_CHUA_DUYET"], ["SCM-07", "7_GHI_CHU_NGUON", "Ghi chú nguồn và giới hạn đối chiếu", "Nguồn duy nhất: bản dịch tiếng Việt Hiệp định SCM nằm trong tệp văn bản pháp luật WTO anh đã lưu trong Drive. Bản này có dấu hiệu là bản sao từ một trang chia sẻ tài liệu học tập, không phải bản đăng chính thức của WTO, và có lỗi chính tả và câu chữ chưa mượt. Chưa đối chiếu bản tiếng Anh chính thức vì các trang WTO không truy cập được từ môi trường làm việc. Chưa đọc: Điều 17, 18, 22 đến 26, 28, 29 và các Phụ lục (Phụ lục I về biểu minh trợ cấp xuất khẩu, Phụ lục VII về nước đang phát triển). Chưa làm Điều 8, 9, Điều 15 chi tiết (những nhân tố đánh giá thiệt hại, quan hệ nhân quả). Không đối chiếu án lệ hay bình luận. Trạng thái các điều khoản chuyển tiếp (Điều 27, 31) và việc Cơ quan Phúc thẩm hiện có hoạt động hay không (nhắc tới ở Điều 4.9, 7.7) chưa xác minh, xem bài DSU. Các ví dụ là tình huống giả định. Toàn bộ cần anh duyệt.", "", "CHUA_XAC_MINH", "https://drive.google.com/file/d/1ZvH0_KdKGC1u_p8PFJIogjHLyXSgWhd_/view", "", "", "DE_XUAT_CHUA_DUYET"]], "SOAN_THU_20261026_GHEP": [["GHEP-00", "0_PHAM_VI", "Chủ đề và cách đọc", "Bài ghép này không có kiến thức mới. Nó đặt các bài đã học lên cùng một lô hàng để thấy luật nào điều chỉnh chặng nào: CISG (phạm vi, hình thành hợp đồng, miễn trách nhiệm), Incoterms 2020 (rủi ro, chi phí, bảo hiểm), và luật WTO (trợ cấp, thuế đối kháng, giải quyết tranh chấp giữa các quốc gia). Nên đọc sau khi đã học các bài thành phần. Mọi điều khoản trích ở đây đã có trong các bài trước, với đúng giới hạn kiểm chứng của từng bài.", "CISG Điều 1 đến 6, 79; Incoterms 2020; SCM Điều 1 đến 5, 10, 19", "QUAN_DIEM_GIANG_DAY", "", "", "", "DE_XUAT_CHUA_DUYET"], ["GHEP-01", "1_CAU_HOI", "Câu hỏi đời thường", "Công ty A ở Việt Nam bán một lô thép cho công ty B ở Hàn Quốc, điều kiện CIF Busan. Trên đường đi xảy ra ba chuyện: tàu gặp bão, nước A bất ngờ cấm xuất khẩu thép ở lô sau, và nước B mở điều tra thuế đối kháng với thép nhập khẩu. Mỗi chuyện do luật nào quyết định, và ai là bên có quyền hành động?", "", "QUAN_DIEM_GIANG_DAY", "", "", "", "DE_XUAT_CHUA_DUYET"], ["GHEP-02", "2_QUY_TAC", "Quy tắc một câu", "Có hai tầng luật khác chủ thể. Tầng tư điều chỉnh quan hệ giữa hai thương nhân: CISG nếu áp dụng được, và Incoterms nếu hợp đồng dẫn chiếu để chia rủi ro, chi phí, giao nhận. Tầng công điều chỉnh các biện pháp của quốc gia với thương mại: cam kết WTO của mỗi nước, như trợ cấp và thuế đối kháng. Thương nhân hành động theo hợp đồng; quốc gia mới là bên đưa tranh chấp ra WTO.", "CISG Điều 1(1); Incoterms 2020 phần giới thiệu; SCM Điều 4, 7, 10", "QUAN_DIEM_GIANG_DAY", "", "", "", "DE_XUAT_CHUA_DUYET"], ["GHEP-03A", "3_SO_DO", "Dòng thời gian của một lô hàng", "Sáu mốc từ lúc ký hợp đồng đến lúc nước nhập khẩu xét thuế. Giữa các mốc là luật điều chỉnh từng chặng.", "CISG Điều 23; Incoterms 2020 CIF A3, A4, A5, A7, B7; SCM Điều 11", "DOI_CHIEU_BAN_GIAI_THICH_VN_CHUA_CO_BAN_GOC", "", "DONG_THOI_GIAN", "{\"events\":[{\"id\":\"t1\",\"label\":\"A và B ký hợp đồng, B chấp nhận chào hàng (CISG Điều 23)\"},{\"id\":\"t2\",\"label\":\"A thông quan xuất khẩu (CIF A7)\"},{\"id\":\"t3\",\"label\":\"Hàng lên tàu ở Hải Phòng: rủi ro chuyển sang B (CIF A3, B3)\"},{\"id\":\"t4\",\"label\":\"Tàu đến Busan\"},{\"id\":\"t5\",\"label\":\"B thông quan nhập khẩu và nộp thuế nhập khẩu (CIF B7)\"},{\"id\":\"t6\",\"label\":\"Nước B có thể mở điều tra thuế đối kháng (SCM Điều 11)\"}],\"spans\":[{\"from\":\"t1\",\"to\":\"t2\",\"label\":\"Hợp đồng hình thành theo CISG. A chuẩn bị hàng, thủ tục xuất khẩu. Nếu có trở ngại ngoài tầm kiểm soát thì xét Điều 79\"},{\"from\":\"t2\",\"to\":\"t3\",\"label\":\"A chịu rủi ro đến khi hàng lên tàu\"},{\"from\":\"t3\",\"to\":\"t4\",\"label\":\"B chịu rủi ro nhưng A đã thuê tàu và mua bảo hiểm cho B (CIF A4, A5)\"},{\"from\":\"t4\",\"to\":\"t5\",\"label\":\"Quyền và nghĩa vụ nhập khẩu thuộc về B\"},{\"from\":\"t5\",\"to\":\"t6\",\"label\":\"Câu chuyện chuyển sang luật công: thuế đối kháng do nước B áp theo cam kết WTO của nước đó\"}]}", "DE_XUAT_CHUA_DUYET"], ["GHEP-03B", "3_SO_DO", "Ma trận: chuyện gì do luật nào quyết định", "Mỗi dòng là một chuyện xảy ra. Cột cho biết luật điều chỉnh, và ai là bên hành động.", "CISG; Incoterms 2020; SCM", "DOI_CHIEU_BAN_GIAI_THICH_VN_CHUA_CO_BAN_GOC", "", "MA_TRAN", "{\"cols\":[\"Luật điều chỉnh\",\"Căn cứ\",\"Ai hành động\"],\"rows\":[{\"label\":\"Hợp đồng đã hình thành chưa\",\"cells\":[\"CISG nếu áp dụng được\",\"Điều 14 đến 24\",\"A và B\"]},{\"label\":\"Hàng hỏng trên biển, ai chịu rủi ro\",\"cells\":[\"Incoterms nếu hợp đồng dẫn chiếu\",\"CIF A3, B3\",\"B chịu, đòi bảo hiểm mà A đã mua\"]},{\"label\":\"A không giao được vì lệnh cấm bất ngờ\",\"cells\":[\"CISG\",\"Điều 79\",\"A viện dẫn, phải thông báo cho B\"]},{\"label\":\"Ai làm thủ tục và nộp thuế nhập khẩu\",\"cells\":[\"Incoterms\",\"CIF B7\",\"B\"]},{\"label\":\"Nước B đánh thuế đối kháng\",\"cells\":[\"Luật nước B theo cam kết WTO\",\"SCM Phần V\",\"Cơ quan có thẩm quyền của nước B\"]},{\"label\":\"Nước A kiện về thuế đối kháng hay trợ cấp\",\"cells\":[\"Luật WTO\",\"SCM Điều 4, 7\",\"Quốc gia, không phải doanh nghiệp\"]}]}", "DE_XUAT_CHUA_DUYET"], ["GHEP-03C", "3_SO_DO", "Cây quyết định: vấn đề này thuộc tầng nào", "Năm câu hỏi giúp đưa một tình huống về đúng bộ luật.", "CISG Điều 1 đến 6; Incoterms 2020; SCM", "QUAN_DIEM_GIANG_DAY", "", "CAY_QUYET_DINH", "{\"start\":\"q1\",\"nodes\":[{\"id\":\"q1\",\"cspl\":\"Phân định công tư\",\"text\":\"Người tranh chấp hoặc hành động là hai thương nhân với nhau theo một hợp đồng?\",\"yes\":\"q2\",\"no\":\"e1\"},{\"id\":\"q2\",\"cspl\":\"Incoterms, SCM\",\"text\":\"Chuyện đang hỏi là thuế nhập khẩu, thuế đối kháng hay biện pháp của nhà nước nước nhập khẩu?\",\"yes\":\"e2\",\"no\":\"q3\"},{\"id\":\"q3\",\"cspl\":\"CISG Điều 1 đến 6\",\"text\":\"CISG áp dụng cho hợp đồng này (trụ sở ở hai nước thành viên, không thuộc nhóm bị loại ra, hai bên không loại trừ)?\",\"yes\":\"q4\",\"no\":\"e3\"},{\"id\":\"q4\",\"cspl\":\"Incoterms 2020\",\"text\":\"Hợp đồng đã dẫn chiếu Incoterms, và chuyện đang hỏi là chia rủi ro, chi phí, giao nhận hay bảo hiểm?\",\"yes\":\"e4\",\"no\":\"e5\"}],\"ends\":[{\"id\":\"e1\",\"text\":\"Luật công: các cam kết WTO của quốc gia. Chỉ quốc gia mới đưa tranh chấp ra DSB.\"},{\"id\":\"e2\",\"text\":\"Do luật nước nhập khẩu theo cam kết WTO của nước đó điều chỉnh, không phải CISG hay Incoterms. Incoterms chỉ nói ai phải làm thủ tục nhập khẩu.\"},{\"id\":\"e3\",\"text\":\"Luật quốc gia do quy tắc tư pháp quốc tế chỉ ra, cộng với điều khoản hợp đồng.\"},{\"id\":\"e4\",\"text\":\"Theo Incoterms đã chọn trong phạm vi của nó. Phần ngoài phạm vi (quyền sở hữu, thanh toán, chế tài) theo CISG và hợp đồng.\"},{\"id\":\"e5\",\"text\":\"Theo CISG và điều khoản hợp đồng.\"}]}", "DE_XUAT_CHUA_DUYET"], ["GHEP-04A", "4_VI_DU", "Ví dụ 1: tàu gặp bão", "A bán thép CIF Busan cho B. Hàng lên tàu 1/3, ngày 5/3 tàu gặp bão và hàng hỏng. Bước 1: xét CISG có áp dụng không (giả định cả hai nước là thành viên và hai bên không loại trừ). Bước 2: rủi ro chuyển cho B khi hàng lên tàu theo CIF A3, B3. Bước 3: B vẫn phải trả tiền hàng, và đòi bồi thường trực tiếp công ty bảo hiểm mà A đã mua theo A5. Kết luận: B chịu rủi ro nhưng được bảo hiểm bù. Tình huống là giả định.", "CISG Điều 1(1); Incoterms 2020 CIF A3, A5, B3", "DOI_CHIEU_BAN_GIAI_THICH_VN_CHUA_CO_BAN_GOC", "", "", "", "DE_XUAT_CHUA_DUYET"], ["GHEP-04B", "4_VI_DU", "Ví dụ 2: nước A cấm xuất khẩu", "Tháng 1 A ký hợp đồng giao thép tháng 5. Tháng 4 nhà nước A bất ngờ cấm xuất khẩu thép, A không giao được. Bước 1: theo CIF, thông quan xuất khẩu là việc của A, nên A không thể nói đó là việc của B. Bước 2: nhưng lệnh cấm là trở ngại ngoài tầm kiểm soát và không lường trước được lúc ký, nên xét Điều 79(1) CISG. Bước 3: A phải thông báo cho B trong thời hạn hợp lý (Điều 79(4)). Kết luận: A có thể được miễn bồi thường thiệt hại trong thời gian lệnh cấm còn hiệu lực, còn B vẫn có thể dùng các biện pháp khác như hủy hợp đồng nếu đủ điều kiện (Điều 79(5)). Việc lệnh cấm cụ thể có thuộc phạm vi trở ngại hay không cần xem từng vụ. Tình huống là giả định.", "CISG Điều 79; Incoterms 2020 CIF A7", "DOI_CHIEU_BAN_GIAI_THICH_VN_CHUA_CO_BAN_GOC", "", "", "", "DE_XUAT_CHUA_DUYET"], ["GHEP-04C", "4_VI_DU", "Ví dụ 3: nước B mở điều tra thuế đối kháng", "Trong lúc hàng đang trên tàu, cơ quan có thẩm quyền của nước B nhận đơn của ngành thép nước B và mở điều tra thuế đối kháng với thép từ A. Bước 1: đây là quan hệ giữa nhà nước B với hàng nhập khẩu, thuộc luật công, không phải CISG hay Incoterms. Bước 2: theo CIF, người mua B làm thủ tục và nộp thuế nhập khẩu (bản giải thích tiếng Việt), nên nếu có thuế đối kháng thì chi phí nhập khẩu rơi vào B trước. Bước 3: thuế chỉ áp dụng cho hàng đưa vào tiêu thụ sau khi quyết định có hiệu lực, trừ ngoại lệ hồi tố (SCM Điều 20.1, 20.6). Bước 4: nước A, chứ không phải công ty A, có thể kiện lên DSB nếu cho rằng biện pháp của B vi phạm WTO. Hai bên còn có thể có thỏa thuận riêng trong hợp đồng về ai chịu rủi ro thuế mới, ngoài phạm vi bài này. Tình huống là giả định.", "SCM Điều 10, 11, 19, 20; Incoterms 2020 CIF B7", "DOI_CHIEU_BAN_GIAI_THICH_VN_CHUA_CO_BAN_GOC", "", "", "", "DE_XUAT_CHUA_DUYET"], ["GHEP-05A", "5_BAY", "Bẫy 1: Incoterms không phải luật và không chuyển quyền sở hữu", "Incoterms mô tả nghĩa vụ, rủi ro, chi phí giữa người bán và người mua, nhưng không phải luật áp dụng cho hợp đồng và không quyết định việc chuyển quyền sở hữu hàng hóa (Incoterms 2020 phần giới thiệu). Rủi ro chuyển không có nghĩa quyền sở hữu cũng chuyển. Cả CISG cũng không điều chỉnh tác động của hợp đồng đến quyền sở hữu (Điều 4).", "Incoterms 2020 phần giới thiệu; CISG Điều 4", "QUY_DINH_RO_DOI_CHIEU_ICC_ANH_DIEN_GIAI", "https://drive.google.com/file/d/16pmTsELToNtEPHMyhgDw7iI7ojShsd6N/view", "", "", "DE_XUAT_CHUA_DUYET"], ["GHEP-05B", "5_BAY", "Bẫy 2: doanh nghiệp không kiện lên WTO", "Các bài về trợ cấp mô tả tham vấn và đưa ra DSB giữa các thành viên (SCM Điều 4.1, 4.4, 7.1, 7.4). Doanh nghiệp nhập khẩu bị đánh thuế đối kháng không tự kiện lên DSB; họ dùng quyền tham gia điều tra và rà soát trong nước (SCM Điều 12, 21), còn nước họ mới đưa ra WTO. Điểm doanh nghiệp không được đưa vụ ra DSB là cách hiểu theo giảng dạy, chưa đối chiếu DSU trong bài này.", "SCM Điều 4, 7, 12, 21", "QUAN_DIEM_GIANG_DAY; CHUA_XAC_MINH", "", "", "", "DE_XUAT_CHUA_DUYET"], ["GHEP-05C", "5_BAY", "Bẫy 3: hỏi sai tầng thì trả lời sai luật", "Cùng một lô hàng có nhiều câu hỏi, mỗi câu thuộc một tầng khác nhau. Ai chịu thuế đối kháng không phải câu hỏi của CISG; ai chịu rủi ro hàng hỏng không phải câu hỏi của WTO. Trước khi trích điều khoản, hỏi hai điều: chuyện này là giữa thương nhân hay là biện pháp của nhà nước, và hợp đồng có dẫn chiếu Incoterms hay không.", "", "QUAN_DIEM_GIANG_DAY", "", "", "", "DE_XUAT_CHUA_DUYET"], ["GHEP-05D", "5_BAY", "Bẫy 4: thứ tự ưu tiên nguồn luật", "Bài giảng WTO 24-25 trong Drive của anh ghi thứ tự ưu tiên áp dụng: điều ước quốc tế về thương mại, rồi pháp luật thương mại quốc gia, rồi tập quán thương mại quốc tế, rồi nguyên tắc pháp lý chung, rồi án lệ thương mại. Nếu điều ước và pháp luật quốc gia khác nhau thì ưu tiên điều ước khi cả hai nước tham gia. Đây là ghi chú bài giảng, chưa đối chiếu Luật Điều ước quốc tế 2016 hay Luật Thương mại 2005.", "Ghi chú bài giảng", "QUAN_DIEM_GIANG_DAY; CHUA_XAC_MINH", "https://drive.google.com/file/d/1Ai0ltjDV658sDsj1jSWGPz_9o7H4_URL/view", "", "", "DE_XUAT_CHUA_DUYET"], ["GHEP-06-01", "6_BANG_TRA", "Tra nhanh: hợp đồng hình thành khi nào", "CISG Điều 14 đến 24. Xem bài Hợp đồng hình thành.", "CISG Điều 14 đến 24", "QUY_DINH_RO_DOI_CHIEU_UNTS_DIEN_GIAI", "", "", "", "DE_XUAT_CHUA_DUYET"], ["GHEP-06-02", "6_BANG_TRA", "Tra nhanh: CISG có áp dụng không, loại trừ, miễn trách nhiệm", "CISG Điều 1 đến 6, 10, 79, 80. Xem bài Phạm vi CISG.", "CISG Điều 1 đến 6, 10, 79, 80", "QUY_DINH_RO_DOI_CHIEU_UNTS_DIEN_GIAI", "", "", "", "DE_XUAT_CHUA_DUYET"], ["GHEP-06-03", "6_BANG_TRA", "Tra nhanh: rủi ro, chi phí, bảo hiểm", "Incoterms 2020: FAS, CFR, CIF, CIP. Xem bài Incoterms.", "Incoterms 2020", "DOI_CHIEU_BAN_GIAI_THICH_VN_CHUA_CO_BAN_GOC", "", "", "", "DE_XUAT_CHUA_DUYET"], ["GHEP-06-04", "6_BANG_TRA", "Tra nhanh: trợ cấp và thuế đối kháng", "SCM Điều 1 đến 7, 10, 11, 14, 19 đến 21, 27. Xem bài Trợ cấp và thuế đối kháng.", "SCM", "QUY_DINH_RO_DOI_CHIEU_BAN_DICH_DRIVE_DIEN_GIAI", "", "", "", "DE_XUAT_CHUA_DUYET"], ["GHEP-06-05", "6_BANG_TRA", "Tra nhanh: chống bán phá giá, tự vệ, giải quyết tranh chấp", "Xem các bài Phòng vệ thương mại và DSU/WTO.", "ADA, SA, DSU", "QUY_DINH_RO_DOI_CHIEU_BAN_DICH_DRIVE_DIEN_GIAI", "", "", "", "DE_XUAT_CHUA_DUYET"], ["GHEP-07", "7_GHI_CHU_NGUON", "Ghi chú nguồn và giới hạn", "Bài ghép chỉ tổng hợp các bài đã soạn nên thừa hưởng nguyên các giới hạn của chúng: FAS, CFR, CIF dựa vào bản giải thích tiếng Việt chưa có bản gốc ICC; trợ cấp và thuế đối kháng dựa vào bản dịch tiếng Việt trong Drive; CISG đối chiếu bản của Liên Hợp Quốc nhưng chưa đối chiếu bản tiếng Việt chính thức. Các câu về ai kiện được lên DSB và thứ tự nguồn luật là ghi chú giảng dạy chưa đối chiếu. Các ví dụ là tình huống giả định. Toàn bộ cần anh duyệt.", "", "CHUA_XAC_MINH", "", "", "", "DE_XUAT_CHUA_DUYET"]], "SOAN_THU_20261026_THUAT_NGU": [["TN-00", "0_PHAM_VI", "Cách dùng bảng thuật ngữ", "Mỗi thuật ngữ dưới đây giải thích bằng một đến hai câu, kèm điều khoản gốc để tra lại. Bảng chỉ gồm thuật ngữ từ các bài CISG, Incoterms và Trợ cấp, vì những bài này đã đối chiếu với văn bản gốc. Thuật ngữ của MFN, NT, ngoại lệ và DSU/WTO, chống bán phá giá, tự vệ sẽ thêm khi anh duyệt các bài đó.", "", "QUAN_DIEM_GIANG_DAY", "", "", "", "DE_XUAT_CHUA_DUYET"], ["TN-01", "6_BANG_TRA", "Chào hàng (offer)", "Đề nghị giao kết hợp đồng gửi cho người xác định, đủ rõ về hàng, số lượng, giá và thể hiện ý định bị ràng buộc nếu được chấp nhận.", "CISG Điều 14", "QUY_DINH_RO_DOI_CHIEU_UNTS_DIEN_GIAI", "", "", "", "DE_XUAT_CHUA_DUYET"], ["TN-02", "6_BANG_TRA", "Chấp nhận (acceptance)", "Tuyên bố hay hành vi thể hiện đồng ý với chào hàng. Im lặng tự nó không phải chấp nhận. Có hiệu lực khi đến người chào hàng.", "CISG Điều 18", "QUY_DINH_RO_DOI_CHIEU_UNTS_DIEN_GIAI", "", "", "", "DE_XUAT_CHUA_DUYET"], ["TN-03", "6_BANG_TRA", "Chào hàng đối lại (counter-offer)", "Trả lời có thêm, bớt hay sửa đổi chào hàng thì là từ chối và đồng thời là một chào hàng mới. Sửa đổi về giá, thanh toán, chất lượng, số lượng, nơi và thời điểm giao hàng, mức trách nhiệm, giải quyết tranh chấp được coi là thay đổi trọng yếu.", "CISG Điều 19", "QUY_DINH_RO_DOI_CHIEU_UNTS_DIEN_GIAI", "", "", "", "DE_XUAT_CHUA_DUYET"], ["TN-04", "6_BANG_TRA", "Trụ sở kinh doanh", "Nơi xác định liệu hai bên ở hai quốc gia khác nhau hay không. Nhiều trụ sở thì lấy nơi gần nhất với hợp đồng; không có thì lấy nơi cư trú thường xuyên. Quốc tịch không được xét.", "CISG Điều 1, 10", "QUY_DINH_RO_DOI_CHIEU_UNTS_DIEN_GIAI", "", "", "", "DE_XUAT_CHUA_DUYET"], ["TN-05", "6_BANG_TRA", "Trở ngại ngoài tầm kiểm soát", "Sự kiện khiến một bên không thực hiện được hợp đồng, mà lúc ký không thể mong đợi hợp lý bên đó tính đến, tránh hay vượt qua. Có thể được miễn bồi thường thiệt hại trong thời gian trở ngại còn, nhưng phải thông báo.", "CISG Điều 79", "QUY_DINH_RO_DOI_CHIEU_UNTS_DIEN_GIAI", "", "", "", "DE_XUAT_CHUA_DUYET"], ["TN-06", "6_BANG_TRA", "Incoterms", "Bộ quy tắc của ICC mô tả nghĩa vụ, rủi ro và chi phí giữa người bán và người mua. Không phải luật, không quyết định quyền sở hữu, phải được hợp đồng dẫn chiếu, nên ghi kèm năm 2020.", "Incoterms 2020 phần giới thiệu", "QUY_DINH_RO_DOI_CHIEU_ICC_ANH_DIEN_GIAI", "https://drive.google.com/file/d/16pmTsELToNtEPHMyhgDw7iI7ojShsd6N/view", "", "", "DE_XUAT_CHUA_DUYET"], ["TN-07", "6_BANG_TRA", "Địa điểm ghi kèm trong nhóm C", "Với CFR, CIF, CIP, địa điểm ghi kèm là nơi người bán phải tổ chức và trả tiền vận chuyển tới, không phải nơi giao hàng. Rủi ro chuyển ở nơi giao, khác với nơi đến.", "Incoterms 2020 phần giới thiệu", "QUY_DINH_RO_DOI_CHIEU_ICC_ANH_DIEN_GIAI", "https://drive.google.com/file/d/16pmTsELToNtEPHMyhgDw7iI7ojShsd6N/view", "", "", "DE_XUAT_CHUA_DUYET"], ["TN-08", "6_BANG_TRA", "Chuyển rủi ro", "Thời điểm bên mua bắt đầu chịu rủi ro hàng mất mát, hư hỏng. Với CIF là khi hàng được đặt lên tàu (theo bản giải thích tiếng Việt); với CIP là khi giao cho người chuyên chở đầu tiên.", "Incoterms 2020 A3, B3", "DOI_CHIEU_BAN_GIAI_THICH_VN_CHUA_CO_BAN_GOC", "", "", "", "DE_XUAT_CHUA_DUYET"], ["TN-09", "6_BANG_TRA", "Thông quan xuất khẩu và nhập khẩu", "Thủ tục hải quan khi hàng ra và vào biên giới. Với FAS, CFR, CIF, CIP, người bán thông quan xuất khẩu, người mua thông quan nhập khẩu và nộp thuế nhập khẩu.", "Incoterms 2020 A7, B7", "DOI_CHIEU_BAN_GIAI_THICH_VN_CHUA_CO_BAN_GOC", "", "", "", "DE_XUAT_CHUA_DUYET"], ["TN-10", "6_BANG_TRA", "Trợ cấp (subsidy)", "Đóng góp tài chính của chính phủ hoặc cơ quan công cộng (hoặc hỗ trợ thu nhập, giá theo Điều XVI GATT 1994) mà mang lại lợi ích cho người nhận.", "SCM Điều 1", "QUY_DINH_RO_DOI_CHIEU_BAN_DICH_DRIVE_DIEN_GIAI", "", "", "", "DE_XUAT_CHUA_DUYET"], ["TN-11", "6_BANG_TRA", "Tính riêng biệt", "Trợ cấp dành riêng cho một doanh nghiệp, nhóm doanh nghiệp, ngành hay vùng nhất định. Chỉ trợ cấp riêng biệt mới chịu các quy định về cấm, kiện và thuế đối kháng.", "SCM Điều 1.2, 2", "QUY_DINH_RO_DOI_CHIEU_BAN_DICH_DRIVE_DIEN_GIAI", "", "", "", "DE_XUAT_CHUA_DUYET"], ["TN-12", "6_BANG_TRA", "Trợ cấp bị cấm", "Trợ cấp phụ thuộc vào kết quả xuất khẩu hoặc vào việc ưu tiên dùng hàng nội địa. Thành viên không được cấp hay duy trì, trừ quy định khác trong Hiệp định Nông nghiệp.", "SCM Điều 3", "QUY_DINH_RO_DOI_CHIEU_BAN_DICH_DRIVE_DIEN_GIAI", "", "", "", "DE_XUAT_CHUA_DUYET"], ["TN-13", "6_BANG_TRA", "Thuế đối kháng (countervailing duty)", "Khoản thuế riêng nước nhập khẩu tự áp sau điều tra để triệt tiêu trợ cấp đối với hàng nhập khẩu gây tổn hại. Không được cao hơn mức trợ cấp.", "SCM Điều 10, 19; chú thích 40", "QUY_DINH_RO_DOI_CHIEU_BAN_DICH_DRIVE_DIEN_GIAI", "", "", "", "DE_XUAT_CHUA_DUYET"], ["TN-14", "6_BANG_TRA", "Biện pháp đối kháng (countermeasure)", "Biện pháp do DSB cho phép sau khi một thành viên thắng kiện mà bên kia không thực hiện khuyến nghị. Khác với thuế đối kháng.", "SCM Điều 4.10, 7.9", "QUY_DINH_RO_DOI_CHIEU_BAN_DICH_DRIVE_DIEN_GIAI", "", "", "", "DE_XUAT_CHUA_DUYET"], ["TN-15", "6_BANG_TRA", "DSB, tham vấn, ban hội thẩm", "DSB là Cơ quan giải quyết tranh chấp của WTO. Tham vấn là bước đầu hai bên bàn giải pháp. Không xong thì đưa ra DSB để lập ban hội thẩm xem xét và báo cáo. Chi tiết xem bài DSU/WTO.", "SCM Điều 4.4, 7.4", "QUY_DINH_RO_DOI_CHIEU_BAN_DICH_DRIVE_DIEN_GIAI", "", "", "", "DE_XUAT_CHUA_DUYET"], ["TN-16", "6_BANG_TRA", "Mức tối thiểu (de minimis)", "Mức quá nhỏ để đáng tiến hành điều tra. Trong thuế đối kháng, trợ cấp dưới 1% trị giá sản phẩm; với nước đang phát triển, ngưỡng chấm dứt là 2%.", "SCM Điều 11.9, 27.10", "QUY_DINH_RO_DOI_CHIEU_BAN_DICH_DRIVE_DIEN_GIAI", "", "", "", "DE_XUAT_CHUA_DUYET"], ["TN-17", "7_GHI_CHU_NGUON", "Ghi chú nguồn", "Giải thích lấy từ chính các bài đã soạn, nên kế thừa nguyên giới hạn kiểm chứng của chúng (xem ghi chú nguồn của từng bài). Thuật ngữ được viết lại theo cách dễ hiểu, không chèn nguyên văn. Cần anh duyệt.", "", "CHUA_XAC_MINH", "", "", "", "DE_XUAT_CHUA_DUYET"]]};</script>

function dgNode(e,st){

  var tag=e.tagName,cls=(e.getAttribute('class')||'').toLowerCase();
  if(/^(A|SCRIPT|STYLE|FIGCAPTION|BUTTON)$/.test(tag))return null;
  var tx=e.textContent.replace(/\s+/g,' ').trim();
  if(!tx)return null;
  if(/^[→←↑↓↔⇒⇄▼▲]+$/.test(tx))return el('div','dg-ar',tx.charAt(0));
  if(tag==='TABLE'){var tb=buildTable(e.outerHTML);if(tb){var sc=el('div','scroll');sc.appendChild(tb);return sc;}}
  if(tag==='UL'||tag==='OL'){var u=el('ul','l');Array.prototype.forEach.call(e.children,function(li){var s=li.textContent.replace(/\s+/g,' ').trim();if(s)u.appendChild(el('li','',s));});return u.children.length?u:null;}
  if(!e.children.length){
    var leaf=el('div','dg-t'+(/^(STRONG|B|H1|H2|H3|H4)$/.test(tag)?' s':tag==='SMALL'?' m':''),tx);
    if(/chip|badge|tag/.test(cls))leaf.className='dg-chip';
    return leaf;
  }
  st.d++;
  var kids=[];
  Array.prototype.forEach.call(e.childNodes,function(c){
    if(c.nodeType===3){var s=c.nodeValue.replace(/\s+/g,' ').trim();if(s&&!/^[→←↑↓↔⇒⇄▼▲]+$/.test(s))kids.push(el('div','dg-t',s));}
    else{var k=dgNode(c,st);if(k)kids.push(k);}
  });
  st.d--;
  if(!kids.length)return null;
  var row=/column|row|grid|branches|cols/.test(cls),box=/node|branch|card|box|step|item/.test(cls);
  var d=el('div',(row?'dg-row':'dg-col')+(box?' dg-box':''));
  kids.forEach(function(k){d.appendChild(k);});
  return d;
}

    c.appendChild(document.createElement('br'));c.appendChild(bt);q.appendChild(c);

}
function pickTable(b,ctx){
  var list=ctx.tables;
  var hit=list.filter(function(t){return b.link.indexOf(t.id)>=0||b.fig===t.id;})[0];
  if(!hit&&ctx.bangCount===list.length)hit=list[ctx.bangIdx];
  ctx.bangIdx++;
  if(!hit)return null;
  var node=buildTable(hit.html);if(!node)return null;
  return {id:hit.id,node:node};
}
function pickFig(b,ctx){
  var list=ctx.figs;
  var hit=list.filter(function(t){return b.link.indexOf(t.id)>=0||b.fig===t.id;})[0];
  if(!hit&&ctx.figCount===list.length)hit=list[ctx.figIdx];
  ctx.figIdx++;return hit||null;
}

/* ---------- Bài thử: dựng từ tab SOAN_THU_20261026_CISG_HINH_THANH ---------- */
function vlabel(v){
  v=String(v||'');
  if(v.indexOf('CHUA_XAC_MINH')>=0)return {t:'Chưa xác minh',w:true};
  if(v.indexOf('BAN_GIAI_THICH_VN')>=0)return {t:'Đối chiếu bản giải thích tiếng Việt, chưa có bản gốc ICC (diễn giải)',w:true};
  if(v.indexOf('QUY_DINH_RO_DOI_CHIEU_ICC')>=0)return {t:'Quy định rõ · đối chiếu bản tiếng Anh của ICC (diễn giải)',w:false};
  if(v.indexOf('QUY_DINH_RO_DOI_CHIEU_BAN_DICH')>=0)return {t:'Quy định rõ · đối chiếu bản dịch tiếng Việt trong Drive (diễn giải)',w:false};
  if(v.indexOf('QUY_DINH_RO_DOI_CHIEU_WTO')>=0)return {t:'Quy định rõ · đối chiếu bản đăng tại WTO (diễn giải)',w:false};
  if(v.indexOf('QUY_DINH_RO')>=0)return {t:'Quy định rõ · đối chiếu bản của Liên Hợp Quốc (diễn giải)',w:false};
  if(v.indexOf('QUAN_DIEM')>=0)return {t:'Quan điểm giảng dạy',w:false};
  return null;
}
function pmeta(n,r){

function pcard(r,cls){
  var n=el('aside','call '+(cls||''));
  n.appendChild(el('div','call-l',r.title));
  paras(n,r.text);pmeta(n,r);return n;

function ptree(r){
  var spec=null;try{spec=JSON.parse(r.data);}catch(e){}
  var box=el('figure','dg');
  box.appendChild(el('div','dg-kick','Cây quyết định · bấm để tự suy ra'));
  box.appendChild(el('div','dg-cap',r.title));
  if(!spec||!spec.nodes){box.appendChild(el('p','',r.text));return box;}
  var N={},E={};
  spec.nodes.forEach(function(n){N[n.id]=n;});(spec.ends||[]).forEach(function(n){E[n.id]=n;});
  var trail=el('div','chips'),stage=el('div'),path=[];
  stage.setAttribute('aria-live','polite');
  box.appendChild(trail);box.appendChild(stage);
  function show(id){
    stage.innerHTML='';trail.innerHTML='';
    path.forEach(function(p){trail.appendChild(el('span','chip',p.c+' · '+(p.a?'Có':'Không')));});
    if(E[id]){
      var e=el('div','case');e.appendChild(el('b','','Kết luận'));e.appendChild(document.createTextNode(E[id].text));
      var rs=el('div','yn'),b=el('button','','Làm lại');b.type='button';
      b.addEventListener('click',function(){path=[];show(spec.start);});
      rs.appendChild(b);e.appendChild(rs);stage.appendChild(e);return;
    }
    var n=N[id];if(!n)return;
    var q=el('div','idea');q.appendChild(el('b','',n.cspl||''));q.appendChild(document.createTextNode(n.text));stage.appendChild(q);
    var yn=el('div','yn');
    [['Có',true,n.yes],['Không',false,n.no]].forEach(function(o){
      var b=el('button',o[1]?'y':'',o[0]);b.type='button';
      b.addEventListener('click',function(){path.push({c:n.cspl||id,a:o[1]});show(o[2]);});
      yn.appendChild(b);
    });
    stage.appendChild(yn);
  }
  show(spec.start);
  return box;
}
function pmatrix(r){
  var spec=null;try{spec=JSON.parse(r.data);}catch(e){}
